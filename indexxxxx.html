<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محول البون السريع</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: #e8f5f1; padding: 20px; }
       .container { max-width: 1100px; margin: auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h1 { color: #0d7377; text-align: center; margin-bottom: 10px; font-size: 2.5rem; font-weight: 800; }
       .subtitle { text-align: center; color: #666; margin-bottom: 30px; font-size: 1.1rem; }
        textarea { width: 100%; height: 300px; padding: 20px; border: 3px solid #0d7377; border-radius: 15px; font-size: 20px; line-height: 1.8; margin-bottom: 20px; }
        textarea:focus { outline: none; border-color: #0a5a5e; }
       .btn-main { background: #0d7377; color: white; padding: 18px 40px; border: none; border-radius: 12px; cursor: pointer; font-size: 22px; width: 100%; font-weight: 700; transition: 0.3s; }
       .btn-main:hover { background: #0a5a5e; transform: translateY(-2px); }
       .btn-main:active { transform: translateY(0); }
        
        /* صندوق السؤال */
       .question-box { background: #fff9e6; padding: 40px; border-radius: 15px; margin: 30px 0; text-align: center; border: 3px solid #ffc107; }
       .question-box h2 { color: #856404; margin: 0 0 20px 0; font-size: 2rem; }
       .question-box.product-name { color: #0d7377; font-weight: 800; font-size: 2.2rem; }
       .question-box.qty-info { font-size: 1.5rem; margin: 15px 0; color: #333; }
       .question-box p { font-size: 1.3rem; margin: 25px 0; color: #555; }
       .question-box input { padding: 15px; font-size: 24px; width: 200px; text-align: center; border: 3px solid #0d7377; border-radius: 10px; margin: 0 15px; font-weight: 700; }
       .question-box button { width: auto; padding: 15px 50px; margin-top: 20px; font-size: 20px; }
       .progress { text-align: center; color: #666; margin: 15px 0; font-size: 16px; font-weight: 600; }
        
        /* الجدول النهائي */
       .result-box { background: #e8f5e9; padding: 30px; border-radius: 15px; margin-top: 30px; border: 3px solid #10b981; }
       .result-box h3 { color: #2e7d32; margin: 0 0 20px 0; font-size: 1.8rem; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 18px; }
        th, td { border: 2px solid #ddd; padding: 18px; text-align: right; }
        th { background: #0d7377; color: white; font-size: 20px; font-weight: 700; }
        tr { background: white; transition: 0.3s; }
        tr.done { background: #c8e6c9!important; }
        tr.done td { color: #1b5e20; font-weight: 600; }
       .checkbox { width: 30px; height: 30px; cursor: pointer; accent-color: #10b981; }
       .result-text { color: #0d7377; font-weight: 800; font-size: 20px; }
       .remainder { color: #f59e0b; font-weight: 800; font-size: 20px; }
       .btn-new { background: #0d7377; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>محول البون السريع 🚚</h1>
        <p class="subtitle">حط اللائحة ديالك هنا - سطر فيه الرقم، وسطر فيه اسم المنتج</p>
        
        <div id="inputSection">
            <textarea id="productsInput" placeholder="مثال:&#10;12&#10;zayna&#10;16&#10;dalaa vp 2&#10;15&#10;dalaa new born&#10;120&#10;dalaa 550"></textarea>
            <button class="btn-main" onclick="startProcess()">بدا التحويل</button>
        </div>

        <div id="questionSection" style="display:none;"></div>
        <div id="resultSection" style="display:none;"></div>
    </div>

    <script>
        let productsList = [];
        let currentIndex = 0;
        let productsData = {};

        function startProcess() {
            const text = document.getElementById('productsInput').value.trim();
            if (!text) {
                alert('دخل اللائحة عافاك');
                return;
            }

            // نقراو السطور: سطر رقم، سطر اسم، سطر رقم، سطر اسم...
            const lines = text.split('\n').map(l => l.trim()).filter(l => l);
            productsList = [];
            
            for (let i = 0; i < lines.length; i += 2) {
                const qtyLine = lines[i];
                const nameLine = lines[i + 1];
                
                if (!qtyLine ||!nameLine) continue;
                
                const qty = parseInt(qtyLine);
                if (!isNaN(qty) && qty > 0) {
                    productsList.push({
                        qty: qty,
                        name: nameLine.toLowerCase()
                    });
                }
            }

            if (productsList.length === 0) {
                alert('الصيغة غالطة. خاص سطر فيه الرقم، وسطر فيه الاسم\nمثال:\n12\nzayna');
                return;
            }

            document.getElementById('inputSection').style.display = 'none';
            currentIndex = 0;
            productsData = {};
            askNextQuestion();
        }

        function askNextQuestion() {
            if (currentIndex >= productsList.length) {
                showFinalResult();
                return;
            }

            const product = productsList[currentIndex];
            const html = `
                <div class="question-box">
                    <h2>المنتج: <span class="product-name">${product.name}</span></h2>
                    <div class="qty-info">الكمية المطلوبة في البون: <strong>${product.qty}</strong></div>
                    <p>كم تحتوي العلبة الواحدة من قطعة؟</p>
                    <input type="number" id="piecesAnswer" placeholder="العدد" min="1" autofocus>
                    <br>
                    <button class="btn-main" onclick="saveAnswer()">التالي ➜</button>
                    <div class="progress">سؤال ${currentIndex + 1} من ${productsList.length}</div>
                </div>
            `;
            document.getElementById('questionSection').innerHTML = html;
            document.getElementById('questionSection').style.display = 'block';
            document.getElementById('piecesAnswer').focus();
            
            document.getElementById('piecesAnswer').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') saveAnswer();
            });
        }

        function saveAnswer() {
            const pieces = parseInt(document.getElementById('piecesAnswer').value);
            if (!pieces || pieces < 1) {
                alert('دخل عدد صحيح عافاك');
                return;
            }

            const product = productsList[currentIndex];
            productsData[product.name] = pieces;
            currentIndex++;
            askNextQuestion();
        }

        function showFinalResult() {
            document.getElementById('questionSection').style.display = 'none';
            
            let html = '<div class="result-box"><h3>✅ النتيجة النهائية - آش خاصك تشارجي</h3>';
            html += '<table><tr><th>#</th><th>المنتج</th><th>الكمية المطلوبة</th><th>شحال فالعلبة</th><th>النتيجة</th><th>تم</th></tr>';
            
            productsList.forEach((product, i) => {
                const pieces = productsData[product.name];
                const boxes = Math.floor(product.qty / pieces);
                const remainder = product.qty % pieces;
                
                let resultText = '';
                if (boxes > 0) resultText += `<span class="result-text">${boxes} علبة</span>`;
                if (remainder > 0) {
                    if (resultText) resultText += ' + ';
                    resultText += `<span class="remainder">${remainder} قطع</span>`;
                }
                if (!resultText) resultText = `<span class="remainder">${product.qty} قطع</span>`;
                
                html += `<tr id="row-${i}">
                    <td>${i + 1}</td>
                    <td><strong style="font-size:20px;">${product.name}</strong></td>
                    <td style="font-size:20px; font-weight:700;">${product.qty}</td>
                    <td style="font-size:20px;">${pieces} قطع</td>
                    <td>${resultText}</td>
                    <td><input type="checkbox" class="checkbox" onchange="toggleDone(${i})"></td>
                </tr>`;
            });
            
            html += '</table>';
            html += '<button class="btn-main btn-new" onclick="location.reload()">🔄 بون جديد</button></div>';
            
            document.getElementById('resultSection').innerHTML = html;
            document.getElementById('resultSection').style.display = 'block';
        }

        function toggleDone(index) {
            const row = document.getElementById(`row-${index}`);
            row.classList.toggle('done');
        }
    </script>
</body>
</html>
