(function() {
  if (window.__playableTouchPatchInstalled) return;
  window.__playableTouchPatchInstalled = true;
  var origAdd = EventTarget.prototype.addEventListener;
  var blockedTypes = { touchstart: 1, touchmove: 1, wheel: 1 };
  EventTarget.prototype.addEventListener = function(type, listener, options) {
    if (blockedTypes[type]) {
      if (options === undefined || options === null) {
        options = { passive: true };
      } else if (typeof options === 'boolean') {
        options = { capture: options, passive: true };
      } else {
        options = Object.assign({}, options, { passive: true });
      }
    }
    return origAdd.call(this, type, listener, options);
  };
})();

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getDatabase, ref, get, set, push } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCLIzcO9i8QQ-YzYY5fIap6QNDsJDqgf60",
  authDomain: "karnipromaroc.firebaseapp.com",
  databaseURL: "https://karnipromaroc-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "karnipromaroc",
  storageBucket: "karnipromaroc.firebasestorage.app",
  messagingSenderId: "6746147726",
  appId: "1:6746147726:web:6e3a2d29941ab93ef432df"
};
const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);

let products = [];
let filteredProducts = [];
let currentOrder = []; // {productId, name, qty, price, mainImage}
let currentProductIndex = -1;
let activeClient = localStorage.getItem('activeClient') || '';
let storeOwnerName = localStorage.getItem('ownerName') || localStorage.getItem('storeOwner') || localStorage.getItem('userName') || '';
let galleryImages = [];
let galleryIndex = 0;

// حاول جلب اسم صاحب الحساب من Firebase أو localStorage من index.html
async function loadOwnerName(){
  // من localStorage (يأتي من index.html)
  let owner = localStorage.getItem('ownerName') || localStorage.getItem('storeName') || localStorage.getItem('userName') || localStorage.getItem('clientName') || '';
  // جرب من Firebase config
  try{
    const snap = await get(ref(db, "settings/storeName"));
    if(snap.exists()) owner = snap.val();
    const snap2 = await get(ref(db, "storeInfo/name"));
    if(snap2.exists()) owner = snap2.val();
  } catch(e){}

  if(!owner) owner = "متجري";
  storeOwnerName = owner;
  document.getElementById('storeName').textContent = owner;
  document.getElementById('welcomeTitle').textContent = `أهلاً بك في متجر ${owner}`;
}

async function loadClients(){
  const datalist = document.getElementById('clientsList');
  try{
    // جلب العملاء من Firebase إذا موجودين
    const paths = ["clients", "customers", "users"];
    let clients = [];
    for(const p of paths){
      const snap = await get(ref(db, p));
      if(snap.exists()){
        const val = snap.val();
        Object.values(val).forEach(c=>{
          if(c.name) clients.push(c.name);
          else if(typeof c === 'string') clients.push(c);
        });
      }
    }
    // إضافة من localStorage
    const localClients = JSON.parse(localStorage.getItem('clients')||'[]');
    clients = [...clients, ...localClients];
    // إزالة التكرار
    clients = [...new Set(clients)].filter(Boolean);
    datalist.innerHTML = clients.map(n=>`<option value="${n}">`).join('');
  } catch(e){}
}

async function loadProducts(){
  try{
    const snap = await get(ref(db, "products"));
    if(snap.exists()){
      const val = snap.val();
      products = Object.values(val).map(p=>{
        if(p.image && !p.mainImage) p.mainImage = p.image;
        if(p.mainImage && (!p.images || p.images.length===0)) p.images=[p.mainImage];
        if(!p.images) p.images = p.mainImage ? [p.mainImage] : [];
        if(!p.mainImage && p.images.length>0) p.mainImage = p.images[0];
        return {hidden:false, ...p};
      }).filter(p=>!p.hidden);
    }
  } catch(e){ console.error(e); }
  filteredProducts = [...products];
  renderProducts();
}

function renderProducts(){
  const container = document.getElementById('productsContainer');
  const empty = document.getElementById('emptyState');
  let list = filteredProducts;
  const q = document.getElementById('searchInput').value.toLowerCase();
  if(q) list = list.filter(p=>(p.name||'').toLowerCase().includes(q));

  if(list.length===0){ container.innerHTML=''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');
  container.innerHTML = list.map((p, idx)=>{
    const mainImg = p.mainImage || p.images?.[0] || 'https://via.placeholder.com/300';
    const inOrder = currentOrder.find(o=>o.productId==p.id);
    const qtyBadge = inOrder ? `<span class="absolute top-2 left-2 bg-emerald-600 text-white text-xs px-2 py-1 rounded-full font-bold">${inOrder.qty} مطلوب</span>` : '';
    return `<div class="product-card bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden cursor-pointer" onclick="openOrderModal(${products.indexOf(p)})">
      <div class="relative bg-gray-50">
        <img src="${mainImg}" alt="${p.name}" class="w-full h-48 object-cover" loading="lazy" decoding="async">
        <span class="absolute top-2 right-2 bg-emerald-100 text-emerald-700 text-[11px] px-2.5 py-1 rounded-full font-bold">متوفر</span>
        ${qtyBadge}
      </div>
      <div class="p-3">
        <h3 class="font-semibold text-sm text-gray-900 line-clamp-1 mb-2 text-center">${p.name||'بدون اسم'}</h3>
        <div class="flex items-center justify-between">
          <button class="w-9 h-9 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl flex items-center justify-center"><i class="fa-solid fa-cart-plus text-xs"></i></button>
          <div class="text-left">
            <p class="font-bold text-emerald-600 text-[15px]">${parseFloat(p.price||0).toFixed(2)} <span class="text-[10px] font-normal text-gray-500">درهم</span></p>
            <p class="text-[11px] text-gray-500">المخزون: ${p.stock||0}</p>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

// Client handling
function setActiveClient(name){
  if(!name) { showToast('اكتب اسم العميل','error'); return; }
  activeClient = name;
  localStorage.setItem('activeClient', name);
  document.getElementById('activeClientName').textContent = name;
  document.getElementById('activeClientBar').classList.remove('hidden');
  document.getElementById('orderClientLabel').textContent = `(${name})`;
  document.getElementById('clientNameInput').value = '';
  // حفظ العميل
  let clients = JSON.parse(localStorage.getItem('clients')||'[]');
  if(!clients.includes(name)){ clients.push(name); localStorage.setItem('clients', JSON.stringify(clients)); loadClients(); }
  showToast(`تم اختيار العميل: ${name}`,'success');
  updateProgress();
}

// Order flow
window.openOrderModal = function(globalIndex){
  if(!activeClient){ showToast('اختر العميل أولاً','error'); document.getElementById('clientNameInput').focus(); return; }
  currentProductIndex = globalIndex;
  const p = products[globalIndex];
  if(!p) return;
  const mainImg = p.mainImage || p.images?.[0] || '';
  document.getElementById('orderMainImage').src = mainImg;
  document.getElementById('orderProductName').textContent = p.name;
  document.getElementById('orderPrice').textContent = parseFloat(p.price||0).toFixed(2);
  document.getElementById('orderStock').textContent = p.stock||0;
  document.getElementById('orderStockBadge').textContent = (p.stock||0)>0 ? 'متوفر' : 'غير متوفر';
  const count = p.images?.length||0;
  document.getElementById('orderImagesCount').classList.toggle('hidden', count<=1);
  document.getElementById('orderImagesCount').querySelector('span').textContent = count;
  // thumbs
  const thumbs = document.getElementById('orderThumbs');
  thumbs.innerHTML = (p.images||[]).map((img,i)=>`<img src="${img}" class="thumb w-16 h-16 rounded-xl object-cover border-2 ${i===0?'active':''} border-transparent cursor-pointer" onclick="setOrderMain('${img}',${i})">`).join('');
  // qty existing
  const existing = currentOrder.find(o=>o.productId==p.id);
  document.getElementById('orderQty').value = existing ? existing.qty : 1;
  document.getElementById('orderModal').classList.add('active');
  galleryImages = p.images||[mainImg];
  galleryIndex = 0;
}

function setOrderMain(src, idx){
  document.getElementById('orderMainImage').src = src;
  document.querySelectorAll('.thumb').forEach((t,i)=>t.classList.toggle('active', i===idx));
  galleryIndex = idx;
}
window.setOrderMain = setOrderMain;

window.changeQty = function(d){
  const input = document.getElementById('orderQty');
  let v = parseInt(input.value)||0;
  v+=d;
  if(v<0) v=0;
  input.value=v;
}

window.closeOrderModal = function(){
  document.getElementById('orderModal').classList.remove('active');
}

window.skipProduct = function(){
  // انتقل للمنتج التالي بدون حفظ
  closeOrderModal();
  nextProductAuto();
}

window.confirmAndNext = function(){
  const qty = parseInt(document.getElementById('orderQty').value)||0;
  if(qty<=0){ showToast('أدخل كمية صحيحة','error'); return; }
  const p = products[currentProductIndex];
  if(!p) return;
  const existingIdx = currentOrder.findIndex(o=>o.productId==p.id);
  if(existingIdx>-1) currentOrder[existingIdx].qty = qty;
  else currentOrder.push({productId:p.id, name:p.name, qty, price:p.price, mainImage:p.mainImage||p.images?.[0]});
  
  updateProgress();
  renderProducts();
  closeOrderModal();
  // انتقل تلقائياً للمنتج التالي
  setTimeout(()=>{ nextProductAuto(); }, 300);
}

function nextProductAuto(){
  // ابحث عن المنتج التالي الذي لم يتم طلبه بعد
  let nextIdx = -1;
  for(let i=currentProductIndex+1;i<products.length;i++){
    if(!currentOrder.find(o=>o.productId==products[i].id)){
      nextIdx = i;
      break;
    }
  }
  // إذا لم يوجد، ابدأ من الأول
  if(nextIdx===-1){
    for(let i=0;i<products.length;i++){
      if(!currentOrder.find(o=>o.productId==products[i].id)){
        nextIdx=i; break;
      }
    }
  }
  if(nextIdx!==-1){
    // إذا كان هناك منتجات متبقية، افتح التالي
    if(currentOrder.length < filteredProducts.length){
      setTimeout(()=>openOrderModal(nextIdx), 400);
    } else {
      showToast('تم الانتهاء من جميع المنتجات!','success');
    }
  } else {
    showToast('تم الانتهاء من جميع المنتجات!','success');
  }
}

function updateProgress(){
  const bar = document.getElementById('orderProgress');
  const orderCountEl = document.getElementById('orderCount');
  if(currentOrder.length===0 && !activeClient){
    bar.classList.add('hidden');
    orderCountEl.classList.add('hidden');
    return;
  }
  bar.classList.remove('hidden');
  orderCountEl.classList.remove('hidden');
  orderCountEl.textContent = currentOrder.length;
  document.getElementById('progressText').textContent = `${currentOrder.length} / ${filteredProducts.length}`;
  document.getElementById('progressBar').style.width = `${(currentOrder.length/filteredProducts.length)*100}%`;
  // summary
  const summary = document.getElementById('orderSummary');
  summary.innerHTML = currentOrder.slice(-4).reverse().map(o=>`<div class="bg-gray-50 rounded-lg p-2 flex justify-between"><span class="font-bold truncate">${o.name}</span><span class="text-emerald-600 font-bold">${o.qty}</span></div>`).join('');
}

window.finishOrder = async function(){
  if(!activeClient){ showToast('اختر العميل','error'); return; }
  if(currentOrder.length===0){ showToast('لا يوجد طلبات','error'); return; }
  try{
    const orderData = {
      clientName: activeClient,
      owner: storeOwnerName,
      items: currentOrder,
      totalItems: currentOrder.length,
      totalQty: currentOrder.reduce((s,i)=>s+i.qty,0),
      createdAt: new Date().toISOString(),
      status: 'pending'
    };
    await push(ref(db, "orders"), orderData);
    // حفظ أيضاً في طلبات العميل
    await push(ref(db, `clientOrders/${activeClient}`), orderData);
    showToast(`تم إرسال طلب ${activeClient} بنجاح (${currentOrder.length} منتج)`,'success');
    currentOrder = [];
    updateProgress();
    renderProducts();
  } catch(e){
    showToast('خطأ في الحفظ: '+e.message,'error');
  }
}

window.clearOrder = function(){
  if(confirm('مسح الطلب الحالي؟')){ currentOrder=[]; updateProgress(); renderProducts(); showToast('تم مسح الطلب','info'); }
}

// Gallery
window.openGalleryFromOrder = function(){ openGallery(galleryImages, galleryIndex); }
function openGallery(images, startIdx=0){
  galleryImages = images;
  galleryIndex = startIdx;
  showGallery();
  document.getElementById('galleryModal').classList.add('active');
}
function showGallery(){
  if(!galleryImages.length) return;
  document.getElementById('galleryImage').src = galleryImages[galleryIndex];
  document.getElementById('galleryCounter').textContent = `${galleryIndex+1} / ${galleryImages.length}`;
  document.getElementById('galleryDots').innerHTML = galleryImages.map((_,i)=>`<div class="dot ${i===galleryIndex?'active':''}" onclick="goGallery(${i})"></div>`).join('');
  document.getElementById('galleryThumbs').innerHTML = galleryImages.map((img,i)=>`<img src="${img}" class="w-14 h-14 rounded-lg object-cover border-2 ${i===galleryIndex?'border-emerald-500':'border-transparent'} cursor-pointer" onclick="goGallery(${i})">`).join('');
}
window.nextGallery = function(){ galleryIndex=(galleryIndex+1)%galleryImages.length; showGallery(); }
window.prevGallery = function(){ galleryIndex=(galleryIndex-1+galleryImages.length)%galleryImages.length; showGallery(); }
window.goGallery = function(i){ galleryIndex=i; showGallery(); }
window.closeGallery = function(){ document.getElementById('galleryModal').classList.remove('active'); }

document.addEventListener('DOMContentLoaded', async()=>{
  await loadOwnerName();
  await loadClients();
  await loadProducts();
  if(activeClient){
    document.getElementById('activeClientName').textContent=activeClient;
    document.getElementById('activeClientBar').classList.remove('hidden');
    document.getElementById('orderClientLabel').textContent=`(${activeClient})`;
    updateProgress();
  }
  document.getElementById('searchInput').addEventListener('input', renderProducts);
  document.getElementById('confirmClientBtn').addEventListener('click', ()=>setActiveClient(document.getElementById('clientNameInput').value.trim()));
  document.getElementById('clientNameInput').addEventListener('keypress', e=>{ if(e.key==='Enter') setActiveClient(e.target.value.trim()); });
  document.getElementById('changeClientBtn').addEventListener('click', ()=>{ document.getElementById('activeClientBar').classList.add('hidden'); activeClient=''; localStorage.removeItem('activeClient'); updateProgress(); });
  document.getElementById('finishOrderBtn').addEventListener('click', finishOrder);
  document.getElementById('clearOrderBtn').addEventListener('click', clearOrder);
  document.getElementById('reportsBtn').addEventListener('click', ()=>window.location.href='reports.html');
});

function showToast(msg,type='success'){
  const toast=document.getElementById('toast');
  const icon=document.getElementById('toastIcon');
  const m=document.getElementById('toastMessage');
  m.textContent=msg;
  icon.className=type==='success'?'fa-solid fa-check-circle text-emerald-400':type==='error'?'fa-solid fa-circle-exclamation text-red-400':'fa-solid fa-info-circle text-blue-400';
  toast.classList.remove('hidden');
  setTimeout(()=>toast.classList.add('hidden'),3000);
}
</script>
</body>
</html>
