<head><!-- PLAYABLE_TOUCH_PATCH_V1 --><script>
(function() {
  if (window.__playableTouchPatchInstalled) return;
  window.__playableTouchPatchInstalled = true;
  var origAdd = EventTarget.prototype.addEventListener;
  var blockedTypes = { touchstart: 1, touchmove: 1, wheel: 1 };
  EventTarget.prototype.addEventListener = function(type, listener, options) {
    if (blockedTypes[type]) {
      if (options === undefined || options === null) {
        options = { passive: true };
      } else if (typeof options === 'boolean') {
        options = { capture: options, passive: true };
      } else {
        options = Object.assign({}, options, { passive: true });
      }
    }
    return origAdd.call(this, type, listener, options);
  };
})();

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getDatabase, ref, get, push } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCLIzcO9i8QQ-YzYY5fIap6QNDsJDqgf60",
  authDomain: "karnipromaroc.firebaseapp.com",
  databaseURL: "https://karnipromaroc-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "karnipromaroc",
  storageBucket: "karnipromaroc.firebasestorage.app",
  messagingSenderId: "6746147726",
  appId: "1:6746147726:web:6e3a2d29941ab93ef432df"
};
const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);

let products = [];
let filteredProducts = [];
let currentOrder = [];
let currentProductIndex = -1;
let activeClient = localStorage.getItem('activeClient') || '';
let galleryImages = [];
let galleryIndex = 0;

/* ============ تحميل العملاء من index.html ============ */
async function loadClientsFromIndex(){
  const select = document.getElementById('clientSelect');
  const loading = document.getElementById('clientsLoading');
  let clients = [];

  // 1. من localStorage (index.html كيخزن العملاء هنا)
  try{
    const keys = ['clients','customers','allClients','clientList','users'];
    keys.forEach(k=>{
      const data = localStorage.getItem(k);
      if(data){
        try{
          const arr = JSON.parse(data);
          if(Array.isArray(arr)){
            arr.forEach(c=>{
              if(typeof c==='string') clients.push(c);
              else if(c.name) clients.push(c.name);
              else if(c.clientName) clients.push(c.clientName);
            });
          }
        } catch(e){}
      }
    });
    // أسماء العملاء من index.html قد تكون في keys أخرى
    for(let i=0;i<localStorage.length;i++){
      const key = localStorage.key(i);
      if(key && key.toLowerCase().includes('client')){
        try{
          const v = localStorage.getItem(key);
          const arr = JSON.parse(v);
          if(Array.isArray(arr)){
            arr.forEach(c=>{ if(typeof c==='string') clients.push(c); else if(c.name) clients.push(c.name); });
          }
        } catch(e){}
      }
    }
  } catch(e){}

  // 2. من Firebase - جميع المسارات المحتملة للعملاء في index.html
  const possiblePaths = ["clients","customers","clientsList","customersList","users","customer","client","العملاء"];
  for(const path of possiblePaths){
    try{
      const snap = await get(ref(db, path));
      if(snap.exists()){
        const val = snap.val();
        if(Array.isArray(val)){
          val.forEach(c=>{ if(c && c.name) clients.push(c.name); else if(typeof c==='string') clients.push(c); });
        } else if(typeof val==='object'){
          Object.values(val).forEach(c=>{
            if(!c) return;
            if(typeof c==='string') clients.push(c);
            else if(c.name) clients.push(c.name);
            else if(c.clientName) clients.push(c.clientName);
            else if(c.fullName) clients.push(c.fullName);
            else if(c.nom) clients.push(c.nom);
          });
        }
      }
    } catch(e){}
  }

  // تنظيف وتوحيد
  clients = [...new Set(clients.map(c=>c.trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));

  // ملء الـ select
  select.innerHTML = '<option value="">-- اختر العميل --</option>' + clients.map(c=>`<option value="${c}">${c}</option>`).join('');

  // إذا كان هناك عميل نشط سابقاً
  if(activeClient && clients.includes(activeClient)){
    select.value = activeClient;
    document.getElementById('activeClientName').textContent = activeClient;
    document.getElementById('activeClientBar').classList.remove('hidden');
    document.getElementById('orderClientLabel').textContent = `(${activeClient})`;
  }

  if(clients.length===0){
    select.innerHTML = '<option value="">لا يوجد عملاء - أضف العملاء من index.html أولاً</option>';
    loading.innerHTML = '<span class="text-red-500">⚠️ لم يتم العثور على عملاء في index.html - تأكد من إضافة العملاء هناك</span>';
  } else {
    loading.textContent = `تم تحميل ${clients.length} عميل من index.html`;
    setTimeout(()=>loading.classList.add('hidden'),2000);
  }
}

/* ============ تحميل المنتجات من reglematjar.html ============ */
async function loadProductsFromReglematjar(){
  try{
    const snap = await get(ref(db, "products"));
    if(snap.exists()){
      const val = snap.val();
      products = Object.values(val).map(p=>{
        // توافق مع النظام القديم
        if(p.image && !p.mainImage) p.mainImage = p.image;
        if(p.mainImage && (!p.images || p.images.length===0)) p.images=[p.mainImage];
        if(!p.images) p.images = p.mainImage ? [p.mainImage] : [];
        if(!p.mainImage && p.images.length>0) p.mainImage = p.images[0];
        return {hidden:false, ...p};
      }).filter(p=>!p.hidden);
    }
  } catch(e){ console.error(e); }
  filteredProducts = [...products];
  renderProducts();
}

function renderProducts(){
  const container = document.getElementById('productsContainer');
  const empty = document.getElementById('emptyState');
  let list = filteredProducts;
  const q = document.getElementById('searchInput').value.toLowerCase();
  if(q) list = list.filter(p=>(p.name||'').toLowerCase().includes(q));

  if(list.length===0){ container.innerHTML=''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');
  container.innerHTML = list.map(p=>{
    const mainImg = p.mainImage || p.images?.[0] || 'https://via.placeholder.com/300';
    const inOrder = currentOrder.find(o=>o.productId==p.id);
    const qtyBadge = inOrder ? `<span class="absolute top-2 left-2 bg-emerald-600 text-white text-xs px-2 py-1 rounded-full font-bold">${inOrder.qty}</span>` : '';
    return `<div class="product-card bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden cursor-pointer" onclick="openOrderModal('${p.id}')">
      <div class="relative bg-gray-50">
        <img src="${mainImg}" alt="${p.name}" class="w-full h-52 object-cover" loading="lazy" decoding="async">
        <span class="absolute top-2 right-2 bg-emerald-100 text-emerald-700 text-[11px] px-2.5 py-1 rounded-full font-bold">متوفر</span>
        ${qtyBadge}
      </div>
      <div class="p-3">
        <h3 class="font-bold text-[13px] text-gray-900 line-clamp-1 mb-2 text-center">${p.name||'بدون اسم'}</h3>
        <div class="flex items-center justify-between">
          <button class="w-9 h-9 bg-emerald-600 text-white rounded-xl flex items-center justify-center"><i class="fa-solid fa-cart-plus text-xs"></i></button>
          <div class="text-left">
            <p class="font-bold text-emerald-600 text-[14px]">${parseFloat(p.price||0).toFixed(2)} <span class="text-[10px] font-normal text-gray-500">درهم</span></p>
            <p class="text-[11px] text-gray-500">المخزون: ${p.stock||0}</p>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ============ اختيار العميل ============ */
function setActiveClient(name){
  if(!name) { showToast('اختر العميل من القائمة','error'); return; }
  activeClient = name;
  localStorage.setItem('activeClient', name);
  document.getElementById('activeClientName').textContent = name;
  document.getElementById('activeClientBar').classList.remove('hidden');
  document.getElementById('orderClientLabel').textContent = `(${name})`;
  showToast(`العميل الحالي: ${name}`,'success');
  updateProgress();
}

/* ============ الطلب ============ */
window.openOrderModal = function(productId){
  if(!activeClient){ showToast('اختر العميل أولاً من القائمة','error'); document.getElementById('clientSelect').focus(); return; }
  const p = products.find(x=>x.id==productId);
  if(!p) return;
  currentProductIndex = products.findIndex(x=>x.id==productId);
  const mainImg = p.mainImage || p.images?.[0] || '';
  document.getElementById('orderMainImage').src = mainImg;
  document.getElementById('orderProductName').textContent = p.name;
  document.getElementById('orderPrice').textContent = parseFloat(p.price||0).toFixed(2);
  document.getElementById('orderStock').textContent = p.stock||0;
  document.getElementById('orderStockBadge').textContent = (p.stock||0)>0 ? 'متوفر' : 'غير متوفر';
  document.getElementById('orderImagesCount').querySelector('span').textContent = p.images?.length||1;
  document.getElementById('orderThumbs').innerHTML = (p.images||[]).map((img,i)=>`<img src="${img}" class="w-16 h-16 rounded-xl object-cover border-2 ${i===0?'border-emerald-500':'border-transparent'} cursor-pointer" onclick="setOrderMain('${img}',${i})">`).join('');
  const existing = currentOrder.find(o=>o.productId==p.id);
  document.getElementById('orderQty').value = existing ? existing.qty : 1;
  document.getElementById('orderModal').classList.add('active');
  galleryImages = p.images||[mainImg];
  galleryIndex = 0;
}
window.setOrderMain = function(src, idx){
  document.getElementById('orderMainImage').src = src;
  document.querySelectorAll('#orderThumbs img').forEach((t,i)=>t.classList.toggle('border-emerald-500', i===idx));
  document.querySelectorAll('#orderThumbs img').forEach((t,i)=>t.classList.toggle('border-transparent', i!==idx));
  galleryIndex = idx;
}
window.changeQty = function(d){
  const input = document.getElementById('orderQty');
  let v = parseInt(input.value)||0;
  v+=d;
  if(v<0) v=0;
  input.value=v;
}
window.closeOrderModal = function(){ document.getElementById('orderModal').classList.remove('active'); }
window.skipProduct = function(){ closeOrderModal(); nextProductAuto(); }
window.confirmAndNext = function(){
  const qty = parseInt(document.getElementById('orderQty').value)||0;
  if(qty<=0){ showToast('أدخل كمية صحيحة','error'); return; }
  const p = products[currentProductIndex];
  if(!p) return;
  const existingIdx = currentOrder.findIndex(o=>o.productId==p.id);
  if(existingIdx>-1) currentOrder[existingIdx].qty = qty;
  else currentOrder.push({productId:p.id, name:p.name, qty, price:p.price, mainImage:p.mainImage||p.images?.[0]});
  updateProgress();
  renderProducts();
  closeOrderModal();
  setTimeout(()=>nextProductAuto(), 350);
}
function nextProductAuto(){
  let nextIdx = -1;
  for(let i=currentProductIndex+1;i<products.length;i++){
    if(!currentOrder.find(o=>o.productId==products[i].id)){ nextIdx=i; break; }
  }
  if(nextIdx===-1){
    for(let i=0;i<products.length;i++){
      if(!currentOrder.find(o=>o.productId==products[i].id)){ nextIdx=i; break; }
    }
  }
  if(nextIdx!==-1 && currentOrder.length < filteredProducts.length){
    setTimeout(()=>openOrderModal(products[nextIdx].id), 400);
  } else if(currentOrder.length>=filteredProducts.length){
    showToast('انتهيت من جميع المنتجات!','success');
  }
}
function updateProgress(){
  const bar = document.getElementById('orderProgress');
  const countEl = document.getElementById('orderCount');
  if(currentOrder.length===0 && !activeClient){ bar.classList.add('hidden'); countEl.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  countEl.classList.remove('hidden');
  countEl.textContent = currentOrder.length;
  document.getElementById('progressText').textContent = `${currentOrder.length} / ${filteredProducts.length}`;
  document.getElementById('progressBar').style.width = `${(currentOrder.length/filteredProducts.length)*100}%`;
  document.getElementById('orderSummary').innerHTML = currentOrder.slice(-5).reverse().map(o=>`<div class="bg-gray-50 rounded-lg p-2 flex justify-between"><span class="font-bold truncate text-xs">${o.name}</span><span class="text-emerald-600 font-bold text-xs">${o.qty}</span></div>`).join('');
}
window.finishOrder = async function(){
  if(!activeClient){ showToast('اختر العميل','error'); return; }
  if(currentOrder.length===0){ showToast('لا يوجد طلبات','error'); return; }
  try{
    const orderData = {clientName:activeClient, items:currentOrder, totalItems:currentOrder.length, totalQty:currentOrder.reduce((s,i)=>s+i.qty,0), createdAt:new Date().toISOString(), status:'pending'};
    await push(ref(db, "orders"), orderData);
    await push(ref(db, `clientOrders/${activeClient}`), orderData);
    showToast(`تم إرسال طلب ${activeClient} (${currentOrder.length} منتج)`,'success');
    currentOrder=[]; updateProgress(); renderProducts();
  } catch(e){ showToast('خطأ: '+e.message,'error'); }
}
window.clearOrder = function(){ if(confirm('مسح الطلب؟')){ currentOrder=[]; updateProgress(); renderProducts(); showToast('تم المسح','info'); } }

/* Gallery */
window.openGalleryFromOrder = function(){ openGallery(galleryImages, galleryIndex); }
function openGallery(images, startIdx=0){ galleryImages=images; galleryIndex=startIdx; showGallery(); document.getElementById('galleryModal').classList.add('active'); }
function showGallery(){
  if(!galleryImages.length) return;
  document.getElementById('galleryImage').src=galleryImages[galleryIndex];
  document.getElementById('galleryCounter').textContent=`${galleryIndex+1} / ${galleryImages.length}`;
  document.getElementById('galleryDots').innerHTML=galleryImages.map((_,i)=>`<div class="dot ${i===galleryIndex?'active':''}" onclick="goGallery(${i})"></div>`).join('');
  document.getElementById('galleryThumbs').innerHTML=galleryImages.map((img,i)=>`<img src="${img}" class="w-14 h-14 rounded-lg object-cover border-2 ${i===galleryIndex?'border-emerald-500':'border-transparent'} cursor-pointer" onclick="goGallery(${i})">`).join('');
}
window.nextGallery=function(){ galleryIndex=(galleryIndex+1)%galleryImages.length; showGallery(); }
window.prevGallery=function(){ galleryIndex=(galleryIndex-1+galleryImages.length)%galleryImages.length; showGallery(); }
window.goGallery=function(i){ galleryIndex=i; showGallery(); }
window.closeGallery=function(){ document.getElementById('galleryModal').classList.remove('active'); }

document.addEventListener('DOMContentLoaded', async()=>{
  await loadClientsFromIndex();
  await loadProductsFromReglematjar();
  if(activeClient){
    document.getElementById('activeClientName').textContent=activeClient;
    document.getElementById('activeClientBar').classList.remove('hidden');
    document.getElementById('orderClientLabel').textContent=`(${activeClient})`;
  }
  document.getElementById('clientSelect').addEventListener('change', e=>setActiveClient(e.target.value));
  document.getElementById('changeClientBtn').addEventListener('click', ()=>{ document.getElementById('activeClientBar').classList.add('hidden'); document.getElementById('clientSelect').value=''; activeClient=''; localStorage.removeItem('activeClient'); updateProgress(); });
  document.getElementById('searchInput').addEventListener('input', renderProducts);
  document.getElementById('finishOrderBtn').addEventListener('click', finishOrder);
  document.getElementById('clearOrderBtn').addEventListener('click', clearOrder);
  document.getElementById('reportsBtn').addEventListener('click', ()=>window.location.href='reports.html');
});

function showToast(msg,type='success'){
  const toast=document.getElementById('toast');
  const icon=document.getElementById('toastIcon');
  const m=document.getElementById('toastMessage');
  m.textContent=msg;
  icon.className=type==='success'?'fa-solid fa-check-circle text-emerald-400':type==='error'?'fa-solid fa-circle-exclamation text-red-400':'fa-solid fa-info-circle text-blue-400';
  toast.classList.remove('hidden');
  setTimeout(()=>toast.classList.add('hidden'),3000);
}
</script>
