<style>
:root{--primary:#0f766e;--accent:#14b8a6;--success:#22c55e;--danger:#ef4444;--bg:#060d14;--glass:rgba(255,255,255,0.07);--border:rgba(255,255,255,0.10);--text:#e6eef8;--muted:#8aa0b8}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Cairo',sans-serif;background:radial-gradient(900px 600px at 80% -10%, rgba(20,184,166,0.18), transparent 60%),linear-gradient(180deg,#060d14 0%,#0a1628 100%);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.header{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:rgba(8,18,31,0.92);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);z-index:100}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--glass);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn.primary{background:linear-gradient(135deg,var(--primary),var(--accent));border:none}
.filter-bar{flex-shrink:0;display:flex;gap:6px;padding:8px 10px;background:rgba(255,255,255,0.03);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.filter-chip{display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:16px;background:rgba(255,255,255,0.06);border:1px solid var(--border);font-size:10px;font-weight:700;white-space:nowrap;cursor:pointer}

.stats{flex-shrink:0;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:6px 8px}
.stat-card{background:linear-gradient(180deg,rgba(255,255,255,0.08),rgba(255,255,255,0.04));border:1px solid var(--border);border-radius:10px;padding:6px 4px;text-align:center}
.stat-number{font-family:'Geist';font-size:15px;font-weight:700}
.stat-label{font-size:8px;color:var(--muted)}
.map-container{flex:1;position:relative;overflow:auto;-webkit-overflow-scrolling:touch}
.map-content{position:relative;min-height:100%;padding-top:12px;padding-bottom:180px}
.route-path{position:absolute;top:0;left:0;width:100%;z-index:1;pointer-events:none}
#routeSvg{width:100%;display:block;overflow:visible}
.point{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;z-index:10;cursor:pointer;max-width:94vw}
.point-card{width:140px;max-width:48vw;padding:5px 6px;background:linear-gradient(180deg,rgba(255,255,255,0.09),rgba(255,255,255,0.04));border:1px solid rgba(255,255,255,0.11);border-radius:10px;backdrop-filter:blur(18px);display:flex;align-items:center;gap:6px;box-shadow:0 3px 12px rgba(0,0,0,0.22)}

.point-avatar{width:22px;height:22px;border-radius:6px;flex-shrink:0;background:linear-gradient(135deg,#1e293b,#0f172a);display:flex;align-items:center;justify-content:center;font-family:'Geist';font-weight:700;font-size:10px}
.point-avatar.current{background:linear-gradient(135deg,#22c55e,#0f766e)}

.point-meta{font-size:8px;color:var(--muted);margin-top:1px}

.dialog-card{width:100%;max-width:340px;background:linear-gradient(180deg,rgba(22,34,51,0.98),rgba(10,20,34,0.99));border:1px solid rgba(255,255,255,0.12);border-radius:18px;backdrop-filter:blur(28px);overflow:hidden;animation:dialogIn 0.35s cubic-bezier(0.16,1,0.3,1)}

.dialog-header{padding:18px 16px 12px;text-align:center}
.dialog-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:18px}
.dialog-icon.danger{background:rgba(239,68,68,0.12);color:#f87171}
.dialog-icon.warning{background:rgba(245,158,11,0.12);color:#fbbf24}
.dialog-icon.success{background:rgba(34,197,94,0.12);color:#4ade80}

.dialog-title{font-weight:800;font-size:13px}
.dialog-message{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.6;white-space:pre-line}
.dialog-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px;border-top:1px solid var(--border)}

.toast-container{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:500;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:90%;max-width:340px}
.toast{pointer-events:auto;background:rgba(22,34,51,0.97);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 12px 32px rgba(0,0,0,0.3);animation:toastIn 0.35s cubic-bezier(0.16,1,0.3,1);font-size:11px;font-weight:600}
.toast.success{border-color:rgba(34,197,94,0.2)} .toast.error{border-color:rgba(239,68,68,0.2)} .toast.info{border-color:rgba(59,130,246,0.2)}

.toast.info .toast-icon{background:rgba(59,130,246,0.15);color:#60a5fa}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>

<script type="module">
import { auth, db } from "./firebase.js";
import { ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

let allCustomers = {};
let routeList = [];
let filteredList = [];
let selectedRealIndex = null;
let selectedFilteredIndex = null;
let currentUid = null;
let customersRef = null;
let routeRef = null;

const BLOCKED_NAMES = ['Rmdan Ikaml','Ouchen abdellah','Salh biranzaran','Salh tegir','Youssef biranzaran','Ahmed','احمد','Ahb','Agsb','Aissa','Hafidi','Rmdan','Ouchen'];

function isBlocked(name){
  if(!name) return false;
  const lower = name.toLowerCase().trim();
  return BLOCKED_NAMES.some(b => lower.includes(b.toLowerCase()));
}

function getRealBalance(c){
  if(typeof c.currentBalance!=='undefined' && c.currentBalance!==null) return parseFloat(c.currentBalance)||0;
  let p=0,r=0; if(c.operations && Array.isArray(c.operations)){ c.operations.forEach(op=>{ if(op.type==='paid') p+=Number(op.amount)||0; else if(op.type==='received') r+=Number(op.amount)||0; }); }
  return (parseFloat(c.amount)||0)+p-r;
}

function isDueTodayFromIndex(customer){
  if(!customer) return false;
  if(isBlocked(customer.name)) return false;
  const balance = getRealBalance(customer);
  if(balance <= 0) return false;
  const today = new Date().toISOString().split('T')[0];
  const date = customer.date;
  if(date === today) return true;
  if(date && date < today) return true;
  if(!date && balance > 0) return true;
  return false;
}

// ===== نظام Dialog و Toast احترافي - بدون alert/confirm =====
let dialogResolve=null;
function openAppDialog({title='تأكيد', message='', confirmText='تأكيد', cancelText='إلغاء', type='info', danger=false}){
  return new Promise(resolve=>{
    dialogResolve=resolve;
    document.getElementById('dialogTitle').textContent=title;
    document.getElementById('dialogMessage').textContent=message;
    document.getElementById('dialogCancelBtn').textContent=cancelText;
    const confirmBtn=document.getElementById('dialogConfirmBtn');
    confirmBtn.textContent=confirmText;
    confirmBtn.className='dialog-btn confirm' + (danger?' danger':'');
    const iconEl=document.getElementById('dialogIcon');
    iconEl.className='dialog-icon ' + type;
    const icons={danger:'fa-trash-can', warning:'fa-triangle-exclamation', success:'fa-check', info:'fa-circle-question'};
    iconEl.innerHTML=`<i class="fa-solid ${icons[type]||'fa-circle-question'}"></i>`;
    document.getElementById('appDialog').classList.add('active');
  });
}
window.closeAppDialog=function(result){
  document.getElementById('appDialog').classList.remove('active');
  if(dialogResolve){ dialogResolve(result); dialogResolve=null; }
}

function showToast(message, type='success'){
  const container=document.getElementById('toastContainer');
  const toast=document.createElement('div');
  toast.className=`toast ${type}`;
  const icons={success:'fa-check', error:'fa-xmark', info:'fa-info'};
  toast.innerHTML=`<div class="toast-icon"><i class="fa-solid ${icons[type]||'fa-check'}"></i></div><div style="flex:1">${message}</div>`;
  container.appendChild(toast);
  setTimeout(()=>{ toast.style.opacity='0'; toast.style.transform='translateY(-10px)'; setTimeout(()=>toast.remove(),300); },3000);
}

// ===== منطق المزامنة المصحح 100% =====
let customersLoaded=false;
let routeLoaded=false;

onAuthStateChanged(auth, (user)=>{
  if(!user){
    window.location.href='login.html';
    return;
  }
  currentUid = user.uid;
  customersRef = ref(db, `users/${currentUid}/customers`);
  routeRef = ref(db, `users/${currentUid}/routeManual`);

  onValue(customersRef, (snapshot)=>{
    let data = snapshot.val() || {};
    if(data._init) delete data._init;
    Object.keys(data).forEach(k=>{
      if(data[k] && data[k]._init && Object.keys(data[k]).length===1){
        delete data[k];
      }
    });
    allCustomers = data;
    customersLoaded=true;
    if(routeLoaded){
      mergeTodayIntoRoute();
    } else {
      get(routeRef).then(snap=>{
        if(!snap.exists() || !snap.val() || Object.keys(snap.val()).length===0 || (Array.isArray(snap.val()) && snap.val().length===0)){
          buildRouteFromToday(true);
        } else {
          let val=snap.val();
          if(Array.isArray(val)) routeList=val;
          else routeList=Object.values(val);
          routeList=routeList.filter(i=>i && !isBlocked(i.name));
          mergeTodayIntoRoute();
        }
      });
    }
  });

  onValue(routeRef, (snapshot)=>{
    if(snapshot.exists()){
      let val=snapshot.val();
      if(Array.isArray(val)) routeList=val;
      else if(typeof val==='object') routeList=Object.values(val);
      else routeList=[];
      routeList=routeList.filter(i=>i && !isBlocked(i.name));
    } else {
      routeList=[];
    }
    routeLoaded=true;
    if(customersLoaded){
      mergeTodayIntoRoute();
    } else {
      applyFilter();
    }
  });
});

function getTodayCustomers(){
  const todayCustomers = [];
  Object.keys(allCustomers).forEach(key=>{
    const c = allCustomers[key];
    if(isDueTodayFromIndex(c) && !isBlocked(c.name)){
      todayCustomers.push({
        id: key,
        customerId: key,
        name: c.name,
        phone: c.phone || '',
        city: c.city || c.ville || '',
        debt: getRealBalance(c),
        amount: getRealBalance(c),
        date: c.date,
        status: 'pending'
      });
    }
  });
  todayCustomers.sort((a,b)=> (a.city||'').localeCompare(b.city||'') || a.name.localeCompare(b.name));
  return todayCustomers;
}

function mergeTodayIntoRoute(){
  const todayCustomers = getTodayCustomers();
  const existingIds = new Set(routeList.map(i=>i.customerId || i.id));
  const todayIds = new Set(todayCustomers.map(i=>i.customerId));

  todayCustomers.forEach(c=>{
    if(!existingIds.has(c.customerId)){
      routeList.push(c);
    }
  });

  routeList = routeList.filter(item=>{
    if(isBlocked(item.name)) return false;
    if(!todayIds.has(item.customerId || item.id) && ['pending','current'].includes(item.status)){
      const cid=item.customerId || item.id;
      const cust=allCustomers[cid];
      if(!cust || !isDueTodayFromIndex(cust)) return false;
    }
    return true;
  });

  let hasCurrent=routeList.some(i=>i.status==='current' && !isBlocked(i.name));
  if(!hasCurrent){
    const firstPending=routeList.find(i=>i.status==='pending');
    if(firstPending) firstPending.status='current';
  }

  const seen=new Set();
  routeList=routeList.filter(item=>{
    const id=item.customerId || item.id;
    if(seen.has(id)) return false;
    seen.add(id);
    return true;
  });

  applyFilter();
}

window.buildRouteFromToday = async function(forceReplace=false){
  if(!currentUid || !customersRef || !routeRef) return;
  const todayCustomers = getTodayCustomers();
  if(todayCustomers.length>0) todayCustomers[0].status='current';
  if(forceReplace || routeList.length===0){
    routeList = todayCustomers;
  } else {
    const existingMap=new Map(routeList.map(i=>[i.customerId||i.id, i]));
    todayCustomers.forEach(c=>{
      if(!existingMap.has(c.customerId)){
        routeList.push(c);
      }
    });
    if(routeList.length===0) routeList=todayCustomers;
  }
  await set(routeRef, routeList);
  applyFilter();
}

window.syncFromIndex = async function(){
  if(!currentUid || !customersRef || !routeRef) return;
  const todayCustomers = getTodayCustomers();
  const existingIds=new Set(routeList.map(i=>i.customerId||i.id));
  let newCount=0;
  todayCustomers.forEach(c=>{
    if(!existingIds.has(c.customerId)){
      routeList.push(c);
      newCount++;
    }
  });
  if(todayCustomers.length>0 && !routeList.some(i=>i.status==='current')){
    const first=routeList.find(i=>i.status==='pending');
    if(first) first.status='current';
  }
  await set(routeRef, routeList);
  showToast(`تمت المزامنة: ${todayCustomers.length} زبون، ${newCount} جديد`, 'success');
  applyFilter();
}

function applyFilter(){
  filteredList = routeList.filter(item => {
    if(isBlocked(item.name)) return false;
    if(!['pending','current'].includes(item.status)) return false;
    return true;
  });
  const seen=new Set();
  filteredList=filteredList.filter(item=>{
    const id=item.customerId||item.id;
    if(seen.has(id)) return false;
    seen.add(id);
    return true;
  });
  renderMap();
  renderSidebar();
}

window.clearRoute = async function(){
  if(!currentUid || !routeRef) return;
  const ok=await openAppDialog({title:'مسح المسار', message:'هل تريد مسح جميع الزبناء من المسار؟', confirmText:'مسح', cancelText:'إلغاء', type:'danger', danger:true});
  if(!ok) return;
  await set(routeRef, []);
  routeList=[]; filteredList=[];
  applyFilter();
  showToast('تم مسح المسار', 'info');
}

window.resetRoute = async function(){
  if(!currentUid || !routeRef) return;
  const ok=await openAppDialog({title:'إعادة تعيين المسار', message:'هل تريد إعادة تعيين المسار؟ سيتم إرجاع أول زبون إلى الحالي والباقي في الانتظار.', confirmText:'تأكيد', cancelText:'إلغاء', type:'warning'});
  if(!ok) return;
  let first=true;
  routeList = routeList.filter(i=>!isBlocked(i.name)).map(item=>{
    if(['pending','current','postponed','refused','closed','visited'].includes(item.status)){
      if(isBlocked(item.name)) return null;
      if(first){ item.status='current'; first=false; } else { item.status='pending'; }
    }
    return item;
  }).filter(Boolean);
  await set(routeRef, routeList);
  applyFilter();
  showToast('تمت إعادة التعيين', 'success');
}

function getArabicStatus(s){ const m={'current':'الزبون الحالي','visited':'تم التسديد','pending':'في الانتظار','closed':'مغلق','postponed':'مؤجل','refused':'امتنع عن التسديد'}; return m[s]||s; }

function renderMap(){
  const container=document.getElementById('pointsContainer');
  const startC=document.getElementById('startContainer');
  const finishC=document.getElementById('finishContainer');
  const mapContent=document.getElementById('mapContent');
  const path=document.getElementById('routePath');
  const shadow=document.getElementById('roadShadow');
  const inner=document.getElementById('roadInner');
  container.innerHTML=''; startC.innerHTML=''; finishC.innerHTML='';
  let pending=0,current=0,visited=0;

  if(filteredList.length===0){
    [path,shadow,inner].forEach(p=>p.setAttribute('d',''));
    document.getElementById('totalCount').innerText=0;
    document.getElementById('pendingCount').innerText=0;
    document.getElementById('currentCount').innerText=0;
    document.getElementById('visitedCount').innerText=0;
    mapContent.style.height='420px';
    container.innerHTML=`<div style="position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);text-align:center;padding:14px;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:12px;backdrop-filter:blur(18px);width:85%;max-width:260px"><div style="font-size:22px;margin-bottom:6px;opacity:0.6"><i class="fa-solid fa-route"></i></div><div style="font-weight:700;font-size:11px">لا يوجد زبناء اليوم</div><div style="font-size:9px;color:var(--muted);margin-top:4px">أضف زبناء بتاريخ اليوم من الرئيسية</div><button onclick="syncFromIndex()" style="margin-top:8px;padding:7px 12px;border-radius:8px;border:none;background:linear-gradient(135deg,#0f766e,#14b8a6);color:white;font-weight:700;font-size:10px;cursor:pointer;width:100%"><i class="fa-solid fa-rotate" style="margin-left:4px"></i>مزامنة زبناء اليوم</button></div>`;
    return;
  }

  let points=[]; let h=window.innerWidth<768?78:88;
  let totalH=(filteredList.length*h)+220;
  mapContent.style.height=totalH+'px';
  document.getElementById('routePathDiv').style.height=totalH+'px';
  document.getElementById('routeSvg').setAttribute('height',totalH);
  document.getElementById('routeSvg').setAttribute('viewBox',`0 0 ${window.innerWidth} ${totalH}`);
  let width=document.getElementById('mapContainer').offsetWidth||window.innerWidth;
  filteredList.forEach((_,i)=>{ let y=70+i*h; let x=width/2+Math.sin(i*0.85)*(width*0.22); points.push({x,y}); });

  if(points.length>0){
    let d=`M ${points[0].x} ${points[0].y}`;
    for(let i=1;i<points.length;i++){ let p=points[i-1],c=points[i]; d+=` C ${p.x+(c.x-p.x)*0.3} ${p.y+32}, ${p.x+(c.x-p.x)*0.6} ${c.y-10}, ${c.x} ${c.y}`; }
    d+=` L ${points[points.length-1].x} ${points[points.length-1].y+90}`;
    [path,shadow,inner].forEach(p=>p.setAttribute('d',d));
    startC.innerHTML=`<div class="premium-terminal start" style="top:${points[0].y-48}px;left:${points[0].x}px"><div class="terminal-card"><div class="terminal-icon"><i class="fa-solid fa-house"></i></div><div><div class="terminal-text">الانطلاق</div><div class="terminal-sub">${filteredList.length} زبون</div></div></div><div class="terminal-line"></div></div>`;
  }

  filteredList.forEach((item,i)=>{
    if(item.status==='pending') pending++; if(item.status==='current') current++; if(item.status==='visited') visited++;
    if(pending>0 && item.status==='pending' && current===0){ item.status='current'; current=1; pending--; }
    let pt=points[i]; let isLeft=i%2===0;
    let debt=item.debt||item.amount||'';
    container.innerHTML+=`<div class="point" style="top:${pt.y}px;left:${pt.x}px;flex-direction:${isLeft?'row-reverse':'row'}" onclick="openModal(${i})"><div class="point-dot ${item.status}">${i+1}</div><div class="point-card ${item.status==='current'?'current':''}"><div class="point-avatar ${item.status}">${(item.name||'C').charAt(0).toUpperCase()}</div><div style="flex:1;min-width:0"><div class="point-name">${item.name||'بدون'}</div><div class="point-meta">${debt?'<span style="color:#fbbf24">'+debt+'د</span>':''} <span>#${i+1}</span> ${item.city?'<span>'+item.city+'</span>':''}</div><div><span class="point-status ${item.status}">${getArabicStatus(item.status)}</span></div></div></div></div>`;
  });

  if(points.length>0){
    let last=points[points.length-1];
    finishC.innerHTML=`<div class="premium-terminal finish" style="top:${last.y+110}px;left:${last.x}px"><div class="terminal-line" style="transform:rotate(180deg);margin-top:0;margin-bottom:5px"></div><div class="terminal-card"><div class="terminal-icon"><i class="fa-solid fa-flag-checkered"></i></div><div><div class="terminal-text">النهاية</div><div class="terminal-sub">${filteredList.length} زبون</div></div></div></div>`;
  }

  document.getElementById('totalCount').innerText=filteredList.length;
  document.getElementById('pendingCount').innerText=pending;
  document.getElementById('currentCount').innerText=current;
  document.getElementById('visitedCount').innerText=visited;
  setTimeout(()=>{ const cur=document.querySelector('.point-dot.current'); if(cur) cur.scrollIntoView({behavior:'smooth',block:'center'}); },300);
}

function renderSidebar(){
  const c=document.getElementById('sidebarContent'); c.innerHTML='';
  filteredList.forEach((item,i)=>{
    const div=document.createElement('div'); div.className=`sidebar-item ${item.status==='current'?'current':''}`; div.dataset.index=i;
    div.innerHTML=`<div style="width:18px;height:18px;border-radius:5px;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700">${i+1}</div><div style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${item.name} ${item.debt?'• '+item.debt+'د':''}</div><div style="opacity:0.4"><i class="fa-solid fa-grip-lines" style="font-size:9px"></i></div>`;
    div.addEventListener('click',()=>{ if(!div.classList.contains('dragging')) openModal(i); });
    div.draggable=true;
    div.addEventListener('dragstart',function(){ this.classList.add('dragging'); window.dragged=i; });
    div.addEventListener('dragover',function(e){ e.preventDefault(); this.style.borderTop='2px solid #14b8a6'; });
    div.addEventListener('dragleave',function(){ this.style.borderTop=''; });
    div.addEventListener('drop',function(e){ e.preventDefault(); this.style.borderTop=''; if(window.dragged!==null && window.dragged!==i) reorder(window.dragged,i); });
    div.addEventListener('dragend',function(){ this.classList.remove('dragging'); window.dragged=null; });
    div.addEventListener('touchstart',function(e){ window.dragged=i; this.classList.add('dragging'); },{passive:false});
    div.addEventListener('touchmove',function(e){ if(window.dragged===null) return; e.preventDefault(); const y=e.touches[0].clientY; const el=document.elementFromPoint(e.touches[0].clientX,y)?.closest('.sidebar-item'); document.querySelectorAll('.sidebar-item').forEach(x=>x.style.borderTop=''); if(el && el!==this) el.style.borderTop='2px solid #14b8a6'; },{passive:false});
    div.addEventListener('touchend',function(e){ this.classList.remove('dragging'); const y=e.changedTouches[0].clientY; const el=document.elementFromPoint(e.changedTouches[0].clientX,y)?.closest('.sidebar-item'); document.querySelectorAll('.sidebar-item').forEach(x=>x.style.borderTop=''); if(el){ const to=parseInt(el.dataset.index); if(to!==window.dragged) reorder(window.dragged,to); } window.dragged=null; });
    c.appendChild(div);
  });
}

function reorder(from,to){
  if(!routeRef || !currentUid) return;
  const arr=[...filteredList]; const [m]=arr.splice(from,1); arr.splice(to,0,m); filteredList=arr;
  let newRoute = routeList.filter(item=> !filteredList.some(f=>f.customerId===item.customerId) && !filteredList.some(f=>f.id===item.id));
  let firstIdx = routeList.findIndex(item=> filteredList.length>0 && (item.customerId===filteredList[0].customerId || item.id===filteredList[0].id));
  if(firstIdx===-1) firstIdx=0;
  filteredList.forEach((item,idx)=>{ newRoute.splice(firstIdx+idx,0,item); });
  routeList=newRoute;
  renderMap(); renderSidebar();
  set(routeRef, routeList);
}

window.saveOrder = async function(){
  if(!routeRef || !currentUid) return;
  await set(routeRef, routeList);
  showToast('تم حفظ الترتيب', 'success');
}

window.openModal = function(i){
  const item=filteredList[i];
  window.selectedRealIndex = routeList.findIndex(r=> r.customerId===item.customerId || r.id===item.id);
  if(window.selectedRealIndex===-1) window.selectedRealIndex = routeList.indexOf(item);
  window.selectedFilteredIndex = i;
  document.getElementById('modalClientName').innerText=item.name||'بدون';
  document.getElementById('modalClientMeta').innerText=`#${i+1} • ${getArabicStatus(item.status)} ${item.debt?'• '+item.debt+' درهم':''} ${item.city?'• '+item.city:''}`;
  document.getElementById('clientModal').classList.add('active');
}
window.closeModal = function(){ document.getElementById('clientModal').classList.remove('active'); }
window.updateStatus = async function(newStatus){
  if(!routeRef || !currentUid) return;
  if(window.selectedRealIndex!==null && window.selectedRealIndex!==-1){
    routeList[window.selectedRealIndex].status=newStatus;
  }
  await set(routeRef, routeList);
  closeModal();
  showToast(newStatus==='visited'?'تم التسديد':'تم التحديث', 'success');
}
window.openDetails = async function(){
  const item=filteredList[window.selectedFilteredIndex];
  await openAppDialog({title:item.name||'التفاصيل', message:`المدينة: ${item.city||'غير محدد'}\nالدين: ${item.debt||0} درهم\nالهاتف: ${item.phone||'لا يوجد'}\nالتاريخ: ${item.date||'غير محدد'}`, confirmText:'حسناً', cancelText:'إغلاق', type:'info'});
}
window.callClient = function(){
  const item=filteredList[window.selectedFilteredIndex];
  if(item.phone) window.location.href='tel:'+item.phone;
  else showToast('لا يوجد هاتف', 'error');
}
window.whatsappClient = function(){
  const item=filteredList[window.selectedFilteredIndex];
  if(item.phone) window.open('https://wa.me/'+item.phone.replace(/[^0-9]/g,''),'_blank');
  else showToast('لا يوجد واتساب', 'error');
}
window.toggleSidebar = function(){
  const s=document.getElementById('sidebar');
  const c=document.getElementById('sidebarChevron');
  s.classList.toggle('open');
  c.className=s.classList.contains('open')?'fa-solid fa-chevron-right':'fa-solid fa-chevron-left';
}
window.addEventListener('resize',()=>{ renderMap(); });
</script>
