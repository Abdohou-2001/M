<style>
:root{--primary:#0f766e;--accent:#14b8a6;--success:#22c55e;--danger:#ef4444;--bg:#060d14;--glass:rgba(255,255,255,0.07);--border:rgba(255,255,255,0.10);--text:#e6eef8;--muted:#8aa0b8}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Cairo',sans-serif;background:radial-gradient(900px 600px at 80% -10%, rgba(20,184,166,0.18), transparent 60%),linear-gradient(180deg,#060d14 0%,#0a1628 100%);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.header{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:11px 12px;background:rgba(8,18,31,0.92);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);z-index:100}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--glass);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn.primary{background:linear-gradient(135deg,var(--primary),var(--accent));border:none}
.filter-bar{flex-shrink:0;display:flex;gap:7px;padding:9px 10px;background:rgba(255,255,255,0.03);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.filter-chip{display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:18px;background:rgba(255,255,255,0.06);border:1px solid var(--border);font-size:11px;font-weight:700;white-space:nowrap;cursor:pointer}
.filter-chip.active{background:linear-gradient(135deg,var(--primary),var(--accent));border-color:transparent;color:white}
.stats{flex-shrink:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 10px}
.stat-card{background:linear-gradient(180deg,rgba(255,255,255,0.08),rgba(255,255,255,0.04));border:1px solid var(--border);border-radius:12px;padding:8px 6px;text-align:center}
.stat-number{font-family:'Geist';font-size:18px;font-weight:700}
.stat-label{font-size:9px;color:var(--muted)}
.map-container{flex:1;position:relative;overflow:auto;-webkit-overflow-scrolling:touch}

.route-path{position:absolute;top:0;left:0;width:100%;z-index:1;pointer-events:none}

.premium-terminal{position:absolute;transform:translate(-50%,-50%);z-index:20;display:flex;flex-direction:column;align-items:center}

.terminal-text{font-weight:700;font-size:12px}

.terminal-line{width:2px;height:40px;background:linear-gradient(to bottom,rgba(255,255,255,0.18),transparent);margin-top:5px}
.sidebar{position:fixed;top:0;right:0;height:100dvh;width:340px;max-width:86vw;background:rgba(8,18,31,0.94);backdrop-filter:blur(28px);border-left:1px solid var(--border);z-index:200;transform:translateX(100%);transition:transform .4s cubic-bezier(0.16,1,0.3,1);display:flex;flex-direction:column}
.sidebar.open{transform:translateX(0)}
.sidebar-handle{position:absolute;left:-40px;top:50%;transform:translateY(-50%);width:38px;height:70px;background:rgba(8,18,31,0.9);border:1px solid var(--border);border-right:none;border-radius:11px 0 0 11px;display:flex;align-items:center;justify-content:center;cursor:pointer}

.sidebar-item.dragging{opacity:0.6;background:rgba(20,184,166,0.12)}
.client-modal{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0.6);backdrop-filter:blur(14px);display:none;align-items:center;justify-content:center;padding:14px}

.modal-card{width:100%;max-width:380px;background:linear-gradient(180deg,rgba(22,34,51,0.97),rgba(10,20,34,0.99));border:1px solid rgba(255,255,255,0.11);border-radius:18px;backdrop-filter:blur(28px);overflow:hidden}

</style>

<div class="map-container" id="mapContainer">

      <svg id="routeSvg"><path id="roadShadow" fill="none" stroke="rgba(0,0,0,0.45)" stroke-width="40" stroke-linecap="round" style="filter:blur(8px)"/><path id="routePath" fill="none" stroke="#1e293b" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/><path id="roadInner" fill="none" stroke="#2a3a52" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/></svg>

  <div style="padding:14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center"><div style="font-weight:700;font-size:13px"><i class="fa-solid fa-arrows-up-down" style="margin-left:7px;color:var(--accent)"></i>ترتيب زبناء اليوم</div><button class="icon-btn" style="width:30px;height:30px" onclick="toggleSidebar()"><i class="fa-solid fa-xmark" style="font-size:12px"></i></button></div>

    <div class="modal-body">
      <div class="modal-action" style="background:rgba(34,197,94,0.10)" onclick="updateStatus('visited')"><i style="width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(34,197,94,0.15);color:#4ade80"><i class="fa-solid fa-check" style="font-size:12px"></i></i><span>تم التسديد</span></div>
      <div class="modal-action" onclick="updateStatus('postponed')"><i style="width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(245,158,11,0.12);color:#fbbf24"><i class="fa-regular fa-clock" style="font-size:12px"></i></i><span>مؤجل</span></div>
      <div class="modal-action" onclick="updateStatus('closed')"><i style="width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.06)"><i class="fa-solid fa-door-closed" style="font-size:12px"></i></i><span>مغلق</span></div>
      <div class="modal-action" style="background:rgba(239,68,68,0.08)" onclick="updateStatus('refused')"><i style="width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(239,68,68,0.12);color:#f87171"><i class="fa-solid fa-ban" style="font-size:12px"></i></i><span>امتنع عن التسديد</span></div>

      <div class="modal-action" onclick="whatsappClient()"><i style="width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(34,197,94,0.12);color:#4ade80"><i class="fa-brands fa-whatsapp" style="font-size:12px"></i></i><span>واتساب</span></div>
    </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// نفس Firebase اللي في index.html
const firebaseConfig = {
  apiKey: "AIzaSyCLIzcO9i8QQ-YzYY5fIap6QNDsJDqgf60",
  authDomain: "karnipromaroc.firebaseapp.com",
  databaseURL: "https://karnipromaroc-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "karnipromaroc",
  storageBucket: "karnipromaroc.firebasestorage.app",
  messagingSenderId: "6746147726",
  appId: "1:6746147726:web:6e3a2d29941ab93ef432df"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let allCustomers = {};
let routeList = [];
let filteredList = [];
let selectedRealIndex = null;
let selectedFilteredIndex = null;

// الزبناء المحذوفين
const BLOCKED_NAMES = ['Rmdan Ikaml','Ouchen abdellah','Salh biranzaran','Salh tegir','Youssef biranzaran','Ahmed','احمد','Ahb','Agsb','Aissa','Hafidi','Rmdan','Ouchen'];

function isBlocked(name){
  if(!name) return false;
  const lower = name.toLowerCase().trim();
  return BLOCKED_NAMES.some(b => lower.includes(b.toLowerCase()));
}

function getRealBalance(c){
  if(typeof c.currentBalance!=='undefined' && c.currentBalance!==null) return parseFloat(c.currentBalance)||0;
  let p=0,r=0; if(c.operations && Array.isArray(c.operations)){ c.operations.forEach(op=>{ if(op.type==='paid') p+=Number(op.amount)||0; else if(op.type==='received') r+=Number(op.amount)||0; }); }
  return (parseFloat(c.amount)||0)+p-r;
}

function isDueTodayFromIndex(customer){
  if(!customer) return false;
  if(isBlocked(customer.name)) return false;
  const balance = getRealBalance(customer);
  if(balance <= 0) return false;
  const today = new Date().toISOString().split('T')[0];
  const date = customer.date;
  // دين اليوم = اليوم أو متأخر
  if(date === today) return true;
  if(date && date < today) return true; // متأخر يعتبر دين اليوم
  // إذا لا يوجد تاريخ لكن عليه دين يظهر
  if(!date && balance > 0) return true;
  return false;
}

// قراءة customers من karnipromaroc (نفس index)
const customersRef = ref(db, 'customers');
const routeRef = ref(db, 'routeManual');

onValue(customersRef, (snapshot)=>{
  allCustomers = snapshot.val() || {};
  console.log('Customers loaded:', Object.keys(allCustomers).length);
  // إذا routeManual فارغ، نبنيه من customers دين اليوم
  get(routeRef).then(snap=>{
    if(!snap.exists() || !snap.val() || snap.val().length===0){
      buildRouteFromToday();
    } else {
      routeList = snap.val();
      if(!Array.isArray(routeList)) routeList = Object.values(routeList);
      applyFilter();
    }
  });
});

onValue(routeRef, (snapshot)=>{
  if(snapshot.exists()){
    routeList = snapshot.val();
    if(!Array.isArray(routeList)) routeList = Object.values(routeList);
    applyFilter();
  }
});

window.buildRouteFromToday = window.syncFromIndex = async function(){
  const todayCustomers = [];
  const today = new Date().toISOString().split('T')[0];
  Object.keys(allCustomers).forEach(key=>{
    const c = allCustomers[key];
    if(isDueTodayFromIndex(c) && !isBlocked(c.name)){
      todayCustomers.push({
        id: key,
        customerId: key,
        name: c.name,
        phone: c.phone || '',
        city: c.city || c.ville || '',
        debt: getRealBalance(c),
        amount: getRealBalance(c),
        date: c.date,
        status: 'pending',
        originalCustomer: c
      });
    }
  });
  // ترتيب حسب المدينة ثم الاسم
  todayCustomers.sort((a,b)=> (a.city||'').localeCompare(b.city||'') || a.name.localeCompare(b.name));
  if(todayCustomers.length>0) todayCustomers[0].status='current';
  routeList = todayCustomers;
  await set(routeRef, routeList);
  alert(`تمت المزامنة من Index: ${todayCustomers.length} زبون دين اليوم`);
  applyFilter();
}

function applyFilter(){
  // فقط دين اليوم، مع حذف المحظورين
  filteredList = routeList.filter(item => {
    if(isBlocked(item.name)) return false;
    if(!['pending','current'].includes(item.status)) return false;
    return true;
  });
  renderMap();
  renderSidebar();
}

window.clearRoute = async function(){
  if(!confirm('مسح جميع الزبناء من المسار؟')) return;
  await set(routeRef, []);
  routeList=[]; filteredList=[];
  applyFilter();
}

window.resetRoute = async function(){
  if(!confirm('إعادة التعيين - البدء من جديد؟ سيتم إرجاع أول زبون إلى الحالي والباقي في الانتظار')) return;
  let first=true;
  routeList = routeList.filter(i=>!isBlocked(i.name)).map(item=>{
    if(['pending','current','postponed','refused','closed','visited'].includes(item.status)){
      if(isBlocked(item.name)) return null;
      if(first){ item.status='current'; first=false; } else { item.status='pending'; }
    }
    return item;
  }).filter(Boolean);
  await set(routeRef, routeList);
  applyFilter();
}

function getArabicStatus(s){ const m={'current':'الزبون الحالي','visited':'تم التسديد','pending':'في الانتظار','closed':'مغلق','postponed':'مؤجل','refused':'امتنع عن التسديد'}; return m[s]||s; }

function renderMap(){
  const container=document.getElementById('pointsContainer');
  const startC=document.getElementById('startContainer');
  const finishC=document.getElementById('finishContainer');
  const mapContent=document.getElementById('mapContent');
  const path=document.getElementById('routePath');
  const shadow=document.getElementById('roadShadow');
  const inner=document.getElementById('roadInner');
  container.innerHTML=''; startC.innerHTML=''; finishC.innerHTML='';
  let pending=0,current=0,visited=0;

  if(filteredList.length===0){
    [path,shadow,inner].forEach(p=>p.setAttribute('d',''));
    document.getElementById('totalCount').innerText=0;
    document.getElementById('pendingCount').innerText=0;
    document.getElementById('currentCount').innerText=0;
    document.getElementById('visitedCount').innerText=0;
    mapContent.style.height='520px';
    container.innerHTML=`<div style="position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);text-align:center;padding:20px;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:16px;backdrop-filter:blur(18px);width:85%;max-width:300px"><div style="font-size:30px;margin-bottom:10px;opacity:0.6"><i class="fa-solid fa-route"></i></div><div style="font-weight:700;font-size:13px">لا يوجد زبناء دين اليوم</div><div style="font-size:11px;color:var(--muted);margin-top:6px">تم حذف الزبناء الغير موجودين<br/>اضغط مزامنة من Index لجلب زبناء اليوم</div><button onclick="syncFromIndex()" style="margin-top:12px;padding:9px 18px;border-radius:10px;border:none;background:linear-gradient(135deg,#0f766e,#14b8a6);color:white;font-weight:700;font-size:12px;cursor:pointer;width:100%"><i class="fa-solid fa-rotate" style="margin-left:6px"></i>مزامنة من Index</button></div>`;
    return;
  }

  let points=[]; let h=window.innerWidth<768?112:128;
  let totalH=(filteredList.length*h)+320;
  mapContent.style.height=totalH+'px';
  document.getElementById('routePathDiv').style.height=totalH+'px';
  document.getElementById('routeSvg').setAttribute('height',totalH);
  document.getElementById('routeSvg').setAttribute('viewBox',`0 0 ${window.innerWidth} ${totalH}`);
  let width=document.getElementById('mapContainer').offsetWidth||window.innerWidth;
  filteredList.forEach((_,i)=>{ let y=80+i*h; let x=width/2+Math.sin(i*0.85)*(width*0.26); points.push({x,y}); });

  if(points.length>0){
    let d=`M ${points[0].x} ${points[0].y}`;
    for(let i=1;i<points.length;i++){ let p=points[i-1],c=points[i]; d+=` C ${p.x+(c.x-p.x)*0.35} ${p.y+45}, ${p.x+(c.x-p.x)*0.65} ${c.y-15}, ${c.x} ${c.y}`; }
    d+=` L ${points[points.length-1].x} ${points[points.length-1].y+120}`;
    [path,shadow,inner].forEach(p=>p.setAttribute('d',d));
    startC.innerHTML=`<div class="premium-terminal start" style="top:${points[0].y-55}px;left:${points[0].x}px"><div class="terminal-card"><div class="terminal-icon"><i class="fa-solid fa-house"></i></div><div><div class="terminal-text">الانطلاق</div><div class="terminal-sub">${filteredList.length} زبون • دين اليوم</div></div></div><div class="terminal-line"></div></div>`;
  }

  filteredList.forEach((item,i)=>{
    if(item.status==='pending') pending++; if(item.status==='current') current++; if(item.status==='visited') visited++;
    if(pending>0 && item.status==='pending' && current===0){ item.status='current'; current=1; pending--; }
    let pt=points[i]; let isLeft=i%2===0;
    let debt=item.debt||item.amount||'';
    container.innerHTML+=`<div class="point" style="top:${pt.y}px;left:${pt.x}px;flex-direction:${isLeft?'row-reverse':'row'}" onclick="openModal(${i})"><div class="point-dot ${item.status}">${i+1}</div><div class="point-card ${item.status==='current'?'current':''}"><div class="point-avatar ${item.status}">${(item.name||'C').charAt(0).toUpperCase()}</div><div style="flex:1;min-width:0"><div class="point-name">${item.name||'بدون'}</div><div class="point-meta">${debt?'<span style="color:#fbbf24">'+debt+' درهم</span>':''} <span>#${i+1}</span> ${item.city?'<span>'+item.city+'</span>':''}</div><div><span class="point-status ${item.status}">${getArabicStatus(item.status)}</span></div></div></div></div>`;
  });

  if(points.length>0){
    let last=points[points.length-1];
    finishC.innerHTML=`<div class="premium-terminal finish" style="top:${last.y+140}px;left:${last.x}px"><div class="terminal-line" style="transform:rotate(180deg);margin-top:0;margin-bottom:6px"></div><div class="terminal-card"><div class="terminal-icon"><i class="fa-solid fa-flag-checkered"></i></div><div><div class="terminal-text">النهاية</div><div class="terminal-sub">${filteredList.length} زبون</div></div></div></div>`;
  }

  document.getElementById('totalCount').innerText=filteredList.length;
  document.getElementById('pendingCount').innerText=pending;
  document.getElementById('currentCount').innerText=current;
  document.getElementById('visitedCount').innerText=visited;
  setTimeout(()=>{ const cur=document.querySelector('.point-dot.current'); if(cur) cur.scrollIntoView({behavior:'smooth',block:'center'}); },350);
}

function renderSidebar(){
  const c=document.getElementById('sidebarContent'); c.innerHTML='';
  filteredList.forEach((item,i)=>{
    const div=document.createElement('div'); div.className=`sidebar-item ${item.status==='current'?'current':''}`; div.dataset.index=i;
    div.innerHTML=`<div style="width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700">${i+1}</div><div style="flex:1;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${item.name} ${item.debt?'• '+item.debt+'د':''}</div><div style="opacity:0.4"><i class="fa-solid fa-grip-lines" style="font-size:10px"></i></div>`;
    div.addEventListener('click',()=>{ if(!div.classList.contains('dragging')) openModal(i); });
    div.draggable=true;
    div.addEventListener('dragstart',function(){ this.classList.add('dragging'); window.dragged=i; });
    div.addEventListener('dragover',function(e){ e.preventDefault(); this.style.borderTop='2px solid #14b8a6'; });
    div.addEventListener('dragleave',function(){ this.style.borderTop=''; });
    div.addEventListener('drop',function(e){ e.preventDefault(); this.style.borderTop=''; if(window.dragged!==null && window.dragged!==i) reorder(window.dragged,i); });
    div.addEventListener('dragend',function(){ this.classList.remove('dragging'); window.dragged=null; });
    div.addEventListener('touchstart',function(e){ window.dragged=i; this.classList.add('dragging'); },{passive:false});
    div.addEventListener('touchmove',function(e){ if(window.dragged===null) return; e.preventDefault(); const y=e.touches[0].clientY; const el=document.elementFromPoint(e.touches[0].clientX,y)?.closest('.sidebar-item'); document.querySelectorAll('.sidebar-item').forEach(x=>x.style.borderTop=''); if(el && el!==this) el.style.borderTop='2px solid #14b8a6'; },{passive:false});
    div.addEventListener('touchend',function(e){ this.classList.remove('dragging'); const y=e.changedTouches[0].clientY; const el=document.elementFromPoint(e.changedTouches[0].clientX,y)?.closest('.sidebar-item'); document.querySelectorAll('.sidebar-item').forEach(x=>x.style.borderTop=''); if(el){ const to=parseInt(el.dataset.index); if(to!==window.dragged) reorder(window.dragged,to); } window.dragged=null; });
    c.appendChild(div);
  });
}

function reorder(from,to){
  const arr=[...filteredList]; const [m]=arr.splice(from,1); arr.splice(to,0,m); filteredList=arr;
  let newRoute = routeList.filter(item=> !filteredList.some(f=>f.customerId===item.customerId) && !filteredList.some(f=>f.id===item.id));
  let firstIdx = routeList.findIndex(item=> filteredList.length>0 && (item.customerId===filteredList[0].customerId || item.id===filteredList[0].id));
  if(firstIdx===-1) firstIdx=0;
  filteredList.forEach((item,idx)=>{ newRoute.splice(firstIdx+idx,0,item); });
  routeList=newRoute;
  renderMap(); renderSidebar();
  set(ref(db,'routeManual'), routeList);
}

window.saveOrder = async function(){ await set(ref(db,'routeManual'), routeList); alert('تم حفظ الترتيب'); }

window.openModal = function(i){
  const item=filteredList[i];
  window.selectedRealIndex = routeList.findIndex(r=> r.customerId===item.customerId || r.id===item.id);
  if(window.selectedRealIndex===-1) window.selectedRealIndex = routeList.indexOf(item);
  window.selectedFilteredIndex = i;
  document.getElementById('modalClientName').innerText=item.name||'بدون';
  document.getElementById('modalClientMeta').innerText=`#${i+1} • ${getArabicStatus(item.status)} ${item.debt?'• '+item.debt+' درهم':''} ${item.city?'• '+item.city:''}`;
  document.getElementById('clientModal').classList.add('active');
}
window.closeModal = function(){ document.getElementById('clientModal').classList.remove('active'); }
window.updateStatus = async function(newStatus){
  if(window.selectedRealIndex!==null && window.selectedRealIndex!==-1){
    routeList[window.selectedRealIndex].status=newStatus;
    // تحديث customers أيضا إذا أمكن
    const custId = routeList[window.selectedRealIndex].customerId;
    if(custId && allCustomers[custId]){
      // يمكنك تحديث حالة العميل هنا إذا أردت
    }
  }
  await set(ref(db,'routeManual'), routeList);
  closeModal();
}
window.openDetails = function(){
  const item=filteredList[window.selectedFilteredIndex];
  alert(`الاسم: ${item.name}\nالمدينة: ${item.city}\nالدين: ${item.debt}\nالهاتف: ${item.phone||'لا يوجد'}\nالتاريخ: ${item.date}`);
}
window.callClient = function(){
  const item=filteredList[window.selectedFilteredIndex];
  if(item.phone) window.location.href='tel:'+item.phone;
  else alert('لا يوجد هاتف');
}
window.whatsappClient = function(){
  const item=filteredList[window.selectedFilteredIndex];
  if(item.phone) window.open('https://wa.me/'+item.phone.replace(/[^0-9]/g,''),'_blank');
  else alert('لا يوجد واتساب');
}
window.toggleSidebar = function(){
  const s=document.getElementById('sidebar');
  const c=document.getElementById('sidebarChevron');
  s.classList.toggle('open');
  c.className=s.classList.contains('open')?'fa-solid fa-chevron-right':'fa-solid fa-chevron-left';
}
window.addEventListener('resize',()=>{ renderMap(); });
</script>
</body>
</html>
