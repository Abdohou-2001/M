  var origAdd = EventTarget.prototype.addEventListener;
  var blockedTypes = { touchstart: 1, touchmove: 1, wheel: 1 };

    if (blockedTypes[type]) {
      if (options === undefined || options === null) {
        options = { passive: true };
      } else if (typeof options === 'boolean') {
        options = { capture: options, passive: true };
      } else {

      }
    }
    return origAdd.call(this, type, listener, options);
  };
})();

async function loadProducts(){
  try{
    const snap = await get(ref(db, "products"));
    if(snap.exists()){
      const val = snap.val();
      // تحويل سريع بدون map ثقيل
      products = [];
      for(const key in val){
        const p = val[key];
        if(p.image && !p.mainImage) p.mainImage = p.image;
        if(p.mainImage && (!p.images || p.images.length===0)) p.images = [p.mainImage];
        if(!p.images) p.images = p.mainImage ? [p.mainImage] : [];
        if(!p.mainImage && p.images.length>0) p.mainImage = p.images[0];
        if(p.hidden===undefined) p.hidden=false;
        if(p.lowStockThreshold===undefined) p.lowStockThreshold=10;
        products.push(p);
      }
    } else {
      products = [...initialProducts];
      await saveProducts();
    }
  } catch(e){
    console.error(e);
    products = [...initialProducts];
    showToast("خطأ في تحميل البيانات","error");
  }
}

async function saveProducts(){
  const data={};
  for(let i=0;i<products.length;i++){ data[products[i].id]=products[i]; }
  await set(ref(db,"products"), data);

/* ============ ضغط ذكي ~300KB ============ */
async function smartCompressTo300KB(file){
  // الهدف: ~300KB مع جودة ممتازة
  const TARGET_SIZE = 300 * 1024;
  const MAX_WIDTH = 1024; // أقل من 1920 لتوفير حجم
  const MIN_QUALITY = 0.6;
  const MAX_QUALITY = 0.92;

  // إذا الصورة أصغر من 350KB اتركها
  if(file.size <= 350*1024) return {file, info:`الصورة الأصلية ${Math.round(file.size/1024)}KB - لم يتم ضغطها`};

  return new Promise(async (resolve)=>{
    const bitmap = await createImageBitmap(file).catch(()=>null);
    if(!bitmap){ resolve({file, info:'تعذر الضغط'}); return; }
    
    let w=bitmap.width, h=bitmap.height;
    // تصغير العرض الأقصى
    if(w>MAX_WIDTH){ h=(MAX_WIDTH/w)*h; w=MAX_WIDTH; }
    if(h>MAX_WIDTH){ w=(MAX_WIDTH/h)*w; h=MAX_WIDTH; }

    const canvas=document.createElement('canvas');
    canvas.width=w; canvas.height=h;
    const ctx=canvas.getContext('2d',{alpha:false});
    ctx.drawImage(bitmap,0,0,w,h);
    bitmap.close();

    // جرب جودات مختلفة للوصول لـ 300KB
    let quality=0.82;
    let blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',quality));
    let attempts=0;
    while(blob && blob.size>TARGET_SIZE && quality>MIN_QUALITY && attempts<4){
      quality-=0.08;
      blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',quality));
      attempts++;
    }
    // إذا لا يزال كبيراً، صغر الأبعاد
    if(blob && blob.size>TARGET_SIZE){
      canvas.width=w*0.8; canvas.height=h*0.8;
      ctx.drawImage(canvas,0,0,w,h,0,0,canvas.width,canvas.height);
      blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',MIN_QUALITY));
    }

    if(!blob){ resolve({file, info:'فشل الضغط'}); return; }
    const newFile=new File([blob], file.name.replace(/\.\w+$/,'.jpg'), {type:'image/jpeg'});
    const saved=Math.round((1-blob.size/file.size)*100);
    resolve({file:newFile, info:`تم الضغط: ${Math.round(file.size/1024)}KB → ${Math.round(blob.size/1024)}KB (توفير ${saved}%)`});
  });
}

/* ============ Gallery ============ */
function handleFilesSelect(e){
  const files=Array.from(e.target.files||[]);
  if(!files.length) return;
  const allowed=['image/jpeg','image/jpg','image/png','image/webp'];
  const valid=[];
  for(const f of files){
    if(!allowed.includes(f.type)){ showToast(`نوع غير مدعوم: ${f.name}`,'error'); continue; }
    if(f.size>10*1024*1024){ showToast(`حجم كبير: ${f.name}`,'error'); continue; }
    valid.push(f);
  }
  addFilesToGallery(valid);
  e.target.value='';
}
function addFilesToGallery(files){
  files.forEach(file=>{
    const id=Date.now()+Math.random();
    const previewUrl=URL.createObjectURL(file);
    galleryImages.push({id, file, previewUrl, cloudinaryUrl:'', isExisting:false, progress:0, status:'pending', compressionInfo:''});
  });
  renderGallery();
}

      <div class="absolute bottom-0 left-0 right-0 bg-white/95 backdrop-blur flex items-center justify-between px-1 py-1">
        <button type="button" onclick="moveImage(${idx},-1)" ${idx===0?'disabled':''} class="w-6 h-6 bg-gray-100 rounded flex items-center justify-center disabled:opacity-30"><i class="fa-solid fa-chevron-right text-[10px]"></i></button>
        <span class="text-[10px] font-bold">${idx+1}</span>
        <button type="button" onclick="moveImage(${idx},1)" ${idx===galleryImages.length-1?'disabled':''} class="w-6 h-6 bg-gray-100 rounded flex items-center justify-center disabled:opacity-30"><i class="fa-solid fa-chevron-left text-[10px]"></i></button>
      </div>
      ${img.status==='uploading'?`<div class="absolute inset-0 bg-black/50 flex flex-col items-center justify-center p-2"><div class="w-full bg-white/30 h-1.5 rounded-full overflow-hidden"><div class="bg-emerald-500 h-1.5" style="width:${img.progress}%"></div></div><span class="text-white text-[10px] mt-1 font-bold">${img.progress}%</span></div>`:''}
    </div>
  `).join('');
}
window.removeGalleryImage=function(id){
  const idx=galleryImages.findIndex(g=>g.id==id);
  if(idx>-1){ if(galleryImages[idx].previewUrl && !galleryImages[idx].isExisting) URL.revokeObjectURL(galleryImages[idx].previewUrl); galleryImages.splice(idx,1); renderGallery(); }
}
window.moveImage=function(idx,dir){
  const n=idx+dir; if(n<0||n>=galleryImages.length) return;
  [galleryImages[idx], galleryImages[n]]=[galleryImages[n], galleryImages[idx]]; renderGallery();
}

function uploadToCloudinary(file, onProgress){
  return new Promise(async (resolve,reject)=>{
    const {file:compressedFile, info} = await smartCompressTo300KB(file);
    // عرض معلومات الضغط
    const infoEl=document.getElementById('compressionInfo');
    if(infoEl){ infoEl.textContent=info; infoEl.classList.remove('hidden'); }

    const fd=new FormData();
    fd.append('file', compressedFile);
    fd.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
    fd.append('folder', CLOUDINARY_FOLDER);
    // تحسينات Cloudinary لتقليل الحجم
    fd.append('quality', 'auto:good');
    fd.append('fetch_format', 'auto');
    const xhr=new XMLHttpRequest();
    xhr.open('POST',`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`);
    xhr.upload.onprogress=e=>{ if(e.lengthComputable) onProgress(Math.round(e.loaded/e.total*100)); };
    xhr.onload=()=>{ if(xhr.status>=200&&xhr.status<300){ try{ resolve(JSON.parse(xhr.responseText).secure_url); }catch{ reject(new Error('خطأ Cloudinary')); } } else { try{ reject(new Error(JSON.parse(xhr.responseText).error?.message||'فشل الرفع')); }catch{ reject(new Error('فشل الرفع')); } } };
    xhr.onerror=()=>reject(new Error('خطأ شبكة')); xhr.send(fd);
  });
}

async function uploadAllGalleryImages(){
  const toUpload=galleryImages.filter(g=>g.file&&!g.isExisting);
  if(!toUpload.length) return true;
  const overall=document.getElementById('overallProgress');
  const bar=document.getElementById('overallProgressBar');
  const text=document.getElementById('overallProgressText');
  overall.classList.remove('hidden');
  let completed=0;
  // رفع متوازي محدود بـ 3 ملفات لتوفير الذاكرة
  const CONCURRENCY=3;
  const queue=[...toUpload];
  const results=[];

  async function worker(){
    while(queue.length){
      const img=queue.shift();
      img.status='uploading';
      try{
        const url=await uploadToCloudinary(img.file, pct=>{ img.progress=pct; renderGallery(); });
        img.cloudinaryUrl=url; img.status='done'; completed++;
        bar.style.width=Math.round(completed/toUpload.length*100)+'%';
        text.textContent=Math.round(completed/toUpload.length*100)+'%';
        renderGallery(); results.push(url);
      } catch(e){ img.status='error'; renderGallery(); throw e; }
    }
  }
  const workers=Array(Math.min(CONCURRENCY, toUpload.length)).fill(0).map(()=>worker());
  try{ await Promise.all(workers); overall.classList.add('hidden'); document.getElementById('compressionInfo').classList.add('hidden'); showToast('✅ تم رفع جميع الصور بنجاح','success'); return true; }
  catch(err){ overall.classList.add('hidden'); showToast('فشل رفع صورة: '+err.message,'error'); return false; }
}

/* ============ Render محسن للآلاف ============ */
function applyFiltersAndSearch(){
  filteredProducts=products.filter(p=>{
    const s=(p.name||"").toLowerCase().includes(searchQuery.toLowerCase());
    const low=(p.stock||0)<=(p.lowStockThreshold||10);
    const st=statusFilter==='all'||(statusFilter==='low'&&low)||(statusFilter==='available'&&!low);
    return s&&st;
  });
  filteredProducts.sort((a,b)=>(a.name||"").localeCompare(b.name||"",'ar',{sensitivity:'base'}));
  displayedCount=0;
  renderProductsChunk();
}

function renderProductsChunk(){
  const container=document.getElementById('productsContainer');
  const empty=document.getElementById('emptyState');
  const loadMore=document.getElementById('loadMoreContainer');

  if(filteredProducts.length===0){ container.innerHTML=''; empty.classList.remove('hidden'); loadMore.classList.add('hidden'); return; }
  empty.classList.add('hidden');

  const nextChunk=filteredProducts.slice(displayedCount, displayedCount+PAGE_SIZE);
  // استخدام DocumentFragment لتقليل إعادة الرسم
  const fragment=document.createDocumentFragment();
  const tempDiv=document.createElement('div');
  tempDiv.innerHTML=nextChunk.map(p=>createProductCard(p)).join('');
  while(tempDiv.firstChild){ fragment.appendChild(tempDiv.firstChild); }
  
  if(displayedCount===0) container.innerHTML='';
  container.appendChild(fragment);
  displayedCount+=nextChunk.length;

  if(displayedCount<filteredProducts.length){
    loadMore.classList.remove('hidden');
    document.getElementById('remainingCount').textContent=filteredProducts.length-displayedCount;
  } else {
    loadMore.classList.add('hidden');
  }
}

function loadMore(){ renderProductsChunk(); }
function renderProducts(){ applyFiltersAndSearch(); }

function createProductCard(product){
  const low=(product.stock||0)<=(product.lowStockThreshold||10);
  const sc=low?'bg-amber-100 text-amber-700':'bg-emerald-100 text-emerald-700';
  const st=low?'منخفض':'متوفر';
  const def='https://images.unsplash.com/photo-1542838132-92c53300491e?w=400&h=400&fit=crop';
  const hc=product.hidden?'bg-green-100 text-green-700':'bg-yellow-100 text-yellow-700';
  const hi=product.hidden?'fa-eye':'fa-eye-slash'; const ht=product.hidden?'إظهار':'إخفاء';
  const main=product.mainImage||product.image||(product.images&&product.images[0])||def;
  const count=product.images?product.images.length:0;
  return `<div class="product-card bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden ${product.hidden?'opacity-60':''}"><div class="p-4"><div class="flex gap-4"><div class="w-20 h-20 bg-gray-100 rounded-lg overflow-hidden flex-shrink-0 relative cursor-pointer" onclick="openSlider(${product.id})"><img src="${main}" alt="${product.name}" class="w-full h-full object-cover" loading="lazy" decoding="async" onerror="this.src='${def}'">${count>1?`<span class="absolute bottom-1 right-1 bg-black/70 text-white text-[10px] px-1.5 py-0.5 rounded-full">${count}<i class="fa-solid fa-images mr-1"></i></span>`:''}</div><div class="flex-1 min-w-0"><div class="flex justify-between gap-2 mb-2"><h3 class="font-semibold text-sm line-clamp-2">${product.name||'بدون اسم'}</h3><span class="px-2.5 py-1 rounded-full text-xs font-medium ${sc}">${st}</span></div><p class="text-lg font-bold text-emerald-600">${parseFloat(product.price||0).toFixed(2)} <span class="text-xs font-normal text-gray-500">درهم</span></p><p class="text-xs text-gray-500">المخزون: ${parseInt(product.stock||0)}</p></div></div><div class="flex gap-2 mt-4 pt-4 border-t"><button onclick="toggleHideProduct(${product.id})" class="flex-1 px-3 py-2 ${hc} rounded-lg text-sm font-medium flex items-center justify-center gap-1"><i class="fa-solid ${hi} text-xs"></i><span>${ht}</span></button><button onclick="editProduct(${product.id})" class="px-3 py-2 bg-blue-100 text-blue-700 rounded-lg"><i class="fa-solid fa-pen-to-square"></i></button><button onclick="deleteProduct(${product.id})" class="px-3 py-2 bg-red-100 text-red-700 rounded-lg"><i class="fa-solid fa-trash"></i></button></div></div></div>`;
}

function updateStats(){
  // استخدام requestAnimationFrame لتجنب تجميد الواجهة
  requestAnimationFrame(()=>{
    let ts=0, tv=0, low=0;
    for(let i=0;i<products.length;i++){ ts+=parseInt(products[i].stock)||0; tv+=(parseFloat(products[i].price)||0)*(parseInt(products[i].stock)||0); if((parseInt(products[i].stock)||0)<=(parseInt(products[i].lowStockThreshold)||10)) low++; }
    document.getElementById('totalStock').textContent=ts.toLocaleString('ar-MA');
    document.getElementById('totalValue').textContent=tv.toLocaleString('ar-MA',{minimumFractionDigits:0,maximumFractionDigits:0});
    document.getElementById('lowStockCount').textContent=low;
    document.getElementById('totalProducts').textContent=products.length;
  });
}

function openAddModal(){
  editingProductId=null; galleryImages=[];
  document.getElementById('modalTitle').textContent='إضافة منتج جديد';
  document.getElementById('productForm').reset();
  document.getElementById('productId').value='';
  renderGallery();
  document.getElementById('productModal').classList.remove('hidden');
}
window.editProduct=function(id){
  const p=products.find(x=>x.id==id); if(!p) return;
  editingProductId=p.id; galleryImages=[];
  const imgs=p.images||(p.mainImage?[p.mainImage]: (p.image?[p.image]:[]));
  imgs.forEach(url=>{ galleryImages.push({id:Date.now()+Math.random(), file:null, previewUrl:url, cloudinaryUrl:url, isExisting:true, progress:100, status:'done'}); });
  document.getElementById('modalTitle').textContent='تعديل المنتج';
  document.getElementById('productId').value=p.id;
  document.getElementById('productName').value=p.name||'';
  document.getElementById('productPrice').value=p.price||0;
  document.getElementById('productStock').value=p.stock||0;
  document.getElementById('lowStockThreshold').value=p.lowStockThreshold||10;
  renderGallery();
  document.getElementById('productModal').classList.remove('hidden');
}
function closeProductModal(){
  document.getElementById('productModal').classList.add('hidden');
  document.getElementById('productForm').reset();
  galleryImages.forEach(g=>{ if(g.previewUrl&&!g.isExisting) URL.revokeObjectURL(g.previewUrl); });
  galleryImages=[]; editingProductId=null;
}
async function handleFormSubmit(e){
  e.preventDefault();
  const saveBtn=document.getElementById('saveBtn');
  const name=document.getElementById('productName').value.trim();
  if(!name){ showToast('اسم المنتج مطلوب','error'); return; }
  saveBtn.disabled=true; saveBtn.innerHTML='<i class="fa-solid fa-spinner fa-spin ml-2"></i> جاري الرفع...';
  const ok=await uploadAllGalleryImages();
  if(!ok){ saveBtn.disabled=false; saveBtn.innerHTML='<i class="fa-solid fa-check ml-2"></i> حفظ المنتج'; return; }
  const finalImages=galleryImages.map(g=>g.cloudinaryUrl||g.previewUrl).filter(Boolean);
  const data={ name, price:parseFloat(document.getElementById('productPrice').value)||0, stock:parseInt(document.getElementById('productStock').value)||0, lowStockThreshold:parseInt(document.getElementById('lowStockThreshold').value)||10, mainImage:finalImages[0]||'', images:finalImages, hidden:false };
  try{
    if(editingProductId){ const idx=products.findIndex(p=>p.id==editingProductId); if(idx!==-1) products[idx]={...products[idx], ...data}; showToast('تم تحديث المنتج بنجاح','success'); }
    else { products.push({id:Date.now(), ...data}); showToast('تم إضافة المنتج بنجاح','success'); }
    await saveProducts(); applyFiltersAndSearch(); updateStats(); closeProductModal();
  } catch(err){ showToast('خطأ في الحفظ: '+err.message,'error'); }
  finally { saveBtn.disabled=false; saveBtn.innerHTML='<i class="fa-solid fa-check ml-2"></i> حفظ المنتج'; }
}
window.toggleHideProduct=async function(id){
  const p=products.find(x=>x.id==id); if(!p) return; p.hidden=!p.hidden;
  await saveProducts(); applyFiltersAndSearch(); showToast(p.hidden?'تم إخفاء المنتج':'تم إظهار المنتج','success');
}
window.deleteProduct=function(id){ deletingProductId=id; document.getElementById('deleteModal').classList.remove('hidden'); }
function closeDeleteModal(){ document.getElementById('deleteModal').classList.add('hidden'); deletingProductId=null; }
async function confirmDelete(){
  if(!deletingProductId) return;
  products=products.filter(p=>p.id!=deletingProductId); await saveProducts(); applyFiltersAndSearch(); updateStats(); showToast('تم حذف المنتج','success'); closeDeleteModal();
}
function openFilterModal(){ document.getElementById('filterModal').classList.remove('hidden'); }
function closeFilterModal(){ document.getElementById('filterModal').classList.add('hidden'); }
function applyFilters(){ const s=document.querySelector('input[name="statusFilter"]:checked'); if(s) statusFilter=s.value; applyFiltersAndSearch(); closeFilterModal(); showToast('تم تطبيق التصفية','success'); }
function resetFilters(){ statusFilter='all'; document.querySelector('input[name="statusFilter"][value="all"]').checked=true; applyFiltersAndSearch(); closeFilterModal(); showToast('تم إعادة التعيين','info'); }

// Slider
window.openSlider=function(id){
  const p=products.find(x=>x.id==id); if(!p) return;
  sliderImages=p.images||(p.mainImage?[p.mainImage]:[]); if(!sliderImages.length) return;
  sliderIndex=0; showSlide(); document.getElementById('sliderModal').classList.add('active');
}
window.openSliderFromGallery=function(idx){
  sliderImages=galleryImages.map(g=>g.cloudinaryUrl||g.previewUrl); sliderIndex=idx; showSlide(); document.getElementById('sliderModal').classList.add('active');
}
function showSlide(){
  if(!sliderImages.length) return;
  document.getElementById('sliderImage').src=sliderImages[sliderIndex];
  document.getElementById('sliderCounter').textContent=`${sliderIndex+1} / ${sliderImages.length}`;
  document.getElementById('sliderDots').innerHTML=sliderImages.map((_,i)=>`<div class="dot ${i===sliderIndex?'active':''}" onclick="goToSlide(${i})"></div>`).join('');
}
window.nextSlide=function(){ sliderIndex=(sliderIndex+1)%sliderImages.length; showSlide(); }
window.prevSlide=function(){ sliderIndex=(sliderIndex-1+sliderImages.length)%sliderImages.length; showSlide(); }
window.goToSlide=function(i){ sliderIndex=i; showSlide(); }
window.closeSlider=function(){ document.getElementById('sliderModal').classList.remove('active'); }

function showToast(msg,type='success'){
  const t=document.getElementById('toast'); const ic=document.getElementById('toastIcon'); const m=document.getElementById('toastMessage');
  m.textContent=msg; ic.className=type==='success'?'fa-solid fa-check-circle text-emerald-400':type==='error'?'fa-solid fa-circle-exclamation text-red-400':'fa-solid fa-info-circle text-blue-400';
  t.classList.remove('hidden'); setTimeout(()=>t.classList.add('hidden'),3000);
}

window.openAddModal=openAddModal;
window.closeProductModal=closeProductModal;
window.closeDeleteModal=closeDeleteModal;
window.openFilterModal=openFilterModal;
window.closeFilterModal=closeFilterModal;
window.applyFilters=applyFilters;
window.resetFilters=resetFilters;
</script>
