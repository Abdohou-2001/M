<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><!-- PLAYABLE_TOUCH_PATCH_V1 --><script>
(function() {
  if (window.__playableTouchPatchInstalled) return;
  window.__playableTouchPatchInstalled = true;
  var origAdd = EventTarget.prototype.addEventListener;
  var blockedTypes = { touchstart: 1, touchmove: 1, wheel: 1 };
  EventTarget.prototype.addEventListener = function(type, listener, options) {
    if (blockedTypes[type]) {
      if (options === undefined || options === null) {
        options = { passive: true };
      } else if (typeof options === 'boolean') {
        options = { capture: options, passive: true };
      } else {
        options = Object.assign({}, options, { passive: true });
      }
    }
    return origAdd.call(this, type, listener, options);
  };
})();
</script><script>window.Intl=window.Intl||{};Intl.t=function(s){return(Intl._locale&&Intl._locale[s])||s;};</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المنتجات - إدارة المخزون</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap');
  *{font-family:'Cairo', sans-serif;}
  body{background:#f8fafc;}
  .scrollbar-hide::-webkit-scrollbar{display:none} .scrollbar-hide{-ms-overflow-style:none;scrollbar-width:none}
  .modal-backdrop{backdrop-filter:blur(4px)} .animate-slide-up{animation:slideUp 0.3s ease-out} @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}} .animate-fade-in{animation:fadeIn 0.2s ease-out} @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .product-card:hover{transform:translateY(-2px);transition:all 0.2s ease}
  input[type="number"]::-webkit-inner-spin-button,input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
</style>
</head>
<body class="pb-10">

  <main class="max-w-7xl mx-auto px-4 pt-6 pb-6">
    <!-- Stats Cards -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4 mb-6">
      <div class="bg-white rounded-xl shadow-sm p-4 md:p-5 border border-gray-100"><div class="flex items-start justify-between"><div><p class="text-gray-500 text-xs md:text-sm mb-1">قيمة المخزون</p><p class="text-xl md:text-2xl font-bold text-gray-900" id="totalValue">0</p><p class="text-xs text-gray-500 mt-1">درهم</p></div><div class="w-10 h-10 md:w-12 md:h-12 bg-emerald-100 rounded-lg flex items-center justify-center"><i class="fa-solid fa-coins text-emerald-600 text-lg"></i></div></div></div>
      <div class="bg-white rounded-xl shadow-sm p-4 md:p-5 border border-gray-100"><div class="flex items-start justify-between"><div><p class="text-gray-500 text-xs md:text-sm mb-1">إجمالي المخزون</p><p class="text-xl md:text-2xl font-bold text-gray-900" id="totalStock">0</p><p class="text-xs text-gray-500 mt-1">وحدة</p></div><div class="w-10 h-10 md:w-12 md:h-12 bg-blue-100 rounded-lg flex items-center justify-center"><i class="fa-solid fa-boxes-stacked text-blue-600 text-lg"></i></div></div></div>
      <div class="bg-white rounded-xl shadow-sm p-4 md:p-5 border border-gray-100"><div class="flex items-start justify-between"><div><p class="text-gray-500 text-xs md:text-sm mb-1">منتجات منخفضة</p><p class="text-xl md:text-2xl font-bold text-amber-600" id="lowStockCount">0</p><p class="text-xs text-gray-500 mt-1">منتج</p></div><div class="w-10 h-10 md:w-12 md:h-12 bg-amber-100 rounded-lg flex items-center justify-center"><i class="fa-solid fa-triangle-exclamation text-amber-600 text-lg"></i></div></div></div>
      <div class="bg-white rounded-xl shadow-sm p-4 md:p-5 border border-gray-100"><div class="flex items-start justify-between"><div><p class="text-gray-500 text-xs md:text-sm mb-1">إجمالي المنتجات</p><p class="text-xl md:text-2xl font-bold text-gray-900" id="totalProducts">0</p><p class="text-xs text-gray-500 mt-1">منتج</p></div><div class="w-10 h-10 md:w-12 md:h-12 bg-violet-100 rounded-lg flex items-center justify-center"><i class="fa-solid fa-cube text-violet-600 text-lg"></i></div></div></div>
    </div>

    <!-- Search and Filter Bar -->
    <div class="bg-white rounded-xl shadow-sm p-4 mb-4 border border-gray-100">
      <div class="flex gap-2">
        <div class="flex-1 relative">
          <input type="text" id="searchInput" placeholder="البحث عن منتج..." class="w-full pr-10 pl-4 py-2.5 rounded-lg border border-gray-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 outline-none transition text-sm">
          <i class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
        </div>
        <button id="filterBtn" class="px-4 py-2.5 bg-gray-100 hover:bg-gray-200 rounded-lg transition flex items-center gap-2 text-gray-700">
          <i class="fa-solid fa-sliders"></i><span class="hidden sm:inline text-sm font-medium">تصفية</span>
        </button>
      </div>
    </div>

    <div id="productsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

    <div id="emptyState" class="hidden text-center py-16">
      <div class="w-24 h-24 mx-auto mb-4 bg-gray-100 rounded-full flex items-center justify-center"><i class="fa-solid fa-box-open text-4xl text-gray-400"></i></div>
      <h3 class="text-xl font-semibold text-gray-900 mb-2">لا توجد منتجات</h3>
      <p class="text-gray-500 mb-6">ابدأ بإضافة منتجك الأول</p>
      <button onclick="openAddModal()" class="bg-emerald-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-emerald-700 transition"><i class="fa-solid fa-plus ml-2"></i>إضافة منتج</button>
    </div>
  </main>

  <!-- Floating Add Button -->
  <button id="fabBtn" class="fixed bottom-6 left-4 md:left-6 w-14 h-14 bg-emerald-600 hover:bg-emerald-700 text-white rounded-full shadow-lg hover:shadow-xl transition-all flex items-center justify-center z-30">
    <i class="fa-solid fa-plus text-xl"></i>
  </button>

  <!-- Add/Edit Product Modal -->
  <div id="productModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="modal-backdrop absolute inset-0 bg-black/50" onclick="closeProductModal()"></div>
    <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto animate-slide-up">
      <div class="sticky top-0 bg-white border-b border-gray-100 px-6 py-4 flex items-center justify-between z-10">
        <h2 id="modalTitle" class="text-xl font-bold text-gray-900">إضافة منتج جديد</h2>
        <button onclick="closeProductModal()" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-100 transition"><i class="fa-solid fa-xmark text-gray-500"></i></button>
      </div>
      <form id="productForm" class="p-6 space-y-4">
        <input type="hidden" id="productId">
        <div><label class="block text-sm font-semibold text-gray-700 mb-2">اسم المنتج *</label><input type="text" id="productName" required class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 outline-none transition" placeholder="مثال: Dalaa Bakal"></div>
        <div class="grid grid-cols-2 gap-4">
          <div><label class="block text-sm font-semibold text-gray-700 mb-2">السعر (درهم) *</label><input type="number" id="productPrice" required min="0" step="0.01" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 outline-none transition" placeholder="0.00"></div>
          <div><label class="block text-sm font-semibold text-gray-700 mb-2">الكمية *</label><input type="number" id="productStock" required min="0" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 outline-none transition" placeholder="0"></div>
        </div>
        <div><label class="block text-sm font-semibold text-gray-700 mb-2">حد التنبيه للكمية المنخفضة</label><input type="number" id="lowStockThreshold" min="0" value="10" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 outline-none transition" placeholder="10"></div>
        <div class="flex gap-3 pt-4">
          <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-lg font-semibold transition shadow-md"><i class="fa-solid fa-check ml-2"></i>حفظ</button>
          <button type="button" onclick="closeProductModal()" class="px-6 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg font-semibold transition">إلغاء</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div id="deleteModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="modal-backdrop absolute inset-0 bg-black/50" onclick="closeDeleteModal()"></div>
    <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-md animate-slide-up">
      <div class="p-6"><div class="w-16 h-16 mx-auto mb-4 bg-red-100 rounded-full flex items-center justify-center"><i class="fa-solid fa-trash text-2xl text-red-600"></i></div><h3 class="text-xl font-bold text-gray-900 text-center mb-2">حذف المنتج</h3><p class="text-gray-600 text-center mb-6">هل أنت متأكد من حذف هذا المنتج؟ لا يمكن التراجع عن هذا الإجراء.</p><div class="flex gap-3"><button id="confirmDeleteBtn" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-3 rounded-lg font-semibold transition">نعم، احذف</button><button onclick="closeDeleteModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-3 rounded-lg font-semibold transition">إلغاء</button></div></div>
    </div>
  </div>

  <!-- Filter Modal -->
  <div id="filterModal" class="hidden fixed inset-0 z-50 flex items-end md:items-center justify-center md:p-4">
    <div class="modal-backdrop absolute inset-0 bg-black/50" onclick="closeFilterModal()"></div>
    <div class="relative bg-white rounded-t-2xl md:rounded-2xl shadow-2xl w-full md:max-w-md animate-slide-up">
      <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between"><h2 class="text-xl font-bold text-gray-900">تصفية المنتجات</h2><button onclick="closeFilterModal()" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-100 transition"><i class="fa-solid fa-xmark text-gray-500"></i></button></div>
      <div class="p-6 space-y-4"><div><label class="block text-sm font-semibold text-gray-700 mb-2">الحالة</label><div class="space-y-2"><label class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-50 cursor-pointer border border-transparent hover:border-gray-200"><input type="radio" name="statusFilter" value="all" checked class="w-4 h-4 text-emerald-600"><span>الكل</span></label><label class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-50 cursor-pointer border border-transparent hover:border-gray-200"><input type="radio" name="statusFilter" value="available" class="w-4 h-4 text-emerald-600"><span>متوفر</span></label><label class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-50 cursor-pointer border border-gray-200"><input type="radio" name="statusFilter" value="low" class="w-4 h-4 text-emerald-600"><span>منخفض</span></label></div></div><div class="flex gap-3 pt-4"><button onclick="applyFilters()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-lg font-semibold transition">تطبيق</button><button onclick="resetFilters()" class="px-6 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg font-semibold transition">إعادة تعيين</button></div></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed top-20 left-1/2 -translate-x-1/2 z-50 animate-fade-in"><div class="bg-gray-900 text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-3"><i id="toastIcon" class="fa-solid fa-check-circle text-emerald-400"></i><span id="toastMessage"></span></div></div>

<script type="module">
import { db } from "./firebase.js";
import { ref, get, set } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";

const initialProducts = [
  { id: 1, name: 'Asperox Magic Yellow', price: 0, stock: 0, lowStockThreshold: 10, image: 'https://i.ibb.co/Qjz9xgdQ/1779799104968.png', hidden: false },
  { id: 2, name: 'Luisa', price: 0, stock: 0, lowStockThreshold: 10, image: 'https://i.ibb.co/KxShH2Df/file-00000000923471f6b71cffcbf83f6797-1.png', hidden: false },
  { id: 3, name: 'Cadum', price: 0, stock: 0, lowStockThreshold: 10, image: 'https://i.ibb.co/bjd7DZdY/file-000000004c5871fd8cfa806c66400729.png', hidden: false }
];

let products = [];
let statusFilter = 'all';
let searchQuery = '';
let editingProductId = null;
let deletingProductId = null;

document.addEventListener('DOMContentLoaded', async () => {
  await loadProducts();
  renderProducts();
  updateStats();
  setupEventListeners();
});

async function loadProducts(){
  try{
    const snapshot = await get(ref(db, "products"));
    if(snapshot.exists()){
      const val = snapshot.val();
      products = Object.values(val).map(p=>({ hidden:false, lowStockThreshold:10, ...p }));
    } else {
      products = [...initialProducts];
      await saveProducts();
    }
  } catch(e){
    console.error("Firebase load error:", e);
    products = [...initialProducts];
    showToast("خطأ في تحميل البيانات", "error");
  }
}

async function saveProducts(){
  const data = {};
  products.forEach(p=>{ data[p.id]=p; });
  await set(ref(db, "products"), data);
}

function setupEventListeners(){
  document.getElementById('fabBtn').addEventListener('click', openAddModal);
  document.getElementById('filterBtn').addEventListener('click', openFilterModal);
  document.getElementById('searchInput').addEventListener('input', (e)=>{ searchQuery=e.target.value; renderProducts(); });
  document.getElementById('productForm').addEventListener('submit', handleFormSubmit);
  document.getElementById('confirmDeleteBtn').addEventListener('click', confirmDelete);
}

function renderProducts(){
  const container = document.getElementById('productsContainer');
  const emptyState = document.getElementById('emptyState');
  let filtered = products.filter(p=>{
    const matchesSearch = (p.name||"").toLowerCase().includes(searchQuery.toLowerCase());
    const isLow = (p.stock||0) <= (p.lowStockThreshold||10);
    const matchesStatus = statusFilter==='all' || (statusFilter==='low' && isLow) || (statusFilter==='available' && !isLow);
    return matchesSearch && matchesStatus;
  });
  filtered.sort((a,b)=> (a.name||"").localeCompare(b.name||"", 'ar', {sensitivity:'base'}));
  if(filtered.length===0){
    container.innerHTML='';
    emptyState.classList.remove('hidden');
  } else {
    emptyState.classList.add('hidden');
    container.innerHTML = filtered.map(p=>createProductCard(p)).join('');
  }
}

function createProductCard(product){
  const isLow = (product.stock||0) <= (product.lowStockThreshold||10);
  const statusClass = isLow ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700';
  const statusText = isLow ? 'منخفض' : 'متوفر';
  const defaultImage = 'https://images.unsplash.com/photo-1542838132-92c53300491e?w=400&h=400&fit=crop';
  const hideBtnClass = product.hidden ? 'bg-green-100 hover:bg-green-200 text-green-700' : 'bg-yellow-100 hover:bg-yellow-200 text-yellow-700';
  const hideBtnIcon = product.hidden ? 'fa-eye' : 'fa-eye-slash';
  const hideBtnText = product.hidden ? 'إظهار' : 'إخفاء';
  const price = parseFloat(product.price||0).toFixed(2);
  const stock = parseInt(product.stock||0);

  return `
    <div class="product-card bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden ${product.hidden?'opacity-60':''}">
      <div class="p-4">
        <div class="flex gap-4">
          <div class="w-20 h-20 md:w-24 md:h-24 bg-gray-100 rounded-lg overflow-hidden flex-shrink-0">
            <img src="${product.image||defaultImage}" alt="${product.name}" class="w-full h-full object-cover" onerror="this.src='${defaultImage}'">
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-start justify-between gap-2 mb-2">
              <h3 class="font-semibold text-gray-900 text-sm md:text-base line-clamp-2">${product.name||'بدون اسم'}</h3>
              <span class="px-2.5 py-1 rounded-full text-xs font-medium ${statusClass} whitespace-nowrap">${statusText}</span>
            </div>
            <div>
              <p class="text-lg md:text-xl font-bold text-emerald-600">${price} <span class="text-xs font-normal text-gray-500">درهم</span></p>
              <p class="text-xs text-gray-500 mt-0.5">المخزون: ${stock}</p>
            </div>
          </div>
        </div>
        <div class="flex gap-2 mt-4 pt-4 border-t border-gray-100">
          <button onclick="toggleHideProduct(${product.id})" class="flex-1 px-3 py-2 ${hideBtnClass} rounded-lg text-sm font-medium transition flex items-center justify-center gap-1.5"><i class="fa-solid ${hideBtnIcon} text-xs"></i><span>${hideBtnText}</span></button>
          <button onclick="editProduct(${product.id})" class="px-3 py-2 bg-blue-100 hover:bg-blue-200 text-blue-700 rounded-lg transition"><i class="fa-solid fa-pen-to-square"></i></button>
          <button onclick="deleteProduct(${product.id})" class="px-3 py-2 bg-red-100 hover:bg-red-200 text-red-700 rounded-lg transition"><i class="fa-solid fa-trash"></i></button>
        </div>
      </div>
    </div>`;
}

function updateStats(){
  const totalStock = products.reduce((s,p)=>s+(parseInt(p.stock)||0),0);
  const totalValue = products.reduce((s,p)=>s+((parseFloat(p.price)||0)*(parseInt(p.stock)||0)),0);
  const lowStockCount = products.filter(p=> (parseInt(p.stock)||0) <= (parseInt(p.lowStockThreshold)||10)).length;
  document.getElementById('totalStock').textContent = totalStock.toLocaleString('ar-MA');
  document.getElementById('totalValue').textContent = totalValue.toLocaleString('ar-MA',{minimumFractionDigits:0,maximumFractionDigits:0});
  document.getElementById('lowStockCount').textContent = lowStockCount;
  document.getElementById('totalProducts').textContent = products.length;
}

function openAddModal(){
  editingProductId = null;
  document.getElementById('modalTitle').textContent = 'إضافة منتج جديد';
  document.getElementById('productForm').reset();
  document.getElementById('productId').value = '';
  document.getElementById('productModal').classList.remove('hidden');
}

window.editProduct = function(id){
  const product = products.find(p=>p.id==id);
  if(!product) return;
  editingProductId = product.id;
  document.getElementById('modalTitle').textContent = 'تعديل المنتج';
  document.getElementById('productId').value = product.id;
  document.getElementById('productName').value = product.name||'';
  document.getElementById('productPrice').value = product.price||0;
  document.getElementById('productStock').value = product.stock||0;
  document.getElementById('lowStockThreshold').value = product.lowStockThreshold||10;
  document.getElementById('productModal').classList.remove('hidden');
}

function closeProductModal(){
  document.getElementById('productModal').classList.add('hidden');
  document.getElementById('productForm').reset();
  editingProductId = null;
}

async function handleFormSubmit(e){
  e.preventDefault();
  const productData = {
    name: document.getElementById('productName').value.trim(),
    price: parseFloat(document.getElementById('productPrice').value)||0,
    stock: parseInt(document.getElementById('productStock').value)||0,
    lowStockThreshold: parseInt(document.getElementById('lowStockThreshold').value)||10,
    hidden: false
  };
  if(!productData.name){ showToast('اسم المنتج مطلوب','error'); return; }

  try{
    if(editingProductId){
      const index = products.findIndex(p=>p.id==editingProductId);
      if(index!==-1){
        const oldImage = products[index].image || '';
        products[index] = { ...products[index], ...productData, image: oldImage };
      }
      showToast('تم تحديث المنتج بنجاح','success');
    } else {
      const newProduct = { id: Date.now(), image:'', ...productData };
      products.push(newProduct);
      showToast('تم إضافة المنتج بنجاح','success');
    }
    await saveProducts();
    renderProducts();
    updateStats();
    closeProductModal();
  } catch(err){
    console.error(err);
    showToast('خطأ في الحفظ: '+err.message,'error');
  }
}

window.toggleHideProduct = async function(id){
  const product = products.find(p=>p.id==id);
  if(!product) return;
  product.hidden = !product.hidden;
  try{
    await saveProducts();
    renderProducts();
    showToast(product.hidden?'تم إخفاء المنتج':'تم إظهار المنتج','success');
  } catch(e){ showToast('خطأ: '+e.message,'error'); }
}

window.deleteProduct = function(id){
  deletingProductId = id;
  document.getElementById('deleteModal').classList.remove('hidden');
}

function closeDeleteModal(){
  document.getElementById('deleteModal').classList.add('hidden');
  deletingProductId = null;
}

async function confirmDelete(){
  if(!deletingProductId) return;
  try{
    products = products.filter(p=>p.id!=deletingProductId);
    await saveProducts();
    renderProducts();
    updateStats();
    showToast('تم حذف المنتج بنجاح','success');
  } catch(e){ showToast('خطأ في الحذف','error'); }
  closeDeleteModal();
}

function openFilterModal(){ document.getElementById('filterModal').classList.remove('hidden'); }
function closeFilterModal(){ document.getElementById('filterModal').classList.add('hidden'); }
function applyFilters(){
  const selected = document.querySelector('input[name="statusFilter"]:checked');
  if(selected) statusFilter = selected.value;
  renderProducts();
  closeFilterModal();
  showToast('تم تطبيق التصفية','success');
}
function resetFilters(){
  statusFilter='all';
  const allRadio = document.querySelector('input[name="statusFilter"][value="all"]');
  if(allRadio) allRadio.checked=true;
  renderProducts();
  closeFilterModal();
  showToast('تم إعادة التعيين','info');
}

function showToast(message, type='success'){
  const toast=document.getElementById('toast');
  const icon=document.getElementById('toastIcon');
  const msg=document.getElementById('toastMessage');
  msg.textContent=message;
  icon.className = type==='success' ? 'fa-solid fa-check-circle text-emerald-400' : type==='error' ? 'fa-solid fa-circle-exclamation text-red-400' : 'fa-solid fa-info-circle text-blue-400';
  toast.classList.remove('hidden');
  setTimeout(()=>toast.classList.add('hidden'),3000);
}

// Global exports
window.openAddModal=openAddModal;
window.closeProductModal=closeProductModal;
window.closeDeleteModal=closeDeleteModal;
window.openFilterModal=openFilterModal;
window.closeFilterModal=closeFilterModal;
window.applyFilters=applyFilters;
window.resetFilters=resetFilters;
window.showToast=showToast;
</script>
</body>
</html>
