<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل المنتج - Mostafa Clean Shop</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap');

    * {
    font-family: 'Cairo', sans-serif;
  }

  body {
    background: #f8fafc;
  }

.scrollbar-hide::-webkit-scrollbar {
    display: none;
  }

.scrollbar-hide {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }

.skeleton {
    background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
    background-size: 200% 100%;
    animation: loading 1.5s infinite;
  }

  @keyframes loading {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

.fade-in {
    animation: fadeIn 0.4s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

.thumbnail {
    transition: all 0.2s ease;
    cursor: pointer;
  }

.thumbnail.active {
    border: 2px solid #10b981;
    transform: scale(1.05);
  }

.thumbnail:hover {
    border-color: #10b981;
  }

.modal-backdrop {
    backdrop-filter: blur(8px);
  }

.product-card {
    transition: all 0.2s ease;
  }

.product-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
  }

.btn-primary {
    transition: all 0.2s ease;
  }

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
  }

.btn-primary:active {
    transform: translateY(0);
  }
</style>
</head>
<body class="pb-24">

  <!-- Top Action Bar -->
  <div class="bg-white border-b border-gray-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3">
      <div class="flex items-center justify-between">
        <button onclick="window.history.back()" class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-gray-100 transition">
          <i class="fa-solid fa-arrow-right text-xl text-gray-700"></i>
        </button>
        <div class="flex items-center gap-2">
          <button id="shareBtn" class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-gray-100 transition">
            <i class="fa-solid fa-share-nodes text-xl text-gray-700"></i>
          </button>
          <button id="favoriteBtn" class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-gray-100 transition">
            <i class="fa-regular fa-heart text-xl text-gray-700"></i>
          </button>
          <button id="cartBtn" class="w-10 h-10 flex items-center justify-center rounded-lg hover:bg-gray-100 transition relative">
            <i class="fa-solid fa-cart-shopping text-xl text-gray-700"></i>
            <span id="cartBadge" class="hidden absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white text-xs rounded-full flex items-center justify-center">0</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Loading Skeleton -->
  <div id="loadingSkeleton" class="max-w-7xl mx-auto px-4 py-6">
    <div class="grid md:grid-cols-2 gap-6 lg:gap-8">
      <div>
        <div class="skeleton w-full aspect-square rounded-xl mb-4"></div>
        <div class="flex gap-2">
          <div class="skeleton w-20 h-20 rounded-lg"></div>
          <div class="skeleton w-20 h-20 rounded-lg"></div>
          <div class="skeleton w-20 h-20 rounded-lg"></div>
          <div class="skeleton w-20 h-20 rounded-lg"></div>
        </div>
      <div class="space-y-4">
        <div class="skeleton h-8 w-3/4 rounded"></div>
        <div class="skeleton h-6 w-1/2 rounded"></div>
        <div class="skeleton h-12 w-1/3 rounded"></div>
        <div class="skeleton h-32 w-full rounded"></div>
        <div class="skeleton h-12 w-full rounded"></div>
        <div class="skeleton h-12 w-full rounded"></div>
      </div>
    </div>
  </div>

  <!-- Product Not Found -->
  <div id="notFound" class="hidden text-center py-20 px-4 fade-in">
    <div class="w-24 h-24 mx-auto mb-4 bg-gray-100 rounded-full flex items-center justify-center">
      <i class="fa-solid fa-box-open text-4xl text-gray-400"></i>
    </div>
    <h2 class="text-2xl font-bold text-gray-900 mb-2">المنتج غير موجود</h2>
    <p class="text-gray-600 mb-6">عذراً، لم نتمكن من العثور على هذا المنتج</p>
    <button onclick="window.location.href='Menu.html'" class="bg-emerald-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-emerald-700 transition btn-primary">
      العودة للرئيسية
    </button>
  </div>

  <!-- Main Content -->
  <main id="productContent" class="hidden max-w-7xl mx-auto px-4 py-6">
    <div class="grid md:grid-cols-2 gap-6 lg:gap-8">

      <!-- Image Gallery -->
      <div class="fade-in">
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 mb-4">
          <div id="mainImageContainer" class="relative aspect-square bg-gray-100 rounded-lg overflow-hidden mb-4 cursor-pointer group">
            <img id="mainImage" src="" alt="" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105" loading="lazy">
            <div class="absolute inset-0 bg-black/0 group-hover:bg-black/5 transition flex items-center justify-center">
              <i class="fa-solid fa-magnifying-glass-plus text-white text-2xl opacity-0 group-hover:opacity-100 transition"></i>
            </div>
          </div>
          <div id="thumbnailsContainer" class="hidden flex gap-2 overflow-x-auto scrollbar-hide"></div>
        </div>
      </div>

      <!-- Product Info -->
      <div class="fade-in space-y-5">
        <!-- Title & Category -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
          <div class="flex items-start justify-between mb-3">
            <span id="productCategory" class="px-3 py-1 bg-emerald-100 text-emerald-700 rounded-full text-xs font-semibold"></span>
            <div id="stockStatus" class="px-3 py-1 rounded-full text-xs font-semibold"></div>
          </div>
          <h1 id="productName" class="text-2xl md:text-3xl font-bold text-gray-900 mb-3"></h1>

          <!-- Rating -->
          <div id="ratingSection" class="flex items-center gap-3 mb-4">
            <div class="flex items-center gap-1">
              <div id="starsContainer" class="flex gap-0.5"></div>
            </div>
            <span id="ratingText" class="text-sm text-gray-600"></span>
          </div>

          <!-- Price -->
          <div class="flex items-baseline gap-2 mb-4">
            <span id="productPrice" class="text-3xl md:text-4xl font-bold text-emerald-600"></span>
            <span class="text-lg text-gray-500">درهم</span>
          </div>

          <!-- Quick Info Grid -->
          <div class="grid grid-cols-2 gap-3">
            <div class="bg-gray-50 rounded-lg p-3">
              <p class="text-xs text-gray-500 mb-1">المخزون</p>
              <p id="productStock" class="font-bold text-gray-900"></p>
            </div>
            <div id="boxQuantityBox" class="hidden bg-gray-50 rounded-lg p-3">
              <p class="text-xs text-gray-500 mb-1">الكرتونة</p>
              <p id="productBoxQuantity" class="font-bold text-gray-900"></p>
            </div>
            <div id="sizeBox" class="hidden bg-gray-50 rounded-lg p-3">
              <p class="text-xs text-gray-500 mb-1">الحجم/السعة</p>
              <p id="productSize" class="font-bold text-gray-900"></p>
            </div>
            <div id="skuBox" class="hidden bg-gray-50 rounded-lg p-3">
              <p class="text-xs text-gray-500 mb-1">كود المنتج</p>
              <p id="productSku" class="font-bold text-gray-900 text-sm"></p>
            </div>
          </div>

          <!-- Stats -->
          <div class="flex items-center gap-4 mt-4 pt-4 border-t border-gray-100 text-sm text-gray-600">
            <div class="flex items-center gap-1.5">
              <i class="fa-solid fa-eye text-gray-400"></i>
              <span id="productViews">0</span>
            </div>
            <div class="flex items-center gap-1.5">
              <i class="fa-solid fa-shopping-bag text-gray-400"></i>
              <span id="productSales">0</span>
            </div>
            <div id="dateAddedBox" class="hidden flex items-center gap-1.5">
              <i class="fa-solid fa-calendar text-gray-400"></i>
              <span id="productDate"></span>
            </div>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 space-y-3">
          <button id="addToCartBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-xl font-bold text-lg transition shadow-md hover:shadow-lg flex items-center justify-center gap-2 btn-primary">
            <i class="fa-solid fa-cart-plus"></i>
            <span>إضافة إلى السلة</span>
          </button>
          <button id="whatsappBtn" class="w-full bg-green-500 hover:bg-green-600 text-white py-4 rounded-xl font-bold transition shadow-md flex items-center justify-center gap-2 btn-primary">
            <i class="fa-brands fa-whatsapp text-xl"></i>
            <span>اطلب عبر WhatsApp</span>
          </button>
          <div class="grid grid-cols-2 gap-3">
            <button id="shareProductBtn" class="bg-gray-100 hover:bg-gray-200 text-gray-700 py-3 rounded-xl font-semibold transition flex items-center justify-center gap-2">
              <i class="fa-solid fa-share-nodes"></i>
              <span>مشاركة</span>
            </button>
            <button id="favoriteProductBtn" class="bg-gray-100 hover:bg-gray-200 text-gray-700 py-3 rounded-xl font-semibold transition flex items-center justify-center gap-2">
              <i class="fa-regular fa-heart"></i>
              <span>المفضلة</span>
            </button>
          </div>
        </div>

        <!-- Description -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5">
          <h2 class="text-xl font-bold text-gray-900 mb-4 flex items-center gap-2">
            <i class="fa-solid fa-align-right text-emerald-600"></i>
            وصف المنتج
          </h2>
          <div id="productDescription" class="text-gray-700 leading-relaxed prose prose-sm max-w-none"></div>
        </div>

        <!-- Features -->
        <div id="featuresSection" class="hidden bg-white rounded-xl shadow-sm border border-gray-100 p-5">
          <h2 class="text-xl font-bold text-gray-900 mb-4 flex items-center gap-2">
            <i class="fa-solid fa-star text-emerald-600"></i>
            المميزات
          </h2>
          <div id="featuresContainer" class="grid grid-cols-2 gap-3"></div>
        </div>

        <!-- Rating Details -->
        <div id="ratingDetailsSection" class="hidden bg-white rounded-xl shadow-sm border border-gray-100 p-5">
          <h2 class="text-xl font-bold text-gray-900 mb-4 flex items-center gap-2">
            <i class="fa-solid fa-chart-simple text-emerald-600"></i>
            تفاصيل التقييم
          </h2>
          <div id="ratingBarsContainer" class="space-y-2"></div>
        </div>

        <!-- Reviews -->
        <div id="reviewsSection" class="hidden bg-white rounded-xl shadow-sm border border-gray-100 p-5">
          <h2 class="text-xl font-bold text-gray-900 mb-4 flex items-center gap-2">
            <i class="fa-solid fa-comments text-emerald-600"></i>
            تقييمات العملاء
          </h2>
          <div id="reviewsContainer" class="space-y-4"></div>
        </div>
      </div>
    </div>

    <!-- Similar Products -->
    <div id="similarSection" class="hidden mt-8">
      <h2 class="text-2xl font-bold text-gray-900 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-layer-group text-emerald-600"></i>
        منتجات مشابهة
      </h2>
      <div id="similarProductsContainer" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-4"></div>
    </div>
  </main>

  <!-- Image Modal -->
  <div id="imageModal" class="hidden fixed inset-0 z-50 bg-black/95 flex items-center justify-center p-4">
    <div class="modal-backdrop absolute inset-0" onclick="closeImageModal()"></div>
    <button onclick="closeImageModal()" class="absolute top-4 right-4 w-12 h-12 bg-white/10 hover:bg-white/20 rounded-full flex items-center justify-center text-white text-2xl z-10 transition">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <img id="modalImage" src="" alt="" class="max-w-full max-h-full object-contain">
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed top-20 left-1/2 -translate-x-1/2 z-50 animate-fade-in">
    <div class="bg-gray-900 text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-3">
      <i id="toastIcon" class="fa-solid fa-check-circle text-emerald-400"></i>
      <span id="toastMessage"></span>
    </div>
  </div>

<script>
  // Global State
  let currentProduct = null;
  let allProducts = [];
  let currentImageIndex = 0;
  let allImages = [];
  let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');

  // Initialize
  function init() {
    loadProduct();
    setupEventListeners();
  }

  // Load Product from localStorage
  function loadProduct() {
    const productId = localStorage.getItem('selectedProduct');
    const storedProducts = localStorage.getItem('products');

    if (!productId ||!storedProducts) {
      showNotFound();
      return;
    }

    allProducts = JSON.parse(storedProducts);
    currentProduct = allProducts.find(p => p.id == productId);

    if (!currentProduct) {
      showNotFound();
      return;
    }

    // Increment views
    currentProduct.views = (currentProduct.views || 0) + 1;
    saveProductUpdate();

    renderProduct();
    hideLoading();
  }

  // Save Product Update
  function saveProductUpdate() {
    const index = allProducts.findIndex(p => p.id === currentProduct.id);
    if (index!== -1) {
      allProducts[index] = currentProduct;
      localStorage.setItem('products', JSON.stringify(allProducts));
    }
  }

  // Render Product
  function renderProduct() {
    document.getElementById('productContent').classList.remove('hidden');
    document.title = `${currentProduct.name || 'منتج'} - Mostafa Clean Shop`;

    // Images
    allImages = currentProduct.images || [];
    if (allImages.length === 0 && currentProduct.image) {
      allImages = [currentProduct.image];
    }
    if (allImages.length === 0) {
      allImages = ['https://images.unsplash.com/photo-1542838132-92c53300491e?w=800&h=800&fit=crop'];
    }
    renderImages();

    // Basic Info
    document.getElementById('productName').textContent = currentProduct.name || 'منتج بدون اسم';
    document.getElementById('productCategory').textContent = currentProduct.category || 'غير محدد';
    document.getElementById('productPrice').textContent = (currentProduct.price || 0).toFixed(2);
    document.getElementById('productStock').textContent = (currentProduct.stock || 0) + ' وحدة';

    // Stock Status
    const stock = currentProduct.stock || 0;
    const threshold = currentProduct.lowStockThreshold || 10;
    const stockStatus = document.getElementById('stockStatus');
    if (stock > threshold) {
      stockStatus.textContent = 'متوفر';
      stockStatus.className = 'px-3 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-700';
    } else if (stock > 0) {
      stockStatus.textContent = 'منخفض';
      stockStatus.className = 'px-3 py-1 rounded-full text-xs font-semibold bg-amber-100 text-amber-700';
    } else {
      stockStatus.textContent = 'نفذ المخزون';
      stockStatus.className = 'px-3 py-1 rounded-full text-xs font-semibold bg-red-100 text-red-700';
    }

    // Optional Fields
    if (currentProduct.boxQuantity) {
      document.getElementById('boxQuantityBox').classList.remove('hidden');
      document.getElementById('productBoxQuantity').textContent = currentProduct.boxQuantity + ' قطعة';
    }
    if (currentProduct.size) {
      document.getElementById('sizeBox').classList.remove('hidden');
      document.getElementById('productSize').textContent = currentProduct.size;
    }
    if (currentProduct.sku) {
      document.getElementById('skuBox').classList.remove('hidden');
      document.getElementById('productSku').textContent = currentProduct.sku;
    }

    // Stats
    document.getElementById('productViews').textContent = currentProduct.views || 0;
    document.getElementById('productSales').textContent = currentProduct.sales || 0;
    if (currentProduct.createdAt) {
      document.getElementById('dateAddedBox').classList.remove('hidden');
      document.getElementById('productDate').textContent = new Date(currentProduct.createdAt).toLocaleDateString('ar-MA');
    }

    // Rating
    renderRating();

    // Description
    const desc = currentProduct.description || '<p class="text-gray-500">لا يوجد وصف متاح لهذا المنتج</p>';
    document.getElementById('productDescription').innerHTML = desc;

    // Features
    renderFeatures();

    // Reviews
    renderReviews();

    // Similar Products
    renderSimilarProducts();

    // WhatsApp Button
    setupWhatsApp();

    // Update favorite icon
    updateFavoriteIcon();
  }

  // Render Images
  function renderImages() {
    const mainImg = document.getElementById('mainImage');
    const thumbnailsContainer = document.getElementById('thumbnailsContainer');

    mainImg.src = allImages[currentImageIndex];
    mainImg.alt = currentProduct.name || 'منتج';
    mainImg.onclick = () => openImageModal(allImages[currentImageIndex]);

    // Touch swipe for mobile
    let touchStartX = 0;
    let touchEndX = 0;
    mainImg.ontouchstart = (e) => touchStartX = e.changedTouches[0].screenX;
    mainImg.ontouchend = (e) => {
      touchEndX = e.changedTouches[0].screenX;
      if (touchEndX < touchStartX - 50) nextImage();
      if (touchEndX > touchStartX + 50) prevImage();
    };

    if (allImages.length > 1) {
      thumbnailsContainer.classList.remove('hidden');
      thumbnailsContainer.innerHTML = allImages.map((img, idx) => `
        <img
          src="${img}"
          alt=""
          class="thumbnail w-20 h-20 object-cover rounded-lg cursor-pointer border-2 ${idx === currentImageIndex? 'active border-emerald-500' : 'border-gray-200'}"
          onclick="changeImage(${idx})"
          loading="lazy"
        >
      `).join('');
    } else {
      thumbnailsContainer.classList.add('hidden');
    }
  }

  // Change Image
  window.changeImage = function(index) {
    currentImageIndex = index;
    renderImages();
  }

  // Next/Prev Image
  function nextImage() {
    currentImageIndex = (currentImageIndex + 1) % allImages.length;
    renderImages();
  }

  function prevImage() {
    currentImageIndex = (currentImageIndex - 1 + allImages.length) % allImages.length;
    renderImages();
  }

  // Open Image Modal
  function openImageModal(src) {
    document.getElementById('modalImage').src = src;
    document.getElementById('imageModal').classList.remove('hidden');
  }

  // Close Image Modal
  window.closeImageModal = function() {
    document.getElementById('imageModal').classList.add('hidden');
  }

  // Render Rating
  function renderRating() {
    const rating = currentProduct.rating || 0;
    const reviews = currentProduct.reviews || [];

    if (rating === 0 && reviews.length === 0) {
      document.getElementById('ratingSection').style.display = 'none';
      return;
    }

    const starsContainer = document.getElementById('starsContainer');
    const fullStars = Math.floor(rating);
    const hasHalfStar = rating % 1 >= 0.5;

    starsContainer.innerHTML = '';
    for (let i = 0; i < 5; i++) {
      if (i < fullStars) {
        starsContainer.innerHTML += '<i class="fa-solid fa-star text-yellow-400"></i>';
      } else if (i === fullStars && hasHalfStar) {
        starsContainer.innerHTML += '<i class="fa-solid fa-star-half-stroke text-yellow-400"></i>';
      } else {
        starsContainer.innerHTML += '<i class="fa-regular fa-star text-gray-300"></i>';
      }
    }

    document.getElementById('ratingText').textContent = `${rating.toFixed(1)} (${reviews.length} تقييم)`;

    // Rating Details
    if (reviews.length > 0) {
      document.getElementById('ratingDetailsSection').classList.remove('hidden');
      const ratingCounts = { 5: 0, 4: 0, 3: 0, 2: 0, 1: 0 };
      reviews.forEach(r => ratingCounts[r.rating] = (ratingCounts[r.rating] || 0) + 1);

      document.getElementById('ratingBarsContainer').innerHTML = [5, 4, 3, 2, 1].map(star => {
        const count = ratingCounts[star] || 0;
        const percentage = reviews.length > 0? (count / reviews.length) * 100 : 0;
        return `
          <div class="flex items-center gap-3">
            <span class="text-sm text-gray-600 w-12">${star} نجوم</span>
            <div class="flex-1 bg-gray-200 rounded-full h-2 overflow-hidden">
              <div class="bg-yellow-400 h-full transition-all duration-500" style="width: ${percentage}%"></div>
            </div>
            <span class="text-sm text-gray-600 w-8 text-left">${count}</span>
          </div>
        `;
      }).join('');
    }
  }

  // Render Features
  function renderFeatures() {
    const defaultFeatures = ['جودة عالية', 'أصلي 100%', 'آمن للاستعمال', 'تنظيف قوي', 'رائحة منعشة', 'اقتصادي', 'سريع المفعول'];
    const features = currentProduct.features && currentProduct.features.length > 0? currentProduct.features : defaultFeatures;

    if (features.length > 0) {
      document.getElementById('featuresSection').classList.remove('hidden');
      document.getElementById('featuresContainer').innerHTML = features.map(f => `
        <div class="flex items-center gap-2 bg-emerald-50 rounded-lg p-3">
          <i class="fa-solid fa-check-circle text-emerald-600"></i>
          <span class="text-sm font-medium text-gray-700">${f}</span>
        </div>
      `).join('');
    }
  }

  // Render Reviews
  function renderReviews() {
    const reviews = currentProduct.reviews || [];
    if (reviews.length === 0) return;

    document.getElementById('reviewsSection').classList.remove('hidden');
    document.getElementById('reviewsContainer').innerHTML = reviews.map(r => `
      <div class="border-b border-gray-100 pb-4 last:border-0 last:pb-0">
        <div class="flex items-start gap-3">
          <img src="${r.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(r.name)}&background=10b981&color=fff`}"
               alt="${r.name}"
               class="w-10 h-10 rounded-full object-cover">
          <div class="flex-1">
            <div class="flex items-center justify-between mb-1">
              <h4 class="font-semibold text-gray-900">${r.name}</h4>
              <span class="text-xs text-gray-500">${new Date(r.date).toLocaleDateString('ar-MA')}</span>
            </div>
            <div class="flex items-center gap-1 mb-2">
              ${Array(5).fill(0).map((_, i) => `
                <i class="fa-solid fa-star text-xs ${i < r.rating? 'text-yellow-400' : 'text-gray-300'}"></i>
              `).join('')}
            </div>
            <p class="text-gray-700 text-sm mb-2">${r.comment}</p>
            <button class="text-xs text-gray-500 hover:text-emerald-600 transition flex items-center gap-1">
              <i class="fa-regular fa-thumbs-up"></i>
              <span>مفيد</span>
            </button>
          </div>
        </div>
      </div>
    `).join('');
  }

  // Render Similar Products
  function renderSimilarProducts() {
    const similar = allProducts.filter(p =>
      p.category === currentProduct.category &&
      p.id!== currentProduct.id &&
      (p.hidden === false || p.hidden === undefined)
    ).slice(0, 8);

    if (similar.length > 0) {
      document.getElementById('similarSection').classList.remove('hidden');
      document.getElementById('similarProductsContainer').innerHTML = similar.map(p => `
        <div class="product-card bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden cursor-pointer" onclick="viewProduct(${p.id})">
          <div class="aspect-square bg-gray-100 overflow-hidden">
            <img src="${p.image || 'https://images.unsplash.com/photo-1542838132-92c53300491e?w=400&h=400&fit=crop'}"
                 alt="${p.name}"
                 class="w-full h-full object-cover"
                 loading="lazy">
          </div>
          <div class="p-3">
            <h3 class="font-semibold text-gray-900 text-sm mb-1 line-clamp-2 h-10">${p.name}</h3>
            <p class="text-lg font-bold text-emerald-600">${(p.price || 0).toFixed(2)} درهم</p>
          </div>
        </div>
      `).join('');
    }
  }

  // View Product
  window.viewProduct = function(id) {
    localStorage.setItem('selectedProduct', id);
    window.location.reload();
  }

  // Setup WhatsApp
  function setupWhatsApp() {
    document.getElementById('whatsappBtn').onclick = () => {
      const message = `مرحبا، أريد طلب المنتج:\n\n*${currentProduct.name}*\nالسعر: ${currentProduct.price} درهم\n\nرابط المنتج: ${window.location.href}`;
      const phone = '212600000000'; // غير الرقم هنا
      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
    };
  }

  // Share Product
  function shareProduct() {
    if (navigator.share) {
      navigator.share({
        title: currentProduct.name,
        text: `شاهد ${currentProduct.name} على Mostafa Clean Shop`,
        url: window.location.href
      });
    } else {
      navigator.clipboard.writeText(window.location.href);
      showToast('تم نسخ الرابط');
    }
  }

  // Toggle Favorite
  function toggleFavorite() {
    const index = favorites.indexOf(currentProduct.id);

    if (index > -1) {
      favorites.splice(index, 1);
      showToast('تم الإزالة من المفضلة');
    } else {
      favorites.push(currentProduct.id);
      showToast('تمت الإضافة إلى المفضلة');
    }

    localStorage.setItem('favorites', JSON.stringify(favorites));
    updateFavoriteIcon();
  }

  // Update Favorite Icon
  function updateFavoriteIcon() {
    const isFav = favorites.includes(currentProduct.id);
    const icons = document.querySelectorAll('#favoriteBtn i, #favoriteProductBtn i');
    icons.forEach(icon => {
      icon.className = isFav? 'fa-solid fa-heart text-red-500' : 'fa-regular fa-heart';
    });
  }

  // Add to Cart
  function addToCart() {
    let cart = JSON.parse(localStorage.getItem('cart') || '[]');
    const existing = cart.find(item => item.id === currentProduct.id);

    if (existing) {
      existing.quantity = (existing.quantity || 1) + 1;
    } else {
      cart.push({...currentProduct, quantity: 1 });
    }

    localStorage.setItem('cart', JSON.stringify(cart));
    updateCartBadge();
    showToast('تمت الإضافة إلى السلة');
  }

  // Update Cart Badge
  function updateCartBadge() {
    const cart = JSON.parse(localStorage.getItem('cart') || '[]');
    const count = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
    const badge = document.getElementById('cartBadge');
    if (count > 0) {
      badge.textContent = count;
      badge.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
    }
  }

  // Show Not Found
  function showNotFound() {
    document.getElementById('loadingSkeleton').classList.add('hidden');
    document.getElementById('notFound').classList.remove('hidden');
  }

  // Hide Loading
  function hideLoading() {
    document.getElementById('loadingSkeleton').classList.add('hidden');
  }

  // Show Toast
  function showToast(message) {
    const toast = document.getElementById('toast');
    document.getElementById('toastMessage').textContent = message;
    toast.classList.remove('hidden');
    setTimeout(() => toast.classList.add('hidden'), 2000);
  }

  // Setup Event Listeners
  function setupEventListeners() {
    document.getElementById('shareBtn').onclick = shareProduct;
    document.getElementById('shareProductBtn').onclick = shareProduct;
    document.getElementById('favoriteBtn').onclick = toggleFavorite;
    document.getElementById('favoriteProductBtn').onclick = toggleFavorite;
    document.getElementById('addToCartBtn').onclick = addToCart;
    document.getElementById('cartBtn').onclick = () => window.location.href = 'cart.html';

    // Update favorite icon on load
    setTimeout(updateFavoriteIcon, 100);
    updateCartBadge();
  }

  // Initialize
  document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
