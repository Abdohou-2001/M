<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M-Store | متجرك الذكي</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6366f1">
<style>
:root {
  --bg:#f5f7fa; --card:#fff; --text:#333; --muted:#777; --primary:#667eea;
}
[data-theme="dark"] {
  --bg:#1a1a2e; --card:#16213e; --text:#eee; --muted:#aaa; --primary:#8b5cf6;
}
* {margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, sans-serif}
body {background:var(--bg); color:var(--text); transition:0.3s; min-height:100vh}
.header {
  background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color:white; padding:20px; text-align:center; position:sticky; top:0; z-index:100;
  display:flex; align-items:center; justify-content:space-between;
}
.header h1 {font-size:28px; cursor:pointer; user-select:none}
.theme-btn {
  background:rgba(255,255,255,0.2); border:none; color:white; width:45px; height:45px;
  border-radius:50%; font-size:22px; cursor:pointer;
}
.admin-bar {
  background:#2c3e50; color:white; padding:10px; text-align:center; display:none; font-size:13px;
}
.admin-mode.admin-bar {display:block}
.toolbar {
  max-width:1200px; margin:20px auto; padding:0 20px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;
}
.search-box {flex:1; min-width:200px; position:relative}
.search-box input {
  width:100%; padding:14px 45px 14px 15px; border:2px solid #ddd; border-radius:12px; font-size:15px;
  background:var(--card); color:var(--text);
}
.search-icon {position:absolute; right:15px; top:50%; transform:translateY(-50%); font-size:18px}
.stats {display:flex; gap:15px; align-items:center; font-size:14px; color:var(--muted)}
.sort-btn,.filter-btn {
  padding:10px 16px; border:2px solid var(--primary); background:var(--card); color:var(--primary);
  border-radius:10px; cursor:pointer; font-weight:bold;
}
.categories {
  max-width:1200px; margin:0 auto 20px; padding:0 20px; display:flex; gap:10px; overflow-x:auto;
}
.cat-btn {
  padding:8px 18px; border:2px solid #ddd; background:var(--card); color:var(--text);
  border-radius:20px; cursor:pointer; white-space:nowrap; font-size:14px;
}
.cat-btn.active {background:var(--primary); color:white; border-color:var(--primary)}
.container {max-width:1200px; margin:0 auto 100px; padding:0 20px}
.grid {
  display:grid; grid-template-columns:repeat(auto-fill, minmax(270px, 1fr)); gap:20px;
}
.card {
  background:var(--card); border-radius:18px; overflow:hidden; box-shadow:0 4px 15px rgba(0,0,0,0.08);
  transition:0.3s; position:relative; cursor:pointer;
}
.card:hover {transform:translateY(-6px)}
.card img {width:100%; height:200px; object-fit:cover; background:#f0f0f0}
.card-body {padding:18px}
.card-body h3 {font-size:18px; margin-bottom:6px}
.price {color:var(--primary); font-size:22px; font-weight:bold; margin:8px 0}
.desc {color:var(--muted); font-size:13px; line-height:1.5; height:38px; overflow:hidden}
.views {font-size:11px; color:#999; margin-top:5px}
.card-actions {
  display:flex; justify-content:space-between; margin-top:12px;
}
.fav-btn,.share-btn {
  background:none; border:none; font-size:22px; cursor:pointer; padding:5px;
}
.fav-btn.active {color:#e74c3c}
.delete-btn {
  position:absolute; top:10px; left:10px; background:#e74c3c; color:white; border:none;
  width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:18px; display:none; z-index:10;
}
.admin-mode.delete-btn {display:block}
.new-badge {
  position:absolute; top:10px; right:10px; background:#27ae60; color:white;
  padding:4px 10px; border-radius:12px; font-size:11px; font-weight:bold;
}
.fab {
  position:fixed; bottom:30px; left:30px; width:60px; height:60px;
  background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color:white; border:none; border-radius:50%; font-size:32px; cursor:pointer;
  box-shadow:0 8px 25px rgba(102,126,234,0.4); display:none; z-index:999;
}
.admin-mode.fab {display:flex; align-items:center; justify-content:center}
.modal {
  display:none; position:fixed; top:0; left:0; right:0; bottom:0;
  background:rgba(0,0,0,0.6); z-index:1000; align-items:center; justify-content:center; padding:20px;
}
.modal.show {display:flex}
.modal-box {
  background:var(--card); padding:25px; border-radius:20px; width:100%; max-width:500px;
  max-height:90vh; overflow-y:auto;
}
.modal-box h2 {margin-bottom:18px}
.modal-box input,.modal-box textarea,.modal-box select {
  width:100%; padding:12px; margin-bottom:12px; border:2px solid #ddd; border-radius:10px;
  font-size:15px; background:var(--bg); color:var(--text);
}
.modal-box button {
  width:100%; padding:14px; background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color:white; border:none; border-radius:10px; font-size:16px; font-weight:bold; cursor:pointer; margin-top:8px;
}
.close-btn {background:#95a5a6!important}
.empty {
  text-align:center; padding:60px 20px; color:var(--muted); grid-column:1/-1;
}
.empty-icon {font-size:70px; margin-bottom:15px}
.login-prompt {
  text-align:center; color:var(--muted); font-size:12px; margin:10px 0;
}
</style>
</head>
<body>
<div class="admin-bar">🔐 وضع المسؤول مفعّل</div>

<div class="header">
  <button class="theme-btn" onclick="toggleTheme()">🌙</button>
  <h1 id="logo">🛒 M-Store</h1>
  <button class="theme-btn" onclick="showFavorites()">❤️</button>
</div>

<div class="toolbar">
  <div class="search-box">
    <input type="text" id="search" placeholder="ابحث عن منتج...">
    <span class="search-icon">🔍</span>
  </div>
  <div class="stats">
    <span id="count">0 منتج</span>
    <button class="sort-btn" onclick="toggleSort()">أ-ي</button>
  </div>
</div>

<div class="categories">
  <button class="cat-btn active" onclick="filterCat('all', this)">الكل</button>
  <button class="cat-btn" onclick="filterCat('ملابس', this)">ملابس</button>
  <button class="cat-btn" onclick="filterCat('إلكترونيات', this)">إلكترونيات</button>
  <button class="cat-btn" onclick="filterCat('منزلية', this)">منزلية</button>
  <button class="cat-btn" onclick="filterCat('أخرى', this)">أخرى</button>
</div>

<div class="container">
  <div class="grid" id="grid"></div>
</div>

<button class="fab" onclick="openAddModal()">+</button>

<div class="login-prompt" id="loginPrompt">💡 اضغطي مطول على شعار M-Store للدخول كمسؤول</div>

<!-- مودال الدخول -->
<div class="modal" id="loginModal">
  <div class="modal-box">
    <h2>دخول المسؤول</h2>
    <input type="password" id="adminPass" placeholder="كلمة السر">
    <button onclick="checkAdmin()">دخول</button>
    <button class="close-btn" onclick="closeModal('loginModal')">إلغاء</button>
  </div>
</div>

<!-- مودال الإضافة -->
<div class="modal" id="addModal">
  <div class="modal-box">
    <h2>إضافة منتج جديد</h2>
    <input type="text" id="pName" placeholder="اسم المنتج">
    <input type="number" id="pPrice" placeholder="السعر بالدرهم">
    <select id="pCat">
      <option value="ملابس">ملابس</option>
      <option value="إلكترونيات">إلكترونيات</option>
      <option value="منزلية">منزلية</option>
      <option value="أخرى">أخرى</option>
    </select>
    <textarea id="pDesc" placeholder="الوصف" rows="3"></textarea>
    <input type="file" id="pImgs" accept="image/*" multiple>
    <small style="color:var(--muted)">اختاري 1 إلى 5 صور</small>
    <input type="text" id="pWhatsApp" placeholder="رقم واتساب للطلب 2126xxxxxxxx">
    <button onclick="addProduct()">حفظ</button>
    <button class="close-btn" onclick="closeModal('addModal')">إلغاء</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getStorage, ref as sRef, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyAH2EdIAIgAJdSGqItQ5ZxHxekYki9ZrOY",
  authDomain: "m-store-4d10f.firebaseapp.com",
  databaseURL: "https://m-store-4d10f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "m-store-4d10f",
  storageBucket: "m-store-4d10f.firebasestorage.app",
  messagingSenderId: "903736276607",
  appId: "1:903736276607:web:f514d9136c286c7814f14a",
  measurementId: "G-M6TFY56Y4L"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const storage = getStorage(app);
const CORRECT_PASS = "1234@1234";

let allProducts = [];
let sortAZ = true;
let currentCat = 'all';
let showFavOnly = false;

// دارك مود
function toggleTheme() {
  const t = document.body.getAttribute('data-theme') === 'dark'? 'light' : 'dark';
  document.body.setAttribute('data-theme', t);
  localStorage.setItem('theme', t);
  document.querySelector('.theme-btn').textContent = t === 'dark'? '☀️' : '🌙';
}
if(localStorage.getItem('theme') === 'dark') {
  document.body.setAttribute('data-theme', 'dark');
  document.querySelector('.theme-btn').textContent = '☀️';
}

// دخول المسؤول بالضغط المطول
let pressTimer;
document.getElementById('logo').addEventListener('mousedown', () => {
  pressTimer = setTimeout(() => document.getElementById('loginModal').classList.add('show'), 1200);
});
document.getElementById('logo').addEventListener('mouseup', () => clearTimeout(pressTimer));
window.checkAdmin = () => {
  if(document.getElementById('adminPass').value === CORRECT_PASS) {
    localStorage.setItem('mstore_admin', 'true');
    document.body.classList.add('admin-mode');
    document.getElementById('loginPrompt').style.display = 'none';
    closeModal('loginModal');
    alert('مرحبا بك أيها المسؤول ✅');
  } else alert('كلمة السر خاطئة ❌');
}
if(localStorage.getItem('mstore_admin') === 'true') {
  document.body.classList.add('admin-mode');
  document.getElementById('loginPrompt').style.display = 'none';
}
window.closeModal = (id) => document.getElementById(id).classList.remove('show');

// قراءة المنتجات
const grid = document.getElementById('grid');
onValue(ref(db, 'products'), (snap) => {
  allProducts = [];
  snap.forEach(child => allProducts.push({id: child.key,...child.val()}));
  render();
});

// البحث
document.getElementById('search').addEventListener('input', render);

// الترتيب
window.toggleSort = () => {
  sortAZ =!sortAZ;
  document.querySelector('.sort-btn').textContent = sortAZ? 'أ-ي' : 'ي-أ';
  render();
}

// التصنيف
window.filterCat = (cat, btn) => {
  currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

// المفضلة
function getFavs() {return JSON.parse(localStorage.getItem('favs') || '[]')}
function toggleFav(id) {
  let favs = getFavs();
  favs = favs.includes(id)? favs.filter(f => f!== id) : [...favs, id];
  localStorage.setItem('favs', JSON.stringify(favs));
  render();
}
window.showFavorites = () => {
  showFavOnly =!showFavOnly;
  render();
}

// العرض
function render() {
  let products = [...allProducts];

  // البحث
  const search = document.getElementById('search').value.toLowerCase();
  if(search) products = products.filter(p => p.name.toLowerCase().includes(search) || p.desc.toLowerCase().includes(search));

  // التصنيف
  if(currentCat!== 'all') products = products.filter(p => p.category === currentCat);

  // المفضلة
  if(showFavOnly) products = products.filter(p => getFavs().includes(p.id));

  // الترتيب
  products.sort((a,b) => sortAZ? a.name.localeCompare(b.name, 'ar') : b.name.localeCompare(a.name, 'ar'));

  document.getElementById('count').textContent = products.length + ' منتج';

  if(products.length === 0) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">📦</div><h3>لا توجد منتجات</h3></div>`;
    return;
  }

  grid.innerHTML = '';
  const threeNewest = allProducts.sort((a,b) => b.createdAt - a.createdAt).slice(0,3).map(p => p.id);

  products.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <button class="delete-btn" onclick="event.stopPropagation(); deleteProd('${p.id}', '${p.imgPaths || ''}')">×</button>
      ${threeNewest.includes(p.id)? '<span class="new-badge">جديد</span>' : ''}
      <img src="${p.images[0]}" alt="${p.name}">
      <div class="card-body">
        <h3>${p.name}</h3>
        <div class="price">${p.price} درهم</div>
        <p class="desc">${p.desc}</p>
        <div class="views">👁️ ${p.views || 0} مشاهدة</div>
        <div class="card-actions">
          <button class="fav-btn ${getFavs().includes(p.id)? 'active' : ''}" onclick="event.stopPropagation(); toggleFav('${p.id}')">❤️</button>
          <button class="share-btn" onclick="event.stopPropagation(); shareProd('${p.name}', '${p.id}')">📤</button>
        </div>
      </div>
    `;
    card.onclick = () => viewProduct(p.id);
    grid.appendChild(card);
  });
}

// إضافة منتج
window.openAddModal = () => document.getElementById('addModal').classList.add('show');

window.addProduct = async () => {
  const name = document.getElementById('pName').value;
  const price = document.getElementById('pPrice').value;
  const category = document.getElementById('pCat').value;
  const desc = document.getElementById('pDesc').value;
  const files = document.getElementById('pImgs').files;
  const whatsapp = document.getElementById('pWhatsApp').value;

  if(!name ||!price || files.length === 0) return alert('عمري الخانات + صورة');

  const imgPaths = [];
  const images = [];

  for(let i=0; i<Math.min(files.length, 5); i++) {
    const path = 'products/' + Date.now() + '_' + i + '_' + files[i].name;
    const imgRef = sRef(storage, path);
    await uploadBytes(imgRef, files[i]);
    const url = await getDownloadURL(imgRef);
    imgPaths.push(path);
    images.push(url);
  }

  await push(ref(db, 'products'), {
    name, price, category, desc, images, imgPaths, whatsapp, views: 0, createdAt: Date.now()
  });

  closeModal('addModal');
  alert('تمت الإضافة ✅');
}

// حذف
window.deleteProd = async (id, imgPaths) => {
  if(!confirm('مسح المنتج؟')) return;
  await remove(ref(db, 'products/' + id));
  if(imgPaths) imgPaths.split(',').forEach(p => deleteObject(sRef(storage, p)));
}

// عرض المنتج
function viewProduct(id) {
  update(ref(db, 'products/' + id), {views: (allProducts.find(p => p.id === id).views || 0) + 1});
  localStorage.setItem('currentProduct', id);
  window.location.href = 'product.html';
}

// مشاركة
window.shareProd = (name, id) => {
  const url = window.location.href + '?p=' + id;
  if(navigator.share) navigator.share({title: name, url});
  else {
    navigator.clipboard.writeText(url);
    alert('تم نسخ الرابط ✅');
  }
}

// Service Worker
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
