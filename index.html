<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المنتجات - إدارة المخزون</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap');

    * {
    font-family: 'Cairo', sans-serif;
  }

  body {
    background: #f8fafc;
  }

 .scrollbar-hide::-webkit-scrollbar {
    display: none;
  }

 .scrollbar-hide {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }

 .modal-backdrop {
    backdrop-filter: blur(4px);
  }

 .animate-slide-up {
    animation: slideUp 0.3s ease-out;
  }

  @keyframes slideUp {
    from {
      transform: translateY(20px);
      opacity: 0;
    }
    to {
      transform: translateY(0);
      opacity: 1;
    }
  }

 .animate-fade-in {
    animation: fadeIn 0.2s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

 .product-card:hover {
    transform: translateY(-2px);
    transition: all 0.2s ease;
  }

  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
</style>
</head>
<body class="pb-24">

  <main class="max-w-7xl mx-auto px-4 pt-6 pb-6">
    <!-- Stats Cards -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4 mb-6">
      <div class="bg-white rounded-xl shadow-sm p-4 md:p-5 border border-gray-100">
        <div class="flex items-start justify-between">
          <div>
            <p class="text-gray-500 text-xs md:text-sm mb-1">قيمة المخزون</p>
            <p class="text-xl md:text-2xl font-bold text-gray-900" id="totalValue">2,450</p>
            <p class="text-xs text-gray-500 mt-1">درهم</p>
          </div>
          <div class="w-10 h-10 md:w-12 md:h-12 bg-emerald-100 rounded-lg flex items-center justify-center">
            <i class="fa-solid fa-coins text-emerald-600 text-lg md:text-xl"></i>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow-sm p-4 md:p-5 border border-gray-100">
        <div class="flex items-start justify-between">
          <div>
            <p class="text-gray-500 text-xs md:text-sm mb-1">إجمالي المخزون</p>
            <p class="text-xl md:text-2xl font-bold text-gray-900" id="totalStock">156</p>
            <p class="text-xs text-gray-500 mt-1">وحدة</p>
          </div>
          <div class="w-10 h-10 md:w-12 md:h-12 bg-blue-100 rounded-lg flex items-center justify-center">
            <i class="fa-solid fa-boxes-stacked text-blue-600 text-lg md:text-xl"></i>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow-sm p-4 md:p-5 border border-gray-100">
        <div class="flex items-start justify-between">
          <div>
            <p class="text-gray-500 text-xs md:text-sm mb-1">منتجات منخفضة</p>
            <p class="text-xl md:text-2xl font-bold text-amber-600" id="lowStockCount">12</p>
            <p class="text-xs text-gray-500 mt-1">منتج</p>
          </div>
          <div class="w-10 h-10 md:w-12 md:h-12 bg-amber-100 rounded-lg flex items-center justify-center">
            <i class="fa-solid fa-triangle-exclamation text-amber-600 text-lg md:text-xl"></i>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-xl shadow-sm p-4 md:p-5 border border-gray-100">
        <div class="flex items-start justify-between">
          <div>
            <p class="text-gray-500 text-xs md:text-sm mb-1">إجمالي المنتجات</p>
            <p class="text-xl md:text-2xl font-bold text-gray-900" id="totalProducts">28</p>
            <p class="text-xs text-gray-500 mt-1">منتج</p>
          </div>
          <div class="w-10 h-10 md:w-12 md:h-12 bg-violet-100 rounded-lg flex items-center justify-center">
            <i class="fa-solid fa-cube text-violet-600 text-lg md:text-xl"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- Search and Filter Bar -->
    <div class="bg-white rounded-xl shadow-sm p-4 mb-4 border border-gray-100">
      <div class="flex gap-2">
        <div class="flex-1 relative">
          <input
            type="text"
            id="searchInput"
            placeholder="البحث عن منتج..."
            class="w-full pr-10 pl-4 py-2.5 rounded-lg border border-gray-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 outline-none transition text-sm md:text-base"
          >
          <i class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
        </div>
        <button id="filterBtn" class="px-4 py-2.5 bg-gray-100 hover:bg-gray-200 rounded-lg transition flex items-center gap-2 text-gray-700">
          <i class="fa-solid fa-sliders"></i>
          <span class="hidden sm:inline text-sm font-medium">تصفية</span>
        </button>
      </div>
    </div>

    <!-- Category Pills -->
    <div class="mb-6 overflow-x-auto scrollbar-hide">
      <div class="flex gap-2 pb-2">
        <button class="category-pill active px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition bg-emerald-600 text-white shadow-md" data-category="الكل">
          الكل
        </button>
        <button class="category-pill px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition bg-white text-gray-700 border border-gray-200 hover:border-emerald-500" data-category="كوش">
          كوش
        </button>
        <button class="category-pill px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition bg-white text-gray-700 border border-gray-200 hover:border-emerald-500" data-category="سوائل">
          سوائل
        </button>
        <button class="category-pill px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition bg-white text-gray-700 border border-gray-200 hover:border-emerald-500" data-category="منظفات">
          منظفات
        </button>
        <button class="category-pill px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition bg-white text-gray-700 border border-gray-200 hover:border-emerald-500" data-category="مواد غذائية">
          مواد غذائية
        </button>
        <button class="category-pill px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition bg-white text-gray-700 border border-gray-200 hover:border-emerald-500" data-category="أخرى">
          أخرى
        </button>
      </div>
    </div>

    <!-- Products List -->
    <div id="productsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- Products will be rendered here -->
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-16">
      <div class="w-24 h-24 mx-auto mb-4 bg-gray-100 rounded-full flex items-center justify-center">
        <i class="fa-solid fa-box-open text-4xl text-gray-400"></i>
      </div>
      <h3 class="text-xl font-semibold text-gray-900 mb-2">لا توجد منتجات</h3>
      <p class="text-gray-500 mb-6">ابدأ بإضافة منتجك الأول</p>
      <button onclick="openAddModal()" class="bg-emerald-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-emerald-700 transition">
        <i class="fa-solid fa-plus ml-2"></i>
        إضافة منتج
      </button>
    </div>
  </main>

  <!-- Floating Add Button -->
  <button id="fabBtn" class="fixed bottom-24 left-4 md:left-6 w-14 h-14 bg-emerald-600 hover:bg-emerald-700 text-white rounded-full shadow-lg hover:shadow-xl transition-all flex items-center justify-center z-30">
    <i class="fa-solid fa-plus text-xl"></i>
  </button>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg z-40">
    <div class="max-w-7xl mx-auto">
      <div class="grid grid-cols-5 h-16">
        <button onclick="navigateToHome()" class="flex flex-col items-center justify-center gap-1 text-gray-500 hover:text-emerald-600 transition">
          <i class="fa-solid fa-house text-xl"></i>
          <span class="text-xs font-medium">الرئيسية</span>
        </button>
        <button onclick="navigateToCustomers()" class="flex flex-col items-center justify-center gap-1 text-gray-500 hover:text-emerald-600 transition">
          <i class="fa-solid fa-users text-xl"></i>
          <span class="text-xs font-medium">العملاء</span>
        </button>
        <button class="flex flex-col items-center justify-center gap-1 text-emerald-600 relative">
          <div class="absolute -top-1 w-12 h-1 bg-emerald-600 rounded-full"></div>
          <i class="fa-solid fa-box text-xl"></i>
          <span class="text-xs font-semibold">المنتجات</span>
        </button>
        <button onclick="navigateToSales()" class="flex flex-col items-center justify-center gap-1 text-gray-500 hover:text-emerald-600 transition">
          <i class="fa-solid fa-cart-shopping text-xl"></i>
          <span class="text-xs font-medium">المبيعات</span>
        </button>
        <button onclick="navigateToReports()" class="flex flex-col items-center justify-center gap-1 text-gray-500 hover:text-emerald-600 transition">
          <i class="fa-solid fa-chart-simple text-xl"></i>
          <span class="text-xs font-medium">التقارير</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Add/Edit Product Modal -->
  <div id="productModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="modal-backdrop absolute inset-0 bg-black/50" onclick="closeProductModal()"></div>
    <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto animate-slide-up">
      <div class="sticky top-0 bg-white border-b border-gray-100 px-6 py-4 flex items-center justify-between z-10">
        <h2 id="modalTitle" class="text-xl font-bold text-gray-900">إضافة منتج جديد</h2>
        <button onclick="closeProductModal()" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-100 transition">
          <i class="fa-solid fa-xmark text-gray-500"></i>
        </button>
      </div>
      <form id="productForm" class="p-6 space-y-4">
        <input type="hidden" id="productId">

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">اسم المنتج *</label>
          <input type="text" id="productName" required class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 outline-none transition" placeholder="مثال: زيت عافية 1 لتر">
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">الفئة *</label>
          <select id="productCategory" required class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 outline-none transition">
            <option value="">اختر الفئة</option>
            <option value="كوش">كوش</option>
            <option value="مناديل">مناديل</option>
            <option value="منظفات">منظفات</option>
            <option value="مواد غذائية">مواد غذائية</option>
            <option value="أخرى">أخرى</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">السعر (درهم) *</label>
            <input type="number" id="productPrice" required min="0" step="0.01" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 outline-none transition" placeholder="0.00">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">الكمية *</label>
            <input type="number" id="productStock" required min="0" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 outline-none transition" placeholder="0">
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">حد التنبيه للكمية المنخفضة</label>
          <input type="number" id="lowStockThreshold" min="0" value="10" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 outline-none transition" placeholder="10">
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">رابط الصورة (اختياري)</label>
          <input type="url" id="productImage" class="w-full px-4 py-2.5 rounded-lg border border-gray-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 outline-none transition" placeholder="https://example.com/image.jpg">
        </div>

        <div class="flex gap-3 pt-4">
          <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-lg font-semibold transition shadow-md">
            <i class="fa-solid fa-check ml-2"></i>
            حفظ
          </button>
          <button type="button" onclick="closeProductModal()" class="px-6 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg font-semibold transition">
            إلغاء
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div id="deleteModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="modal-backdrop absolute inset-0 bg-black/50" onclick="closeDeleteModal()"></div>
    <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-md animate-slide-up">
      <div class="p-6">
        <div class="w-16 h-16 mx-auto mb-4 bg-red-100 rounded-full flex items-center justify-center">
          <i class="fa-solid fa-trash text-2xl text-red-600"></i>
        </div>
        <h3 class="text-xl font-bold text-gray-900 text-center mb-2">حذف المنتج</h3>
        <p class="text-gray-600 text-center mb-6">هل أنت متأكد من حذف هذا المنتج؟ لا يمكن التراجع عن هذا الإجراء.</p>
        <div class="flex gap-3">
          <button id="confirmDeleteBtn" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-3 rounded-lg font-semibold transition">
            نعم، احذف
          </button>
          <button onclick="closeDeleteModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-3 rounded-lg font-semibold transition">
            إلغاء
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Filter Modal -->
  <div id="filterModal" class="hidden fixed inset-0 z-50 flex items-end md:items-center justify-center md:p-4">
    <div class="modal-backdrop absolute inset-0 bg-black/50" onclick="closeFilterModal()"></div>
    <div class="relative bg-white rounded-t-2xl md:rounded-2xl shadow-2xl w-full md:max-w-md animate-slide-up">
      <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
        <h2 class="text-xl font-bold text-gray-900">تصفية المنتجات</h2>
        <button onclick="closeFilterModal()" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-100 transition">
          <i class="fa-solid fa-xmark text-gray-500"></i>
        </button>
      </div>
      <div class="p-6 space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">الحالة</label>
          <div class="space-y-2">
            <label class="flex items-center gap-3 p-3 rounded-lg border border-gray-200 hover:bg-gray-50 cursor-pointer">
              <input type="radio" name="statusFilter" value="all" checked class="w-4 h-4 text-emerald-600">
              <span>الكل</span>
            </label>
            <label class="flex items-center gap-3 p-3 rounded-lg border border-gray-200 hover:bg-gray-50 cursor-pointer">
              <input type="radio" name="statusFilter" value="available" class="w-4 h-4 text-emerald-600">
              <span>متوفر</span>
            </label>
            <label class="flex items-center gap-3 p-3 rounded-lg border border-gray-200 hover:bg-gray-50 cursor-pointer">
              <input type="radio" name="statusFilter" value="low" class="w-4 h-4 text-emerald-600">
              <span>منخفض</span>
            </label>
          </div>
        </div>
        <div class="flex gap-3 pt-4">
          <button onclick="applyFilters()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-lg font-semibold transition">
            تطبيق
          </button>
          <button onclick="resetFilters()" class="px-6 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg font-semibold transition">
            إعادة تعيين
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="hidden fixed top-20 left-1/2 -translate-x-1/2 z-50 animate-fade-in">
    <div class="bg-gray-900 text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-3">
      <i id="toastIcon" class="fa-solid fa-check-circle text-emerald-400"></i>
      <span id="toastMessage"></span>
    </div>
  </div>

<script>
  // Initial Demo Data
  const initialProducts = [
    {
      id: 1,
      name: 'dalaa bakal 5 ',
      category: 'كوش',
      price: 18.50,
      stock: 45,
      lowStockThreshold: 10,
      image: 'https://i.ibb.co/v6w4SC63/Screenshot-2026-06-29-13-11-50
