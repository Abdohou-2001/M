<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karni Pro - تسجيل الدخول</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap');
    * { font-family: 'Cairo', sans-serif; }
  body { background: #f8fafc; }
  .soft-shadow-lg { box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
  .animate-slide-up { animation: slideUp 0.3s ease-out; }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md">
  <!-- بطاقة Karni Pro الأصلية - لم يتغير فيها شيء -->
  <div class="bg-white rounded-2xl soft-shadow-lg p-8 animate-slide-up">
    
    <!-- أيقونة وعنوان Karni Pro - نفس الأصل -->
    <div class="text-center mb-8">
      <div class="w-20 h-20 bg-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
        <i class="fa-solid fa-box text-white text-3xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-gray-900">Karni Pro</h1>
      <p class="text-sm text-gray-500 mt-1" id="pageSubtitle">تسجيل الدخول إلى حسابك</p>
    </div>

    <!-- تبويب التبديل - بنفس أسلوب التصميم -->
    <div class="bg-gray-100 rounded-xl p-1 flex mb-6">
      <button id="loginTab" onclick="switchMode('login')" class="flex-1 bg-white text-gray-900 py-2.5 rounded-lg font-bold text-sm shadow-sm transition">تسجيل الدخول</button>
      <button id="signupTab" onclick="switchMode('signup')" class="flex-1 text-gray-500 py-2.5 rounded-lg font-bold text-sm transition">إنشاء حساب</button>
    </div>

    <!-- تبويب طريقة الدخول: بريد / هاتف -->
    <div class="flex gap-2 mb-6">
      <button id="emailMethodBtn" onclick="switchMethod('email')" class="flex-1 bg-emerald-50 border-2 border-emerald-200 text-emerald-700 py-2.5 rounded-xl font-semibold text-sm flex items-center justify-center gap-2">
        <i class="fa-solid fa-envelope"></i> البريد
      </button>
      <button id="phoneMethodBtn" onclick="switchMethod('phone')" class="flex-1 bg-white border-2 border-gray-200 text-gray-600 py-2.5 rounded-xl font-semibold text-sm flex items-center justify-center gap-2">
        <i class="fa-solid fa-mobile"></i> الهاتف
      </button>
    </div>

    <!-- نموذج البريد الإلكتروني -->
    <div id="emailForm">
      <div class="mb-4">
        <label class="text-sm font-semibold text-gray-700 mb-2 block">البريد الإلكتروني</label>
        <input id="emailInput" type="email" class="w-full p-3.5 border-2 border-gray-200 rounded-xl focus:border-emerald-500 outline-none transition" placeholder="example@mail.com">
      </div>
      <div class="mb-4">
        <label class="text-sm font-semibold text-gray-700 mb-2 block">كلمة المرور</label>
        <input id="passwordInput" type="password" class="w-full p-3.5 border-2 border-gray-200 rounded-xl focus:border-emerald-500 outline-none transition" placeholder="••••••••">
      </div>
      <div id="confirmPasswordGroup" class="mb-6 hidden">
        <label class="text-sm font-semibold text-gray-700 mb-2 block">تأكيد كلمة المرور</label>
        <input id="confirmPasswordInput" type="password" class="w-full p-3.5 border-2 border-gray-200 rounded-xl focus:border-emerald-500 outline-none transition" placeholder="••••••••">
      </div>
      <button id="emailActionBtn" onclick="handleEmailAuth()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-xl font-bold text-lg shadow-lg transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-right-to-bracket"></i>
        <span id="emailActionText">تسجيل الدخول</span>
      </button>
    </div>

    <!-- نموذج الهاتف -->
    <div id="phoneForm" class="hidden">
      <div class="mb-4">
        <label class="text-sm font-semibold text-gray-700 mb-2 block">رقم الهاتف</label>
        <input id="phoneInput" type="tel" dir="ltr" class="w-full p-3.5 border-2 border-gray-200 rounded-xl focus:border-emerald-500 outline-none transition text-left" placeholder="+212 6XX XX XX XX">
        <p class="text-xs text-gray-500 mt-1">مثال: +212612345678</p>
      </div>
      
      <!-- Recaptcha -->
      <div id="recaptcha-container" class="mb-4 flex justify-center"></div>

      <button id="sendOtpBtn" onclick="sendOtp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-xl font-bold text-lg shadow-lg transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-paper-plane"></i> إرسال رمز التحقق
      </button>

      <!-- حقل OTP -->
      <div id="otpGroup" class="hidden mt-6">
        <label class="text-sm font-semibold text-gray-700 mb-2 block">رمز التحقق</label>
        <input id="otpInput" type="text" maxlength="6" class="w-full p-3.5 border-2 border-emerald-300 rounded-xl focus:border-emerald-500 outline-none transition text-center text-xl tracking-[0.5em] font-bold" placeholder="------">
        <button onclick="verifyOtp()" class="w-full mt-4 bg-gray-900 hover:bg-black text-white py-4 rounded-xl font-bold text-lg shadow-lg transition">
          تأكيد وإنشاء الحساب
        </button>
      </div>
    </div>

    <!-- رسالة خطأ -->
    <div id="errorBox" class="hidden mt-6 bg-red-50 border-2 border-red-200 text-red-700 p-3 rounded-xl text-sm font-semibold text-center"></div>
    
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signInWithPhoneNumber, RecaptchaVerifier, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCLIzcO9i8QQ-YzYY5fIap6QNDsJDqgf60",
  authDomain: "karnipromaroc.firebaseapp.com",
  projectId: "karnipromaroc",
  storageBucket: "karnipromaroc.firebasestorage.app",
  messagingSenderId: "6746147726",
  appId: "1:6746147726:web:b2c311df9ff3c778f432df",
  measurementId: "G-MBGWSDYHGY"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let currentMode = 'login'; // login | signup
let currentMethod = 'email'; // email | phone
let confirmationResult = null;
let recaptchaVerifier = null;

// إذا مسجل دخول مسبقا -> index.html
onAuthStateChanged(auth, (user) => {
  if (user) {
    window.location.href = 'index.html';
  }
});

function initRecaptcha() {
  if (!recaptchaVerifier) {
    recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
      'size': 'normal',
      'callback': () => {},
      'expired-callback': () => {
        showError('انتهت صلاحية الرمز');
      }
    });
  }
}
initRecaptcha();

window.switchMode = function(mode) {
  currentMode = mode;
  document.getElementById('loginTab').className = mode==='login' ? 'flex-1 bg-white text-gray-900 py-2.5 rounded-lg font-bold text-sm shadow-sm transition' : 'flex-1 text-gray-500 py-2.5 rounded-lg font-bold text-sm transition';
  document.getElementById('signupTab').className = mode==='signup' ? 'flex-1 bg-white text-gray-900 py-2.5 rounded-lg font-bold text-sm shadow-sm transition' : 'flex-1 text-gray-500 py-2.5 rounded-lg font-bold text-sm transition';
  
  if (mode === 'login') {
    document.getElementById('pageSubtitle').textContent = 'تسجيل الدخول إلى حسابك';
    document.getElementById('emailActionText').textContent = 'تسجيل الدخول';
    document.getElementById('confirmPasswordGroup').classList.add('hidden');
  } else {
    document.getElementById('pageSubtitle').textContent = 'إنشاء حساب جديد';
    document.getElementById('emailActionText').textContent = 'إنشاء حساب';
    document.getElementById('confirmPasswordGroup').classList.remove('hidden');
  }
  hideError();
}

window.switchMethod = function(method) {
  currentMethod = method;
  document.getElementById('emailMethodBtn').className = method==='email' ? 'flex-1 bg-emerald-50 border-2 border-emerald-200 text-emerald-700 py-2.5 rounded-xl font-semibold text-sm flex items-center justify-center gap-2' : 'flex-1 bg-white border-2 border-gray-200 text-gray-600 py-2.5 rounded-xl font-semibold text-sm flex items-center justify-center gap-2';
  document.getElementById('phoneMethodBtn').className = method==='phone' ? 'flex-1 bg-emerald-50 border-2 border-emerald-200 text-emerald-700 py-2.5 rounded-xl font-semibold text-sm flex items-center justify-center gap-2' : 'flex-1 bg-white border-2 border-gray-200 text-gray-600 py-2.5 rounded-xl font-semibold text-sm flex items-center justify-center gap-2';
  
  document.getElementById('emailForm').classList.toggle('hidden', method!=='email');
  document.getElementById('phoneForm').classList.toggle('hidden', method!=='phone');
  hideError();
}

window.handleEmailAuth = async function() {
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  const confirmPassword = document.getElementById('confirmPasswordInput').value;

  if (!email || !password) { showError('الرجاء إدخال البريد وكلمة المرور'); return; }
  
  if (currentMode === 'signup' && password !== confirmPassword) {
    showError('كلمة المرور وتأكيدها غير متطابقين'); return;
  }

  try {
    setLoading(true);
    if (currentMode === 'signup') {
      await createUserWithEmailAndPassword(auth, email, password);
    } else {
      await signInWithEmailAndPassword(auth, email, password);
    }
  } catch (e) {
    handleFirebaseError(e);
  } finally { setLoading(false); }
}

window.sendOtp = async function() {
  const phoneNumber = document.getElementById('phoneInput').value.trim();
  if (!phoneNumber.startsWith('+')) { showError('رقم الهاتف يجب أن يبدأ بـ + ورمز البلد مثلا +212'); return; }

  try {
    setLoading(true, 'sendOtpBtn');
    confirmationResult = await signInWithPhoneNumber(auth, phoneNumber, recaptchaVerifier);
    document.getElementById('otpGroup').classList.remove('hidden');
    document.getElementById('sendOtpBtn').textContent = 'تم إرسال الرمز - أعد الإرسال؟';
    showSuccessTemp('تم إرسال رمز التحقق');
  } catch (e) {
    handleFirebaseError(e);
    try { recaptchaVerifier.render().then(w=>{grecaptcha.reset(w)}); } catch{}
  } finally { setLoading(false, 'sendOtpBtn'); }
}

window.verifyOtp = async function() {
  const code = document.getElementById('otpInput').value.trim();
  if (code.length !== 6) { showError('رمز التحقق غير صحيح'); return; }
  try {
    setLoading(true);
    await confirmationResult.confirm(code);
  } catch (e) { handleFirebaseError(e); }
  finally { setLoading(false); }
}

function handleFirebaseError(error) {
  console.log(error);
  let msg = 'حدث خطأ غير متوقع';
  if (!navigator.onLine) msg = 'لا يوجد اتصال بالإنترنت';
  else if (error.code) {
    switch(error.code) {
      case 'auth/invalid-email': msg = 'البريد الإلكتروني غير صحيح'; break;
      case 'auth/weak-password': msg = 'كلمة المرور ضعيفة'; break;
      case 'auth/email-already-in-use': msg = 'البريد الإلكتروني مستخدم مسبقاً'; break;
      case 'auth/phone-number-already-exists': msg = 'رقم الهاتف مستخدم'; break;
      case 'auth/invalid-verification-code': msg = 'رمز التحقق غير صحيح'; break;
      case 'auth/code-expired': msg = 'انتهت صلاحية الرمز'; break;
      case 'auth/wrong-password': case 'auth/invalid-credential': msg = 'كلمة المرور غير صحيحة'; break;
      case 'auth/user-not-found': msg = 'المستخدم غير موجود'; break;
      case 'auth/too-many-requests': msg = 'محاولات كثيرة، حاول لاحقاً'; break;
      case 'auth/invalid-phone-number': msg = 'رقم الهاتف غير صحيح'; break;
    }
  }
  showError(msg);
}

function showError(msg) {
  const box = document.getElementById('errorBox');
  box.textContent = msg;
  box.classList.remove('hidden');
  box.className = 'mt-6 bg-red-50 border-2 border-red-200 text-red-700 p-3 rounded-xl text-sm font-semibold text-center';
}
function hideError() { document.getElementById('errorBox').classList.add('hidden'); }
function showSuccessTemp(msg) {
  const box = document.getElementById('errorBox');
  box.textContent = msg;
  box.classList.remove('hidden');
  box.className = 'mt-6 bg-emerald-50 border-2 border-emerald-200 text-emerald-700 p-3 rounded-xl text-sm font-semibold text-center';
  setTimeout(hideError, 3000);
}
function setLoading(isLoading, btnId='emailActionBtn') {
  const btn = document.getElementById(btnId);
  if (isLoading) { btn.disabled = true; btn.style.opacity = '0.6'; }
  else { btn.disabled = false; btn.style.opacity = '1'; }
}

// تسجيل الخروج العام - استدعيه من أي صفحة
window.logoutKarni = async function() {
  await signOut(auth);
  window.location.href = 'login.html';
}
</script>
</body>
</html>
