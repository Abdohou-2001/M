<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسح الباركود - WEST</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
    * { font-family: 'Cairo', sans-serif; }
  
  body {
    background: linear-gradient(135deg, #f0fdf4 0%, #ffffff 100%);
    min-height: 100vh;
  }

  #reader {
    width: 100% !important;
    border: none !important;
  }

  #reader video {
    border-radius: 1rem !important;
  }

  .scan-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 70%;
    max-width: 300px;
    height: 200px;
    border: 3px solid #10b981;
    border-radius: 1rem;
    box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
    pointer-events: none;
    z-index: 10;
  }

  .scan-line {
    position: absolute;
    width: 100%;
    height: 3px;
    background: linear-gradient(90deg, transparent, #10b981, transparent);
    animation: scan 2s linear infinite;
  }

  @keyframes scan {
    0% { top: 0; }
    100% { top: 100%; }
  }

  .corner {
    position: absolute;
    width: 30px;
    height: 30px;
    border: 4px solid #10b981;
  }
  .corner-tl { top: -3px; left: -3px; border-right: 0; border-bottom: 0; border-radius: 1rem 0 0 0; }
  .corner-tr { top: -3px; right: -3px; border-left: 0; border-bottom: 0; border-radius: 0 1rem 0 0; }
  .corner-bl { bottom: -3px; left: -3px; border-right: 0; border-top: 0; border-radius: 0 0 0 1rem; }
  .corner-br { bottom: -3px; right: -3px; border-left: 0; border-top: 0; border-radius: 0 0 1rem 0; }

  .pulse {
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .success-animation {
    animation: successPop 0.5s ease-out;
  }

  @keyframes successPop {
    0% { transform: scale(0.5); opacity: 0; }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body class="pb-6">

  <!-- Header -->
  <header class="bg-white shadow-sm sticky top-0 z-40 border-b-2 border-emerald-500">
    <div class="max-w-2xl mx-auto px-4 py-4">
      <div class="flex items-center justify-between">
        <button onclick="history.back()" class="w-10 h-10 flex items-center justify-center rounded-xl bg-emerald-50 hover:bg-emerald-100 transition">
          <i class="fa-solid fa-arrow-right text-emerald-600"></i>
        </button>
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 bg-emerald-600 rounded-xl flex items-center justify-center shadow-lg">
            <i class="fa-solid fa-barcode text-white text-xl"></i>
          </div>
          <div>
            <h1 class="text-xl font-bold text-gray-900">مسح الباركود</h1>
            <p class="text-xs text-gray-500">WEST Store</p>
          </div>
        <button id="flashBtn" onclick="toggleFlash()" class="w-10 h-10 flex items-center justify-center rounded-xl bg-gray-100 hover:bg-gray-200 transition hidden">
          <i class="fa-solid fa-bolt text-gray-600"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 pt-6">
    
    <!-- Instructions -->
    <div id="instructions" class="bg-emerald-50 border-2 border-emerald-200 rounded-2xl p-4 mb-6">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 bg-emerald-600 rounded-xl flex items-center justify-center pulse">
          <i class="fa-solid fa-qrcode text-white text-xl"></i>
        </div>
        <div class="flex-1">
          <h3 class="font-bold text-emerald-900 mb-1">وجه الكاميرا نحو الباركود</h3>
          <p class="text-sm text-emerald-700">يدعم EAN-13 و Code128</p>
        </div>
      </div>
    </div>

    <!-- Scanner Container -->
    <div class="bg-white rounded-3xl shadow-xl overflow-hidden mb-6 border-2 border-emerald-100">
      <div id="reader-container" class="relative">
        <div id="reader"></div>
        <div class="scan-overlay">
          <div class="corner corner-tl"></div>
          <div class="corner corner-tr"></div>
          <div class="corner corner-bl"></div>
          <div class="corner corner-br"></div>
          <div class="scan-line"></div>
        </div>
      </div>
    </div>

    <!-- Status -->
    <div id="status" class="text-center mb-4">
      <div class="inline-flex items-center gap-2 bg-white px-6 py-3 rounded-full shadow-md border border-gray-200">
        <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
        <span class="text-sm font-semibold text-gray-700">جاري تشغيل الكاميرا...</span>
      </div>
    </div>

    <!-- Last Scan Result -->
    <div id="result" class="hidden">
      <div class="bg-white rounded-2xl shadow-lg p-6 border-2 border-gray-100">
        <div class="flex items-center gap-3 mb-4">
          <div id="resultIcon" class="w-14 h-14 rounded-xl flex items-center justify-center">
            <i class="fa-solid fa-check text-2xl"></i>
          </div>
          <div class="flex-1">
            <h3 id="resultTitle" class="font-bold text-lg text-gray-900"></h3>
            <p id="resultBarcode" class="text-sm text-gray-500 font-mono"></p>
          </div>
        </div>
        <div id="productCard"></div>
      </div>
    </div>

  </main>

  <!-- Audio -->
  <audio id="beepSound" src="beep.mp3" preload="auto"></audio>
  <audio id="errorSound" src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuBzvLZiTYIG2m98OScTgwOUarm7blmGgU7k9n1unEiBC13yO/eizEIHWq+8+OWT" preload="auto"></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD5KnoOye-Ns7RNQq9KqGNSmakYydIoLAw",
  authDomain: "my-store-4f430.firebaseapp.com",
  databaseURL: "https://my-store-4f430-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "my-store-4f430",
  storageBucket: "my-store-4f430.firebasestorage.app",
  messagingSenderId: "674007434765",
  appId: "1:674007434765:web:c4005d096ab86167cc3744"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let html5QrCode;
let isScanning = false;
let lastScannedCode = null;
let lastScanTime = 0;
let isFlashOn = false;

// تشغيل الصوت
function playBeep() {
  const beep = document.getElementById('beepSound');
  beep.currentTime = 0;
  beep.play().catch(e => console.log('Audio play failed:', e));
}

function playError() {
  const error = document.getElementById('errorSound');
  error.currentTime = 0;
  error.play().catch(e => console.log('Audio play failed:', e));
}

// اهتزاز الهاتف
function vibrate() {
  if (navigator.vibrate) {
    navigator.vibrate(200);
  }
}

// منع التكرار لمدة ثانيتين
function canScan(code) {
  const now = Date.now();
  if (code === lastScannedCode && (now - lastScanTime) < 2000) {
    return false;
  }
  lastScannedCode = code;
  lastScanTime = now;
  return true;
}

// البحث عن المنتج
async function searchProduct(barcode) {
  try {
    const snapshot = await get(ref(db, 'products'));
    if (snapshot.exists()) {
      const products = snapshot.val();
      for (const [key, product] of Object.entries(products)) {
        if (product.barcode === barcode) {
          return { id: key, ...product };
        }
      }
    }
    return null;
  } catch (error) {
    console.error('Error searching product:', error);
    return null;
  }
}

// عرض النتيجة
function showResult(success, barcode, product = null) {
  const resultDiv = document.getElementById('result');
  const resultIcon = document.getElementById('resultIcon');
  const resultTitle = document.getElementById('resultTitle');
  const resultBarcode = document.getElementById('resultBarcode');
  const productCard = document.getElementById('productCard');

  resultDiv.classList.remove('hidden');
  resultDiv.classList.add('success-animation');

  if (success && product) {
    resultIcon.className = 'w-14 h-14 rounded-xl flex items-center justify-center bg-emerald-100';
    resultIcon.innerHTML = '<i class="fa-solid fa-check text-2xl text-emerald-600"></i>';
    resultTitle.textContent = product.name;
    resultTitle.className = 'font-bold text-lg text-emerald-900';
    resultBarcode.textContent = `باركود: ${barcode}`;
    
    productCard.innerHTML = `
      <div class="flex gap-4 mb-4">
        <img src="${product.image || 'https://via.placeholder.com/100'}" class="w-24 h-24 rounded-xl object-cover border-2 border-emerald-100">
        <div class="flex-1">
          <p class="text-sm text-gray-500 mb-1">${product.category || 'منتج'}</p>
          <p class="text-2xl font-bold text-emerald-600">${product.price} درهم</p>
          <p class="text-sm text-gray-400">السعر العمومي: ${product.publicPrice} درهم</p>
          <p class="text-xs text-gray-500 mt-1">العلبة: ${product.piecesPerBox || 1} قطعة</p>
        </div>
      </div>
      <button onclick="window.location.href='product.html?id=${product.id}'" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold transition shadow-lg">
        <i class="fa-solid fa-eye ml-2"></i>عرض تفاصيل المنتج
      </button>
    `;

    // الانتقال التلقائي بعد ثانيتين
    setTimeout(() => {
      window.location.href = `product.html?id=${product.id}`;
    }, 2000);

  } else {
    resultIcon.className = 'w-14 h-14 rounded-xl flex items-center justify-center bg-red-100';
    resultIcon.innerHTML = '<i class="fa-solid fa-xmark text-2xl text-red-600"></i>';
    resultTitle.textContent = 'هذا المنتج غير موجود';
    resultTitle.className = 'font-bold text-lg text-red-900';
    resultBarcode.textContent = `باركود: ${barcode}`;
    productCard.innerHTML = `
      <div class="bg-red-50 rounded-xl p-4 text-center">
        <p class="text-red-700 font-semibold">لم يتم العثور على المنتج في قاعدة البيانات</p>
      </div>
    `;
  }

  setTimeout(() => {
    resultDiv.classList.add('hidden');
  }, 3000);
}

// نجاح القراءة
async function onScanSuccess(decodedText, decodedResult) {
  if (!canScan(decodedText)) return;

  if (html5QrCode && isScanning) {
      isScanning = false;
      await html5QrCode.stop();
  }

  console.log('Scanned:', decodedText);

  playBeep();
  vibrate();
  
  document.getElementById('instructions').classList.add('hidden');
  document.getElementById('status').innerHTML = `
    <div class="inline-flex items-center gap-2 bg-emerald-500 px-6 py-3 rounded-full shadow-lg">
      <i class="fa-solid fa-spinner fa-spin text-white"></i>
      <span class="text-sm font-semibold text-white">جاري البحث...</span>
    </div>
  `;

  const product = await searchProduct(decodedText);
  
  if (product) {
    showResult(true, decodedText, product);
  } else {
    playError();
    showResult(false, decodedText);
  }

  setTimeout(() => {
    document.getElementById('instructions').classList.remove('hidden');
    document.getElementById('status').innerHTML = `
      <div class="inline-flex items-center gap-2 bg-white px-6 py-3 rounded-full shadow-md border border-gray-200">
        <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
        <span class="text-sm font-semibold text-gray-700">في انتظار المسح...</span>
      </div>
    `;
  }, 3000);
}

// فشل القراءة
function onScanFailure(error) {
  // لا تفعل شيء - طبيعي
}

// تشغيل الفلاش
window.toggleFlash = async function() {
  if (!html5QrCode) return;
  
  try {
    isFlashOn = !isFlashOn;
    await html5QrCode.applyVideoConstraints({
      advanced: [{ torch: isFlashOn }]
    });
    
    const btn = document.getElementById('flashBtn');
    if (isFlashOn) {
      btn.innerHTML = '<i class="fa-solid fa-bolt text-amber-500"></i>';
      btn.classList.add('bg-amber-100');
    } else {
      btn.innerHTML = '<i class="fa-solid fa-bolt text-gray-600"></i>';
      btn.classList.remove('bg-amber-100');
    }
  } catch (err) {
    console.log('Flash not supported');
  }
}

// بدء المسح
async function startScanning() {
  html5QrCode = new Html5Qrcode("reader");
  
  const config = {
    fps: 10,
    qrbox: { width: 250, height: 150 },
    aspectRatio: 1.0,
    formatsToSupport: [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.CODE_128
    ]
  };

  try {
    await html5QrCode.start(
      { facingMode: "environment" },
      config,
      onScanSuccess,
      onScanFailure
    );
    
    isScanning = true;
    document.getElementById('status').innerHTML = `
      <div class="inline-flex items-center gap-2 bg-white px-6 py-3 rounded-full shadow-md border border-gray-200">
        <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
        <span class="text-sm font-semibold text-gray-700">في انتظار المسح...</span>
      </div>
    `;
    
    // إظهار زر الفلاش إذا كان مدعوم
    setTimeout(() => {
      document.getElementById('flashBtn').classList.remove('hidden');
    }, 1000);
    
  } catch (err) {
    console.error('Error starting camera:', err);
    document.getElementById('status').innerHTML = `
      <div class="inline-flex items-center gap-2 bg-red-500 px-6 py-3 rounded-full shadow-lg">
        <i class="fa-solid fa-circle-exclamation text-white"></i>
        <span class="text-sm font-semibold text-white">فشل تشغيل الكاميرا</span>
      </div>
    `;
  }
}

// بدء التطبيق
document.addEventListener('DOMContentLoaded', () => {
  startScanning();
});

// إيقاف الكاميرا عند الخروج
window.addEventListener('beforeunload', () => {
  if (html5QrCode && isScanning) {
    html5QrCode.stop();
  }
});
</script>

</body>
</html>
