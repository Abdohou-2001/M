<head><!-- PLAYABLE_TOUCH_PATCH_V1 --><script>
(function() {
  if (window.__playableTouchPatchInstalled) return;
  window.__playableTouchPatchInstalled = true;
  var origAdd = EventTarget.prototype.addEventListener;
  var blockedTypes = { touchstart: 1, touchmove: 1, wheel: 1 };
  EventTarget.prototype.addEventListener = function(type, listener, options) {
    if (blockedTypes[type]) {
      if (options === undefined || options === null) {
        options = { passive: true };
      } else if (typeof options === 'boolean') {
        options = { capture: options, passive: true };
      } else {
        options = Object.assign({}, options, { passive: true });
      }
    }
    return origAdd.call(this, type, listener, options);
  };
})();

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getDatabase, ref, get, set, remove } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCLIzcO9i8QQ-YzYY5fIap6QNDsJDqgf60",
  authDomain: "karnipromaroc.firebaseapp.com",
  databaseURL: "https://karnipromaroc-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "karnipromaroc",
  storageBucket: "karnipromaroc.firebasestorage.app",
  messagingSenderId: "6746147726",
  appId: "1:6746147726:web:6e3a2d29941ab93ef432df"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let allOrders = [];
let allProducts = [];
let groupedByClient = {};
let aggregatedTotal = {};
let currentViewingClient = null;
let currentBonItems = [];

async function loadData(){
  // Load products for adding
  try{
    const snapProd = await get(ref(db, "products"));
    if(snapProd.exists()){
      allProducts = Object.values(snapProd.val());
    }
  } catch(e){}

  // Load orders
  allOrders = [];
  try{
    const snap = await get(ref(db, "orders"));
    if(snap.exists()){
      const val = snap.val();
      Object.entries(val).forEach(([key, order])=>{
        allOrders.push({id:key, ...order});
      });
    }
    // Also load clientOrders
    const snap2 = await get(ref(db, "clientOrders"));
    if(snap2.exists()){
      const val = snap2.val();
      Object.values(val).forEach(clientOrders=>{
        Object.values(clientOrders).forEach(order=>{
          if(order.clientName && !allOrders.find(o=>o.id===order.id)){
            // avoid duplicate if already in orders
          }
        });
      });
    }
  } catch(e){ console.error(e); }

  // Also load from clientBons (edited bons)
  try{
    const snapBons = await get(ref(db, "clientBons"));
    if(snapBons.exists()){
      const val = snapBons.val();
      Object.entries(val).forEach(([clientName, bon])=>{
        // if client already has orders, merge or replace
        if(!groupedByClient[clientName]) groupedByClient[clientName]=[];
        // Add edited bon as order
        allOrders.push({id:`bon_${clientName}`, clientName, items:bon.items||[], isEditedBon:true});
      });
    }
  } catch(e){}

  processData();
}

function processData(){
  groupedByClient = {};
  aggregatedTotal = {};

  allOrders.forEach(order=>{
    const client = order.clientName || 'بدون اسم';
    if(!groupedByClient[client]) groupedByClient[client]=[];
    groupedByClient[client].push(order);

    (order.items||[]).forEach(item=>{
      const key = item.name || item.productId;
      if(!aggregatedTotal[key]){
        aggregatedTotal[key] = {name: item.name, qty:0, total:0, image: item.mainImage||item.image, price: item.price||0};
      }
      aggregatedTotal[key].qty += parseInt(item.qty)||0;
      aggregatedTotal[key].total += (parseFloat(item.price)||0) * (parseInt(item.qty)||0);
    });
  });

  renderPersons();
  renderTotal();
  updateStats();
}

function updateStats(){
  const persons = Object.keys(groupedByClient).length;
  let totalQty = 0, totalVal = 0;
  Object.values(aggregatedTotal).forEach(t=>{ totalQty+=t.qty; totalVal+=t.total; });
  document.getElementById('personsCount').textContent = persons;
  document.getElementById('totalQty').textContent = totalQty;
  document.getElementById('totalValue').textContent = totalVal.toFixed(2) + ' درهم';
}

function renderPersons(){
  const container = document.getElementById('personsContainer');
  const clients = Object.keys(groupedByClient);
  if(clients.length===0){
    container.innerHTML = `<div class="text-center py-12 bg-white rounded-2xl border"><i class="fa-solid fa-receipt text-3xl text-gray-300 mb-2"></i><p class="text-gray-500 text-sm">لا توجد بونات بعد</p></div>`;
    return;
  }
  container.innerHTML = clients.map(client=>{
    const orders = groupedByClient[client];
    let totalItems = 0, totalVal = 0, totalQty = 0;
    orders.forEach(o=>{
      (o.items||[]).forEach(i=>{ totalItems++; totalQty+=parseInt(i.qty)||0; totalVal+=(parseFloat(i.price)||0)*(parseInt(i.qty)||0); });
    });
    return `<div class="card bg-white rounded-2xl border p-4 cursor-pointer hover:border-emerald-200" onclick="openBon('${client}')">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 bg-emerald-100 rounded-full flex items-center justify-center"><span class="font-bold text-emerald-700">${client.charAt(0)}</span></div>
          <div>
            <h3 class="font-bold">${client}</h3>
            <p class="text-xs text-gray-500">${orders.length} بون • ${totalQty} منتج</p>
          </div>
        </div>
        <div class="text-left">
          <p class="font-bold text-emerald-600">${totalVal.toFixed(2)} درهم</p>
          <p class="text-xs text-gray-400"><i class="fa-solid fa-chevron-left"></i></p>
        </div>
      </div>
      <div class="mt-3 flex gap-2 overflow-x-auto">
        ${orders.slice(0,3).map(o=>(o.items||[]).slice(0,2).map(i=>`<span class="text-[11px] bg-gray-50 border px-2 py-1 rounded-full whitespace-nowrap">${i.name} ×${i.qty}</span>`).join('')).join('')}
      </div>
    </div>`;
  }).join('');
}

function renderTotal(){
  const container = document.getElementById('totalSummary');
  const totals = Object.values(aggregatedTotal).sort((a,b)=>b.qty-a.qty);
  if(totals.length===0){ container.innerHTML='<p class="text-sm text-gray-400 text-center py-4">لا يوجد مجموع</p>'; return; }
  container.innerHTML = totals.map(t=>`
    <div class="flex items-center justify-between bg-gray-50 rounded-xl p-3">
      <div class="flex items-center gap-3">
        <img src="${t.image||'https://via.placeholder.com/40'}" class="w-10 h-10 rounded-lg object-cover">
        <div>
          <p class="font-bold text-sm">${t.name}</p>
          <p class="text-xs text-gray-500">${t.qty} وحدة • ${t.total.toFixed(2)} درهم</p>
        </div>
      </div>
      <span class="bg-emerald-600 text-white text-sm font-bold px-3 py-1 rounded-full">${t.qty}</span>
    </div>
  `).join('');
}

window.openBon = function(clientName){
  currentViewingClient = clientName;
  const orders = groupedByClient[clientName]||[];
  // Merge all items of client
  let merged = {};
  orders.forEach(o=>{
    (o.items||[]).forEach(item=>{
      const key = item.productId || item.name;
      if(!merged[key]) merged[key] = {...item, qty:0};
      merged[key].qty += parseInt(item.qty)||0;
      merged[key].price = item.price; // last price
      if(!merged[key].mainImage) merged[key].mainImage = item.mainImage;
    });
  });
  currentBonItems = Object.values(merged);
  document.getElementById('bonClientName').textContent = `بون ${clientName}`;
  document.getElementById('bonDate').textContent = new Date().toLocaleDateString('ar-MA');
  renderBonItems();
  document.getElementById('bonModal').classList.add('active');
}

function renderBonItems(){
  const container = document.getElementById('bonItems');
  if(currentBonItems.length===0){ container.innerHTML='<p class="text-center text-gray-400 py-8">البون فارغ</p>'; document.getElementById('bonTotal').textContent='0 درهم'; return; }
  container.innerHTML = currentBonItems.map((item, idx)=>`
    <div class="bg-gray-50 rounded-xl p-3 flex gap-3">
      <img src="${item.mainImage||item.image||'https://via.placeholder.com/60'}" class="w-14 h-14 rounded-lg object-cover">
      <div class="flex-1">
        <p class="font-bold text-sm">${item.name}</p>
        <div class="flex items-center gap-2 mt-2">
          <div class="flex items-center gap-1">
            <button onclick="updateBonQty(${idx},-1)" class="w-7 h-7 bg-white border rounded-full flex items-center justify-center">-</button>
            <input type="number" value="${item.qty}" onchange="updateBonQtyInput(${idx},this.value)" class="w-12 h-7 text-center border rounded-lg text-sm font-bold">
            <button onclick="updateBonQty(${idx},1)" class="w-7 h-7 bg-white border rounded-full flex items-center justify-center">+</button>
          </div>
          <span class="text-xs text-gray-500">×</span>
          <input type="number" value="${item.price||0}" step="0.01" onchange="updateBonPrice(${idx},this.value)" class="w-20 h-7 border rounded-lg text-sm px-2">
          <span class="text-xs">درهم</span>
        </div>
      </div>
      <button onclick="removeFromBon(${idx})" class="w-8 h-8 bg-red-50 text-red-500 rounded-full flex items-center justify-center"><i class="fa-solid fa-trash text-xs"></i></button>
    </div>
  `).join('');
  const total = currentBonItems.reduce((s,i)=>s+(parseFloat(i.price)||0)*(parseInt(i.qty)||0),0);
  document.getElementById('bonTotal').textContent = total.toFixed(2)+' درهم';
}

window.updateBonQty = function(idx, delta){
  currentBonItems[idx].qty = Math.max(0, (parseInt(currentBonItems[idx].qty)||0)+delta);
  if(currentBonItems[idx].qty===0) currentBonItems.splice(idx,1);
  renderBonItems();
}
window.updateBonQtyInput = function(idx, val){
  currentBonItems[idx].qty = Math.max(0, parseInt(val)||0);
  renderBonItems();
}
window.updateBonPrice = function(idx, val){
  currentBonItems[idx].price = parseFloat(val)||0;
  renderBonItems();
}
window.removeFromBon = function(idx){
  currentBonItems.splice(idx,1);
  renderBonItems();
}

window.saveBonEdits = async function(){
  if(!currentViewingClient) return;
  try{
    const bonData = {items: currentBonItems, updatedAt: new Date().toISOString()};
    await set(ref(db, `clientBons/${currentViewingClient}`), bonData);
    showToast('تم حفظ تعديلات بون '+currentViewingClient,'success');
    await loadData();
    renderBonItems();
  } catch(e){ showToast('خطأ: '+e.message,'error'); }
}

window.deleteClientBon = async function(){
  if(!currentViewingClient) return;
  if(!confirm(`حذف بون ${currentViewingClient} نهائياً؟`)) return;
  try{
    await remove(ref(db, `clientBons/${currentViewingClient}`));
    // احذف أيضاً من orders
    for(const order of (groupedByClient[currentViewingClient]||[])){
      if(order.id) await remove(ref(db, `orders/${order.id}`)).catch(()=>{});
    }
    closeBon();
    await loadData();
    showToast('تم الحذف','success');
  } catch(e){ showToast('خطأ: '+e.message,'error'); }
}

window.openAddProductToBon = function(){
  document.getElementById('addProductModal').classList.add('active');
  renderProductsToAdd('');
}
window.closeAddProductModal = function(){ document.getElementById('addProductModal').classList.remove('active'); }

function renderProductsToAdd(filter=''){
  const container = document.getElementById('productsToAdd');
  let list = allProducts;
  if(filter) list = list.filter(p=>(p.name||'').toLowerCase().includes(filter.toLowerCase()));
  container.innerHTML = list.slice(0,30).map(p=>`
    <div class="flex items-center justify-between p-2 hover:bg-gray-50 rounded-xl cursor-pointer" onclick="addProductToBon('${p.id}')">
      <div class="flex items-center gap-2">
        <img src="${p.mainImage||p.images?.[0]||'https://via.placeholder.com/40'}" class="w-10 h-10 rounded-lg object-cover">
        <div><p class="font-bold text-sm">${p.name}</p><p class="text-xs text-gray-500">${parseFloat(p.price||0).toFixed(2)} درهم</p></div>
      </div>
      <button class="w-8 h-8 bg-emerald-600 text-white rounded-full"><i class="fa-solid fa-plus text-xs"></i></button>
    </div>
  `).join('');
}
window.addProductToBon = function(productId){
  const p = allProducts.find(x=>x.id==productId);
  if(!p) return;
  const existing = currentBonItems.find(i=>i.productId==p.id);
  if(existing) existing.qty++;
  else currentBonItems.push({productId:p.id, name:p.name, qty:1, price:p.price||0, mainImage:p.mainImage||p.images?.[0]});
  renderBonItems();
  closeAddProductModal();
  showToast('تمت الإضافة','success');
}

window.closeBon = function(){ document.getElementById('bonModal').classList.remove('active'); currentViewingClient=null; }

window.printBon = function(){
  if(!currentViewingClient || currentBonItems.length===0) return;
  document.getElementById('printClient').textContent = `بون ${currentViewingClient}`;
  document.getElementById('printDate').textContent = new Date().toLocaleDateString('ar-MA');
  const total = currentBonItems.reduce((s,i)=>s+(parseFloat(i.price)||0)*(parseInt(i.qty)||0),0);
  document.getElementById('printTotal').textContent = total.toFixed(2)+' درهم';
  document.getElementById('printItems').innerHTML = currentBonItems.map(i=>`
    <div style="display:flex;justify-content:space-between;border-bottom:1px dashed #ddd;padding:6px 0">
      <span>${i.name} ×${i.qty}</span>
      <span>${(i.price*i.qty).toFixed(2)} درهم</span>
    </div>
  `).join('');
  window.print();
}

document.getElementById('tabPersons').addEventListener('click', ()=>{
  document.getElementById('tabPersons').classList.add('bg-emerald-600','text-white');
  document.getElementById('tabPersons').classList.remove('text-gray-600');
  document.getElementById('tabTotal').classList.remove('bg-emerald-600','text-white');
  document.getElementById('tabTotal').classList.add('text-gray-600');
  document.getElementById('personsContainer').classList.remove('hidden');
  document.getElementById('totalContainer').classList.add('hidden');
});
document.getElementById('tabTotal').addEventListener('click', ()=>{
  document.getElementById('tabTotal').classList.add('bg-emerald-600','text-white');
  document.getElementById('tabTotal').classList.remove('text-gray-600');
  document.getElementById('tabPersons').classList.remove('bg-emerald-600','text-white');
  document.getElementById('tabPersons').classList.add('text-gray-600');
  document.getElementById('personsContainer').classList.add('hidden');
  document.getElementById('totalContainer').classList.remove('hidden');
});

document.getElementById('productSearch')?.addEventListener('input', e=>renderProductsToAdd(e.target.value));

function showToast(msg,type='success'){
  const toast=document.getElementById('toast');
  const icon=document.getElementById('toastIcon');
  const m=document.getElementById('toastMessage');
  m.textContent=msg;
  icon.className=type==='success'?'fa-solid fa-check-circle text-emerald-400':type==='error'?'fa-solid fa-circle-exclamation text-red-400':'fa-solid fa-info-circle text-blue-400';
  toast.classList.remove('hidden');
  setTimeout(()=>toast.classList.add('hidden'),3000);
}
